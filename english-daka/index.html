<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>英语打卡 · 课程目录</title>
<meta name="theme-color" content="#F0F7FF">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<!-- iOS 对 svg 的 apple-touch-icon 支持不好(多半会退回网页截图),写上无害;
     要真正好看得给它一张 png,但那需要引依赖来压图,先不做 -->
<link rel="apple-touch-icon" href="icon.svg">

<style>
  :root{
    --bg:#F0F7FF; --ink:#2B3A55;
    --pink:#FF6FA5; --yellow:#FFC53D; --green:#4CC26E; --blue:#3E8BFF;
    /* 封面色:比主题色深一档,保证巨大白字的对比度达标 */
    --c1:#E85C93; --c2:#2F7BEF; --c3:#37A85B; --c4:#8557EA; --c5:#EE8420;
    /* 封面尺寸随屏幕走:手机上占到六成屏宽,大屏封顶 */
    --cw:clamp(212px, 64vw, 268px); --ch:calc(var(--cw) * 1.28);
  }
  *{
    box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  }
  /* 必须写在 html 上,只写 body 是没用的(原来就只写了 body,实测页面照样能横滚
     290px):body 的 overflow-x:hidden 配 overflow-y:visible 会让 body 自己变成
     滚动容器,就不再往视口传递了;视口的溢出行为取的是 html 的值。
     不封住的后果:折叠到最外侧的卡片被 translateX 甩出 .stage(它是 overflow:visible),
     整页因此横向可滚 —— 平板上 414px 宽能滚 290px。手指在封面流上横划时,
     浏览器会顺手把整页一起平移,看着就是"整个页面在抖"(标题、分组标题全在跟着动)。
     ⚠️ overflow-x:hidden 不能删,理由就是上面这一整段。
     background 是另一回事:目录页 ⇄ 课程页是整页跳转,新文档在样式生效前会先刷
     一帧浏览器默认白底,深色封面跳过去就是"啪"一下白闪。写在 html 上首帧就有色 */
  html{ overflow-x:hidden; background:var(--bg); }
  body{
    /* 与 theme.css 的 --font-main 保持同序:英文圆体优先、中文回落苹方。
       theme.css 万一没加载,这里也不能把 PingFang 排在英文字体前面 */
    font-family:ui-rounded,"SF Pro Rounded","Arial Rounded MT Bold",
                "Comic Sans MS","Trebuchet MS","PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--ink); min-height:100vh; padding-bottom:44px;
    overflow-x:hidden;
  }
  header{text-align:center;padding:24px 16px 10px;}
  header h1{font-size:26px;letter-spacing:2px;}
  header p{font-size:13px;color:#5E6E8C;margin-top:6px;font-weight:600;}

  /* ===== 骨架屏 =====
     课程清单要等一次网络往返才回来,那之前整页只有一个标题和一片空白 ——
     看着像"打不开",家长会去刷新。先摆三个灰块占住位置,尺寸跟真封面一样,
     数据到了就地换掉,画面不跳。
     ⚠️ 只做形状不做内容:骨架里写"加载中"之类的字,孩子也读不懂,
     而且真数据到了字一闪就没,反而是干扰。 */
  .skel{max-width:720px;margin:0 auto;padding:0 16px;}
  .skel-head{height:16px;width:150px;border-radius:8px;margin:26px 2px 10px;}
  .skel-row{display:flex;gap:12px;justify-content:center;overflow:hidden;}
  .skel-card{
    flex:none;width:var(--cw);height:var(--ch);border-radius:22px;
  }
  /* 侧边那两张按真封面的折叠感缩一点,别是三个一样大的方块 */
  .skel-card.side{transform:scale(.82);opacity:.6;}
  .skel-head,.skel-card{background:#DCE7F5;animation:skel-pulse 1.4s ease-in-out infinite;}
  @keyframes skel-pulse{0%,100%{opacity:.5;}50%{opacity:.9;}}
  @media (prefers-reduced-motion:reduce){
    .skel-head,.skel-card{animation:none;opacity:.6;}
  }

  /* ===== 专辑架 ===== */
  .shelf{max-width:720px;margin:0 auto;padding:0 16px;}
  .shelf-head{
    display:flex;align-items:center;gap:10px;
    margin:26px 2px 6px;font-size:15px;font-weight:900;color:var(--ink);
  }
  .shelf-head .rule{height:3px;background:#DCE7F5;flex:1;border-radius:9px;}
  .shelf-head .count{font-size:12px;font-weight:700;color:#5E6E8C;}

  /* 通栏:侧边卡片会画到内容宽度之外,手势区必须跟着铺满,
     否则去拨那张侧卡是没反应的(最自然的拨动位置反而失灵) */
  .stage{
    position:relative;height:calc(var(--ch) + 34px);perspective:1200px;
    width:100vw;margin-left:calc(50% - 50vw);
    touch-action:pan-y;cursor:grab;
  }
  .stage.grabbing{cursor:grabbing;}
  /* rack 自己不能接点击:它在 z=0 平面且铺满整个 stage,而折叠的卡都被
     translateZ(-88px) 推到它后面 —— 3D 上下文里排序看深度,rack 就挡在所有
     折叠卡前面,「点侧卡转到中间」实际上一直是坏的(最外侧那张整片点不到,
     第二张只剩 30px 能点)。改成 none 之后各卡的可点区间才和画出来的位置对上。 */
  .rack{position:absolute;inset:0;transform-style:preserve-3d;pointer-events:none;}

  .cover{
    position:absolute;left:50%;top:50%;width:var(--cw);height:var(--ch);
    margin:calc(var(--ch) / -2) 0 0 calc(var(--cw) / -2);
    display:flex;flex-direction:column;text-decoration:none;color:var(--ink);
    background:#fff;border-radius:20px;overflow:hidden;
    box-shadow:0 8px 22px rgba(43,58,85,.16);
    will-change:transform,opacity;
    pointer-events:auto;                       /* 父级 .rack 是 none,卡片要自己收回来 */
  }
  /* 位置/阴影/文字全部由 rAF 弹簧逐帧驱动,不用 CSS 过渡 ——
     混用会让阴影和文字比卡片慢半拍,滑动时看着就是"颜色闪一下" */
  .cover::after{
    content:"";position:absolute;inset:0;pointer-events:none;border-radius:20px;
    background:linear-gradient(var(--g,90deg), rgba(20,30,50,.42), rgba(20,30,50,0) 72%);
    opacity:var(--shade,0);
  }
  .cover .art{
    flex:1;display:flex;align-items:center;justify-content:center;
    background:var(--c);
    position:relative;                         /* 星数角标的定位基准 */
  }
  .cover .glyph{
    font-size:calc(var(--cw) * 0.42);font-weight:900;color:#fff;line-height:1;
    text-shadow:0 3px 0 rgba(0,0,0,.13);
  }
  .cover .glyph.long{font-size:calc(var(--cw) * 0.25);letter-spacing:-1px;}
  /* 折叠后文字既读不了又会被邻卡切断,淡出只留封面画面 */
  .cover .label{padding:13px 15px 15px;background:#fff;}
  .cover .label > *{opacity:var(--lab,1);}
  .cover .en{font-size:17px;font-weight:900;line-height:1.2;}
  .cover .cn{font-size:13px;color:#5E6E8C;font-weight:700;margin-top:3px;
             white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .cover .n{font-size:12px;color:#5E6E8C;font-weight:700;margin-top:5px;}
  .cover:focus-visible{outline:4px solid var(--blue);outline-offset:3px;}

  /* ===== 打卡条 ===== */
  /* 最近 7 天一天一个点。天天来的孩子看的就是这一行 —— 空心变实心是他能自己
     看懂的唯一"进度"。无记录时也照常显示 7 个空点:空着的格子才是要填的邀请 */
  .checkin{
    max-width:360px;margin:var(--sp-3,16px) auto 0;padding:9px 14px;
    background:#fff;border:2px solid var(--line,#DCE5F2);border-radius:16px;
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    box-shadow:0 3px 10px rgba(43,58,85,.08);
  }
  /* 内容是 JS 填的:老浏览器解析不了脚本时别在标题下留一个空白盒子 */
  .checkin:empty{display:none;}
  .checkin-days{display:flex;gap:5px;}
  .cday{display:flex;flex-direction:column;align-items:center;gap:3px;}
  .cdot{
    width:20px;height:20px;border-radius:50%;
    border:2px solid #CFDCEE;background:#fff;box-sizing:border-box;
  }
  .cdot.on{background:var(--yellow);border-color:#E9A800;}
  /* 今天那格加一圈蓝描边:七个点长得一样时,孩子分不清哪个是"今天该点亮的" */
  .cday.today .cdot{border-color:var(--blue);box-shadow:0 0 0 3px rgba(62,139,255,.28);}
  .cw{font-size:11px;font-weight:700;color:#5E6E8C;line-height:1;}
  .cday.today .cw{color:var(--blue);}
  .checkin-streak{font-size:15px;font-weight:900;white-space:nowrap;}

  /* ===== header 行动区 ===== */
  .acts{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:14px;}
  /* 「继续学」在有存档时是唯一的主行动:直接回到昨天那一课,省掉在架子上找 */
  .go-btn{
    display:inline-flex;align-items:center;justify-content:center;
    min-height:52px;max-width:94%;padding:12px 26px;border-radius:999px;
    background:var(--green);color:#fff;font-weight:900;font-size:17px;
    text-decoration:none;box-shadow:0 4px 0 rgba(0,0,0,.14);line-height:1.25;
  }
  .go-btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.14);}
  .go-btn:focus-visible{outline:4px solid var(--blue);outline-offset:3px;}

  /* 复习入口放在目录页顶部而不是做成一节课:它不属于任何分组,
     而且每次进去内容都不一样,当成"课"会误导 */
  .review-btn{
    display:inline-block;padding:10px 20px;border-radius:999px;
    background:var(--green);color:#fff;font-weight:900;font-size:15px;
    text-decoration:none;box-shadow:0 3px 0 rgba(0,0,0,.12);
  }
  .review-btn:active{transform:translateY(2px);box-shadow:none;}
  .review-btn:focus-visible{outline:4px solid var(--blue);outline-offset:3px;}
  /* 有「继续学」时复习降级为次按钮:两个绿胶囊并排等于没有主次 */
  .review-btn.ghost{
    background:#fff;color:var(--ink);border:2px solid var(--line,#DCE5F2);
    box-shadow:none;
  }
  .review-btn.ghost:active{transform:translateY(2px);}

  /* 封面右上角的星数角标:白底小胶囊,压在画面上但不遮巨型字形 */
  .cover-stars{
    position:absolute;top:8px;right:8px;
    padding:2px 9px;border-radius:999px;
    background:rgba(255,255,255,.94);color:var(--ink);
    font-size:13px;font-weight:900;line-height:1.5;
    box-shadow:0 2px 6px rgba(43,58,85,.18);
  }

  /* 单手时点圆点比滑动省力,所以点击区做到 30px,视觉上仍是小圆点 */
  .dots{display:flex;gap:2px;justify-content:center;margin-top:2px;flex-wrap:wrap;}
  .dot{
    width:30px;height:30px;border:none;padding:0;background:none;
    cursor:pointer;display:flex;align-items:center;justify-content:center;
  }
  .dot::before{
    content:"";width:9px;height:9px;border-radius:50%;background:#CFDCEE;
    transition:all .3s ease;
  }
  .dot.on::before{background:var(--blue);width:24px;border-radius:5px;}
  .dot:focus-visible{outline:3px solid var(--blue);outline-offset:-3px;border-radius:8px;}
  /* 节数多的组(字母课 11 节)按原尺寸要 11×30 + 10×2 = 350px,320px 屏上折成两行,
     把下一个分组的标题一起顶下去,那一行圆点也就不再像"这一组有多长"了。
     .many 只压**视觉**:圆点 9→6px、选中胶囊 24→16px、gap 归零,
     点击区仍是 26×30px(手指 26px 够用,而竖向没被压)。
     11×26=286px,320px 屏减掉 .shelf 的左右各 16px 正好剩 288px,单行放得下。
     ⚠️ 别顺手把 .dot 的 height 也压下去 —— 竖向不是瓶颈,压了纯粹是变难点 */
  .dots.many{gap:0;}
  .dots.many .dot{width:26px;}
  .dots.many .dot::before{width:6px;height:6px;}
  .dots.many .dot.on::before{width:16px;border-radius:4px;}

  .note{
    max-width:520px;margin:20px auto 0;padding:14px 16px;
    font-size:13px;color:#5E6E8C;text-align:center;line-height:1.7;
  }
  /* 卡片动画由 rAF 驱动,减弱动效时脚本会直接跳到位;这里只关掉圆点的过渡 */
  @media (prefers-reduced-motion: reduce){
    .dot::before{transition:none;}
  }

  /* 目录页 ⇄ 课程页的跨文档过渡(渐进增强)。不认识 @view-transition 的浏览器
     按 CSS 错误恢复规则整块跳过,退回原来的硬跳转,不会坏。
     ⚠️ 两页都要声明,app.html 里有一份一样的,少一边就不生效。
     减弱动效时不写 navigation:none(嵌套 @view-transition 的支持度不明),
     改成把快照的动画关掉 —— 效果一样是瞬时,而且是稳的选择器语法 */
  @view-transition{ navigation:auto; }
  @media (prefers-reduced-motion:reduce){
    ::view-transition-group(*),
    ::view-transition-old(root),
    ::view-transition-new(root){ animation:none !important; }
  }
</style>
<link rel="stylesheet" href="theme.css">
</head>
<body>
<header>
  <h1>🌟 我的英语打卡 🌟</h1>
  <p>左右滑动挑一张，点中间那张开始</p>
  <div class="checkin" id="checkin"></div>
  <div class="acts" id="acts">
    <a class="review-btn" id="reviewBtn" href="app.html?lesson=review">🔄 混合复习 · 各课随机抽题</a>
    <!-- 错题本入口常驻,不因空而藏:空的时候点进去是庆祝页,空不是缺失是成就。
         有在练的词时由脚本把数带上;始终是白底次按钮,主行动留给复习/继续学 -->
    <a class="review-btn ghost" id="wrongBtn" href="app.html?lesson=review&pick=wrong">📕 错题本</a>
  </div>
</header>
<div id="shelves"></div>
<div class="note" id="note"></div>

<!-- Service Worker 注册:装到主屏后没网也能打开,音频/配图边用边缓。
     ⚠️ 单独成块、只用 ES5 写,和上面的白屏兜底一个道理 —— 这段要在
     不支持 SW 的老内核上也能安全跳过,而不是把整个脚本块拖垮。
     ⚠️ 等 load 再注册:注册本身会抢一点主线程和带宽,不该和首屏渲染挤在一起。
     ⚠️ 壳(HTML)在 sw.js 里是 network-first,所以联网时永远拿到新代码,
     不会出现"改了上线用户还是旧版"。详见 sw.js 顶部注释。 -->
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    try {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    } catch (e) {}
  });
}
</script>

<!-- 白屏兜底:页面内容全是 JS 渲染的,JS 一旦解析失败(老浏览器不认新语法)
     或初始化抛错,就会留下一片空白,看不出任何线索。这段单独成块、且只用 ES5 写,
     老浏览器也能跑,负责把错误显示在页面上。加新语法前先想想这里的兜底还在不在。 -->
<script>
window.onerror = function (msg, src, line) {
  var d = document.getElementById("fatalErr");
  if (!d) {
    d = document.createElement("div");
    d.id = "fatalErr";
    d.style.cssText = "margin:16px;padding:14px;border:2px solid #FF6FA5;border-radius:12px;"
      + "background:#FFF3F6;color:#333;font:14px/1.6 -apple-system,system-ui,sans-serif;"
      + "white-space:pre-wrap;word-break:break-word;";
    (document.body || document.documentElement).appendChild(d);
  }
  d.textContent = "\u9875\u9762\u6ca1\u80fd\u52a0\u8f7d \u2014\u2014 \u6d4f\u89c8\u5668\u7248\u672c\u53ef\u80fd\u592a\u65e7\u3002\n\u628a\u4e0b\u9762\u8fd9\u6bb5\u622a\u56fe\u53d1\u7ed9\u5f00\u53d1\u8005\uff1a\n\n"
    + msg + "\n" + (src || "") + "  \u7b2c " + line + " \u884c\n\n" + navigator.userAgent;
  return false;
};
</script>
<script>
/* ================================================================
   进度存档 —— 与 app.html 里的是同一份代码、同一个 key，改一处要同步改两处。
   { total, lessons:{id:{stars,done}}, days:["YYYY-MM-DD"], last:{lesson,at} }
   ⚠️ 隐私模式 / 关了站点数据的浏览器，光是碰 localStorage 就可能抛，所以每次
   读写各自包 try/catch，失败就静默退回"没有存档"的样子 —— 这一页是纯 JS 渲染的，
   顶层抛一个错就是整片白屏（页面底下那段 window.onerror 兜底就是为这个留的）。
   ⚠️ 日期本地时区手拼，不用 toISOString()（那是 UTC，晚上会记成明天）。
   ================================================================ */
var STORE_KEY = "daka.v1";
function ymd(d){
  var m = d.getMonth() + 1, day = d.getDate();
  return d.getFullYear() + "-" + (m < 10 ? "0" : "") + m + "-" + (day < 10 ? "0" : "") + day;
}
var store = {
  load: function(){
    var o = null;
    try{
      var s = localStorage.getItem(STORE_KEY);
      if(s) o = JSON.parse(s);
    }catch(e){ o = null; }
    if(!o || typeof o !== "object") o = {};
    if(typeof o.total !== "number" || !isFinite(o.total)) o.total = 0;
    if(!o.lessons || typeof o.lessons !== "object") o.lessons = {};
    if(!(o.days instanceof Array)) o.days = [];
    if(!o.last || typeof o.last !== "object") o.last = null;
    return o;
  },
  save: function(o){
    try{ localStorage.setItem(STORE_KEY, JSON.stringify(o)); return true; }
    catch(e){ return false; }
  }
};
/* 连续天数:从今天往回逐日查;今天还没打就从昨天起算(白天打开时不该显示 0),
   昨天也没有才是真的断了。setDate(-1) 自带跨月跨年,别自己算天数。 */
function streakOf(days){
  var set = {}, i;
  for(i = 0; i < days.length; i++) set[days[i]] = 1;
  var d = new Date();
  if(!set[ymd(d)]){
    d.setDate(d.getDate() - 1);
    if(!set[ymd(d)]) return 0;
  }
  var n = 0;
  while(set[ymd(d)]){ n++; d.setDate(d.getDate() - 1); }
  return n;
}

/* 一次性示能演示的记账 —— 键 "daka.coach"({shelf:1,card:1,press:1}),
   和 app.html 里的是同一份代码、同一个键,改一处要同步改两处。
   ⚠️ 读不到(隐私模式抛错)一律当"做过了":标记存不住的浏览器里,
   演示会每次进页面都放一遍,那比不演示更烦人。 */
var COACH_KEY = "daka.coach";
function coachDone(k){
  try{
    var s = localStorage.getItem(COACH_KEY);
    var o = s ? JSON.parse(s) : null;
    return !!(o && typeof o === "object" && o[k]);
  }catch(e){ return true; }
}
function markCoach(k){
  try{
    var s = localStorage.getItem(COACH_KEY);
    var o = s ? JSON.parse(s) : null;
    if(!o || typeof o !== "object") o = {};
    o[k] = 1;
    localStorage.setItem(COACH_KEY, JSON.stringify(o));
  }catch(e){}
}

/* 封面流的停留位置记在 sessionStorage(不是 localStorage):从课程页返回时
   回到刚才那张,但下次重新打开应用还是从头开始 —— 位置是"这一趟"的上下文 */
var SHELF_KEY = "daka.shelf";
function shelfMem(){
  try{
    var s = sessionStorage.getItem(SHELF_KEY);
    if(s){ var o = JSON.parse(s); if(o && typeof o === "object") return o; }
  }catch(e){}
  return {};
}
function saveShelfMem(group, n){

/* 封面色 —— 旧写法是五色按**组内序号**循环,于是每个组的第一张永远是同一个粉色、
   第二张永远是同一个蓝色:颜色只表达"你是这组的第几张",不表达"你属于哪一组"。
   翻到第三屏时家长和孩子都认不出自己滑到哪儿了。
   改成一组一个主色相,组内只在同色的 2~3 档深浅之间轮换 —— 色相认组,深浅分张。
   ⚠️ 明度全部对齐现有 --c1..--c5 的水平(白底巨型字形的对比度 2.6~6.4:1),
   任何一档都不许再往浅了调:封面上那个字号的白字是这一页唯一的信息,
   浅一档就糊在底色里了。橙/绿两组的第三档试过都掉到 2.3~2.6 以下,所以只留两档。
   ⚠️ 按**组名关键字**匹配(中英各写一条,课程数据两种写法都出现过);
   匹配不上的组(比如以后的 8xx 绘本)照旧走五色循环,不至于没颜色。 */
const COVER_COLORS = ["var(--c1)","var(--c2)","var(--c3)","var(--c4)","var(--c5)"];
const GROUP_COLORS = [
  {re:/字母|letter/i,        colors:["#2F7BEF","#1F63CC","#4C93FF"]},  /* 蓝 */
  {re:/词族|word\s*family/i, colors:["#8557EA","#6E3FD1","#9C74F5"]},  /* 紫 */
  {re:/拼读|phonics/i,       colors:["#EE8420","#C86A10"]},            /* 橙 */
  {re:/常见词|sight/i,       colors:["#E85C93","#C9407A","#F0729F"]},  /* 粉 */
  {re:/主题|topic/i,         colors:["#37A85B","#268A47"]},            /* 绿 */
  {re:/数学|math/i,          colors:["#1F8FA8","#16748A","#2AA0BC"]},  /* 青 */
  {re:/科学|science/i,       colors:["#2E8B74","#1F7160","#3A9E87"]}   /* 深绿 */
];
function coverColors(group){
  const g = group ? String(group) : "";
  for(let i = 0; i < GROUP_COLORS.length; i++){
    if(GROUP_COLORS[i].re.test(g)) return GROUP_COLORS[i].colors;
  }
  return COVER_COLORS;
}

/* 卡片在架子上的位置 —— off 是它离中心的距离(可为小数,拖动时连续变化) */
function placeCover(el, off){
  const a = Math.abs(off), sign = off < 0 ? -1 : 1;
  if(a > 2.6){                                   // 太远的收起来,不参与布局
    if(el.dataset.parked === "1") return;        // 已收起就别再写样式(逐帧调用,省开销)
    el.dataset.parked = "1";
    el.style.opacity = 0;
    el.style.transform = `translateX(${sign*160}%) scale(.5)`;
    el.style.zIndex = 0;
    // opacity:0 只是看不见,照样能点中 —— 而且收起来的卡全叠在 translateX(±160%)
    // 同一个点上,那正好是最外侧那张折叠卡画着的位置。少了这行,点那片"空白"
    // 命中的是收起来的最后一张,画面直接跳到最后一课(实测最外侧那张整片点不到)。
    // 注意光靠 zIndex 压不住:.rack 是 transform-style:preserve-3d,3D 上下文里
    // 排序看的是深度 —— 折叠卡都被 translateZ(-88px) 推远了,收起来的卡 z 是 0,
    // 反而离观众最近,稳稳压在前面。
    el.style.pointerEvents = "none";
    el.setAttribute("tabindex", "-1");
    return;
  }
  el.dataset.parked = "0";
  el.style.pointerEvents = "auto";
  const cl   = Math.max(-2.4, Math.min(2.4, off));
  const near = Math.min(a, 1);                   // 第一格就折到位,再远只微调
  const far  = Math.max(0, Math.min(a, 2.4) - 1);
  const rot  = -sign * (near * 44 + far * 7);    // 折叠角度
  // 横向偏移:侧卡转 44° 后投影只剩约 6 成宽,偏移要够大才不会盖住彼此的标题
  const x    = cl * 76;
  const sc   = 1 - Math.min(a, 2.4) * 0.15;
  const z    = -Math.min(a, 2.4) * 44;
  el.style.transform =
    `translateX(${x}%) translateZ(${z}px) rotateY(${rot}deg) scale(${sc})`;
  el.style.opacity  = a > 2 ? Math.max(0, (2.6 - a) / 0.6) : 1;
  el.style.zIndex   = 100 - Math.round(a * 10);
  el.style.setProperty("--shade", Math.min(a, 1.6) / 1.6 * 0.9);
  // 暗的是转离观众的那条边:右侧卡右缘后仰,左侧卡左缘后仰
  el.style.setProperty("--g", off < 0 ? "90deg" : "270deg");
  el.style.setProperty("--lab", String(1 - Math.min(a, 0.85) / 0.85));
  el.setAttribute("tabindex", a < 0.5 ? "0" : "-1");
}

function buildShelf(group, lessons, first){
  const wrap = document.createElement("section");
  wrap.className = "shelf";
  wrap.innerHTML =
    `<div class="shelf-head"><span>${group}</span>` +
    `<span class="count">${lessons.length} 节</span><span class="rule"></span></div>` +
    `<div class="stage"><div class="rack"></div></div><div class="dots"></div>`;
  const stage = wrap.querySelector(".stage");
  const rack  = wrap.querySelector(".rack");
  const dots  = wrap.querySelector(".dots");
  const palette = coverColors(group);
  /* 8 节以上的组(字母课有 11 节)圆点会挤成两行,还把下一组的标题推下去 ——
     视觉上收成迷你进度条(点击热区不动,单手点圆点比滑动省力,那是有用的) */
  if(lessons.length >= 8) dots.classList.add("many");

  lessons.forEach((l, i) => {
    const [en, cn] = String(l.title).split(" · ");
    // 不用 ?? ——它是 ES2020 语法,iOS 13.4 以下的 Safari 解析不了整个 <script>,
    // 页面会一节课都不显示。下面这写法语义等价(只在 null/undefined 时回落)
    const glyph = l.badge != null ? l.badge : (l.num != null ? l.num : "•");
    const a = document.createElement("a");
    a.className = "cover";
    a.href = `app.html?lesson=${l.id}`;
    a.draggable = false;
    a.style.setProperty("--c", palette[i % palette.length]);
    // 这一课攒了多少星:攒过才显示,0 星的课挂个「⭐ 0」等于提醒他没做
    const rec = SAVE.lessons[l.id];
    const got = rec && typeof rec.stars === "number" ? rec.stars : 0;
    a.innerHTML =
      `<div class="art"><span class="glyph${String(glyph).length > 2 ? " long" : ""}">${glyph}</span>` +
      (got > 0 ? `<span class="cover-stars">⭐ ${got}</span>` : ``) + `</div>` +
      `<div class="label"><div class="en">${en}</div>` +
      `<div class="cn">${cn || l.badge_sub || ""}</div>` +
      `<div class="n">${l.words} 张卡片</div></div>`;
    rack.appendChild(a);

    const d = document.createElement("button");
    d.className = "dot"; d.type = "button";
    d.setAttribute("aria-label", `第 ${i+1} 张：${en}`);
    d.onclick = () => go(i);
    dots.appendChild(d);
  });

  const covers = [...rack.children];
  const LAST = covers.length - 1;
  // 走 window. 而不是裸 matchMedia:全局不存在时裸标识符会抛 ReferenceError,
  // 而这是顶层代码,一抛错整个 <script> 就停,页面白屏(同 app.html 的 TTS 探测)
  const SLOW = !!(window.matchMedia &&
                  window.matchMedia("(prefers-reduced-motion: reduce)").matches);

  // 卡片行程是卡宽的 76%,但手指只需走它的一半就翻一张 ——
  // 单手拇指的舒适行程只有 60~100px,1:1 跟手对鼠标合适,对拇指就是"滑不动"
  // 同上,不用可选链 ?.(ES2020 语法)
  const TRAVEL = () => ((covers[0] && covers[0].offsetWidth) || 212) * 0.76;
  const STEP   = () => TRAVEL() * 0.5;

  /* pos 是连续的位置(2.4 表示停在第 2、3 张之间),弹簧把它推向 target。
     位置/折叠/阴影/文字全部由 pos 逐帧算出,所以永远同步,不会有谁慢半拍。*/
  let pos = 0, vel = 0, target = 0, raf = 0;
  let dragging = false, moved = false, armed = false, ptr = null,
      startX = 0, startPos = 0,
      lastX = 0, lastT = 0, track = 0,           // track: 速度(张/毫秒)
      downCard = null;                           // 按下时手指/鼠标压住的那张卡

  /* 手指按住不动时,触摸屏上报的接触点质心会在相邻两个估计值之间反复跳(指腹越大越明显)。
     卡片行程是手指行程的 2 倍(见 STEP),8px 的原始跳变会被放大成 17px 的卡片哆嗦。
     实测:孩子按住一张卡犹豫两秒,整行就跟着抖两秒 —— 逐帧量过是干净的双稳态方波,
     在两个位置之间来回跳、没有中间值,所以不是手在抖,是 pos 直接吃了未经处理的 clientX。
     两道防线:DEAD 死区挡住"按住不动",LOWPASS 滤掉真拖动时残余的指腹抖。 */
  const DEAD    = 10;                            // 手指越过这么多像素才算真的在拖
  const LOWPASS = 0.35;                          // pos 向目标追的比例,滞后 1~2 帧,察觉不到

  const clamp = n => Math.max(0, Math.min(LAST, n));
  const idx   = () => clamp(Math.round(pos));

  function paint(){
    covers.forEach((c, i) => placeCover(c, i - pos));
    const a = idx();
    [...dots.children].forEach((d, i) => d.classList.toggle("on", i === a));
  }
  function tick(){
    // 刚度/阻尼实测过:0.20/0.75 大力甩会过冲 70%(弹过头一张多),
    // 0.10/0.66 过冲收到 4~8%,只留一点点回弹,而且落定更快(约 0.42s)
    vel += (target - pos) * 0.10;                // 弹簧刚度
    vel *= 0.66;                                 // 阻尼
    pos += vel;
    if(Math.abs(target - pos) < 0.004 && Math.abs(vel) < 0.004){
      pos = target; vel = 0; raf = 0; paint(); return;
    }
    paint();
    raf = requestAnimationFrame(tick);
  }
  function spring(){ if(!raf) raf = requestAnimationFrame(tick); }
  function go(n){
    target = clamp(n);
    if(SLOW){ pos = target; vel = 0; paint(); return; }
    spring();
  }

  stage.addEventListener("pointerdown", e => {
    // 只让主指针开新的拖动:第二根手指(握平板的虎口最常见)按下来不该抢走这一次手势。
    // 写 === false 而不是 !e.isPrimary —— 万一某个浏览器没这个属性,不能把拖动整个废掉
    if(e.isPrimary === false) return;
    if(raf){ cancelAnimationFrame(raf); raf = 0; }
    dragging = true; moved = false; armed = false; vel = 0; track = 0;
    ptr = e.pointerId;
    downCard = e.target.closest(".cover");
    startX = lastX = e.clientX; startPos = pos; lastT = performance.now();
    stage.classList.add("grabbing");
    stage.setPointerCapture(e.pointerId);
  });
  stage.addEventListener("pointermove", e => {
    // 认准按下时那根手指。少了这句,第二个指针的 move 也会进来,
    // 而 startX 是别人的 —— 两个指针交替刷新 pos,画面在两张卡之间来回跳
    if(!dragging || e.pointerId !== ptr) return;
    const dx = e.clientX - startX;
    if(!armed){
      if(Math.abs(dx) < DEAD) return;            // 还在死区里:一帧都不画,按住不动就是不动
      // 过线这一刻把原点搬到当前位置(dx 归零),否则卡片会"啪"地跳 DEAD/STEP 那么远。
      // 计时/测速也一起重置,免得死区里干等的那段时间被算进甩动惯性
      armed = moved = true;                      // moved:区分点按和拖动,阈值同 DEAD
      startX = lastX = e.clientX; lastT = performance.now(); track = 0;
      return;
    }
    let p = startPos - dx / STEP();
    if(p < 0) p *= 0.35;                         // 到头了给点橡皮筋阻尼
    else if(p > LAST) p = LAST + (p - LAST) * 0.35;
    pos += (p - pos) * LOWPASS;                  // 一阶低通:跟手,但不跟指腹的抖
    const now = performance.now(), dt = Math.max(1, now - lastT);
    track = track * 0.7 + ((lastX - e.clientX) / STEP() / dt) * 0.3;
    lastX = e.clientX; lastT = now;
    paint();
  });
  const release = (flick) => {
    if(!dragging) return;
    dragging = false; ptr = null;
    stage.classList.remove("grabbing");
    if(!flick){ vel = 0; go(Math.round(pos)); return; }  // 手势被打断:就近稳住,别再甩
    // 没拖动 = 一次点按。跳转由这里接管:指针捕获会把 click 重定向到 stage,
    // 那个 <a> 收不到 click,靠默认行为进不去课程(桌面鼠标必现)
    if(!moved && downCard){
      const i = covers.indexOf(downCard);
      // 记下停在第几张:从课程页返回时直接落回这里,不用再滑一遍
      if(i === idx()) { saveShelfMem(group, i); location.href = downCard.href; return; }   // 点中间那张 → 进课程
      go(i); return;                                               // 点侧边那张 → 转到中间
    }
    vel = track * 16.7;                          // 张/毫秒 → 张/帧,带走手指的惯性
    go(clamp(Math.round(pos + vel * 8)));        // 甩得越快,冲得越远(SLOW 时直接到位)
  };
  // 同样只认那根手指:别的手指抬起来不该结束这一次拖动
  stage.addEventListener("pointerup", e => { if(e.pointerId === ptr) release(true); });
  // 系统把手势判成上下滑会发 pointercancel —— 此时不带惯性,就近落位
  stage.addEventListener("pointercancel", e => { if(e.pointerId === ptr) release(false); });

  // 跳转已由 release() 接管,这里一律拦掉 <a> 的默认行为,避免重复跳转
  rack.addEventListener("click", e => { if(e.target.closest(".cover")) e.preventDefault(); });

  stage.tabIndex = 0;
  stage.setAttribute("aria-label", `${group}，左右方向键切换课程`);
  stage.addEventListener("keydown", e => {
    if(e.key === "ArrowLeft"){ go(idx() - 1); e.preventDefault(); }
    if(e.key === "ArrowRight"){ go(idx() + 1); e.preventDefault(); }
    if(e.key === "Enter" && covers[idx()]){
      saveShelfMem(group, idx());
      location.href = covers[idx()].href;
    }
  });

  /* 初始定位的优先级:本趟停过的位置 > 最近学的那一课 > 第一张。
     直接把 pos/target 一起写死再 paint()(SLOW 的直达路径),不走弹簧 ——
     一进页面就看见几组卡片各自"弹"一下,像是页面没加载完 */
  let startAt = 0;
  const mem = shelfMem();
  if(typeof mem[group] === "number" && mem[group] >= 0 && mem[group] <= LAST){
    startAt = Math.round(mem[group]);
  }else if(SAVE.last && SAVE.last.lesson){
    for(let i = 0; i <= LAST; i++){
      if(lessons[i].id === SAVE.last.lesson){ startAt = i; break; }
    }
  }
  pos = target = startAt;

  paint();

  /* 一次性示能演示:第一个分组自己往右挪半张再弹回来 ——「这一排是能滑的」
     这件事,演一下比副标题那行字管用得多(孩子不认字,那行是写给家长的)。
     go() 收的是连续位置,clamp 不取整,所以 0.55 是合法目标,弹簧照常动画。
     只在从第一张起步时演:停在中间某张时往右挪会盖掉"回到刚才那张"的语义。 */
  if(first && LAST >= 1 && !coachDone("shelf")){
    if(SLOW){ markCoach("shelf"); }
    else if(startAt === 0){
      markCoach("shelf");
      var peeked = false;
      var cancelPeek = function(){                 // 孩子先动手了就别演,他已经知道了
        peeked = true;
        stage.removeEventListener("pointerdown", cancelPeek);
      };
      stage.addEventListener("pointerdown", cancelPeek);
      setTimeout(function(){
        if(peeked) return;
        go(0.55);
        setTimeout(function(){
          stage.removeEventListener("pointerdown", cancelPeek);
          if(peeked) return;                       // 演到一半被拨走,别再拉回 0
          go(0);
        }, 500);
      }, 800);
    }
  }
  return wrap;
}

/* 清单还没回来时先占住版面(见 CSS 的「骨架屏」)。
   ⚠️ 两条出路都要记得撤掉它:成功时被真架子换掉,失败时在 catch 里清空。
   漏了失败那条,页面就是"错误提示 + 底下三个灰块还在呼吸",自相矛盾。 */
function showSkeleton(){
  var box = document.getElementById("shelves");
  box.innerHTML =
    '<div class="skel" aria-hidden="true">' +
    '<div class="skel-head"></div>' +
    '<div class="skel-row">' +
    '<div class="skel-card side"></div><div class="skel-card"></div>' +
    '<div class="skel-card side"></div></div></div>';
}

(async function(){
  renderCheckin();               // 打卡条不依赖课程清单,先画出来;清单拉不到也还在
  showSkeleton();
  try{
    const r = await fetch("lessons/index.json", {cache:"no-store"});
    if(!r.ok) throw new Error();
    const data = await r.json();
    const shelves = document.getElementById("shelves");
    shelves.innerHTML = "";      // 骨架下岗,真架子上台
    const order = [], byGroup = new Map();
    data.lessons.forEach(l => {
      const g = l.group || "其他 Others";
      if(!byGroup.has(g)){ byGroup.set(g, []); order.push(g); }
      byGroup.get(g).push(l);
    });
    renderContinue(data.lessons);
    order.forEach((g, i) => shelves.appendChild(buildShelf(g, byGroup.get(g), i === 0)));
  }catch(e){
    // 骨架必须撤掉:留着它就是"永远在加载",而下面明明写着加载失败了
    document.getElementById("shelves").innerHTML = "";
    document.getElementById("note").innerHTML =
      "课程清单需要通过本地服务器访问：<br>在项目目录运行 <b>python3 -m http.server</b>，<br>然后浏览器打开 <b>http://localhost:8000</b>";
  }
})();
</script>
</body>
</html>
