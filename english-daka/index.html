<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>英语打卡 · 课程目录</title>
<meta name="theme-color" content="#F0F7FF">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<!-- iOS 对 svg 的 apple-touch-icon 支持不好(多半会退回网页截图),所以这里指向 png。
     icon-180.png 由 docs/UI素材Prompt.md 的 A1 生成(1024 缩到 180),现在还没入库 ——
     404 无害:iOS 拿不到就退回原来的网页截图行为,和以前一模一样。
     favicon 仍然走矢量的 icon.svg,不受影响 -->
<link rel="apple-touch-icon" href="icon-180.png" sizes="180x180">

<style>
  :root{
    --bg:#F0F7FF; --ink:#2B3A55;
    --pink:#FF6FA5; --yellow:#FFC53D; --green:#4CC26E; --blue:#3E8BFF;
    /* 封面色:比主题色深一档,保证巨大白字的对比度达标 */
    --c1:#E85C93; --c2:#2F7BEF; --c3:#37A85B; --c4:#8557EA; --c5:#EE8420;
    /* 封面尺寸随屏幕走:375px 手机上一屏两张半(第三张被右缘裁掉一截,
       "这一排还能往右滑"就不用另外拿一行字解释了),720px 内容列里是四张半 */
    --cw:clamp(120px, 34vw, 160px); --ch:calc(var(--cw) * 1.28);
  }
  *{
    box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  }
  /* overflow-x:hidden 是防御性的:横滚现在关在 .shelf-row 自己的滚动容器里,
     整页本来就不该横向可滚。留着它,是因为一旦哪条规则算宽算多了几像素,
     手指在货架上横划时浏览器会顺手把整页一起平移,看着就是"整个页面在抖"。
     必须写在 html 上,只写 body 没用(原来就只写了 body,实测页面照样能横滚
     290px):body 的 overflow-x:hidden 配 overflow-y:visible 会让 body 自己变成
     滚动容器,就不再往视口传递了;视口的溢出行为取的是 html 的值。
     background 是另一回事:目录页 ⇄ 课程页是整页跳转,新文档在样式生效前会先刷
     一帧浏览器默认白底,深色封面跳过去就是"啪"一下白闪。写在 html 上首帧就有色 */
  html{ overflow-x:hidden; background:var(--bg); }
  body{
    /* 与 theme.css 的 --font-main 保持同序:英文圆体优先、中文回落苹方。
       theme.css 万一没加载,这里也不能把 PingFang 排在英文字体前面 */
    font-family:ui-rounded,"SF Pro Rounded","Arial Rounded MT Bold",
                "Comic Sans MS","Trebuchet MS","PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--ink); min-height:100vh; padding-bottom:44px;
    overflow-x:hidden;
  }
  /* ===== 图标 =====
     UI 层原来用的是 emoji。emoji 的字形、粗细、基线各平台各不相同(安卓那套
     线条细、iOS 那套厚实),同一行里和文字高矮对不齐,而且换个系统整页气质就变了。
     换成内联 SVG:形状我们自己定,颜色跟着文字走(fill:currentColor),
     字号一变图标跟着变(1em 见方)。
     ⚠️ 引用变量必须带回落值:这段内联 <style> 排在 theme.css 之前 */
  .ic{width:1em;height:1em;display:inline-block;vertical-align:-.12em;fill:currentColor;flex:none;}
  /* 星星金、火苗橙:这两个是"奖励/连胜"的语义色,不该跟着正文变灰 */
  .ic-star{color:var(--yellow,#FFC53D);}
  .ic-flame{color:var(--orange,#FF9A3D);}

  /* header 自己不留左右 padding:唯一的孩子 .hat 自己出左右边距 ——
     .hat 要和下面货架的内容列像素级同轴,多一层 padding 就得两处一起算。
     标题已经收进 .hat 里当卡内第一行,header 只剩"顶部留一点气口"这一个职责,
     text-align:center 也一并撤掉(标题现在靠左,和货架的分组标题同一条左缘) */
  header{padding:var(--sp-1,8px) 0 0;}
  /* 26→21px:它从"整页大标题"降级成"卡内标题",要和右边同排的打卡条平视,
     字号再大就把那一行压塌了。letter-spacing 保留 —— 六个汉字疏一点才像招牌。
     左右 padding 去掉:左缘由 .hat 的 padding 统一出,自己再加一份就错开一档 */
  header h1{font-size:21px;letter-spacing:2px;flex:none;}

  /* ===== 帽子(打卡条 + 行动按钮) =====
     原来打卡条(360px)、继续学(内容宽)、混合复习(内容宽)是三个各自居中的悬浮
     元素,三种宽度,和下面左对齐的货架内容列是两套构图轴 —— 家长反馈"上下分离"。
     现在收进同一张白卡,卡的左右缘和分组标题/第一张封面严格同一条竖线。
     宽度算法必须和 .shelf 那套对齐:.shelf 是 max-width:720 + margin auto,
     .shelf-head 再往里缩 16px,所以内容列 = min(视口, 720) - 32,居中。
     这里就写成 calc(100% - 32px) 封顶 688px(=720-32),两边都是同一个结果。
     ⚠️ 改 .shelf 的 720 或 .shelf-head 的 16px,这里的 688/32 要跟着改。
     第一行是「标题 + 本周打卡记录」:标题 flex:none 靠左,打卡条 flex:1 吃掉
     剩下的宽度并把内容贴右(点阵 + 🔥连胜是一组,分开摆就成了两个孤零零的元素)。
     窄屏放不下时靠 flex-wrap 自然折成"标题一行、打卡条一行",不用写断点;
     第二行(按钮)靠 flex-basis:100% 永远独占一行 */
  .hat{
    width:calc(100% - var(--sp-3,16px) * 2);max-width:688px;
    margin:var(--sp-4,20px) auto 0;
    padding:var(--sp-2,12px) var(--sp-3,16px);
    background:#fff;border:2px solid var(--line,#DCE5F2);border-radius:20px;
    box-shadow:var(--shadow, 0 3px 10px rgba(43,58,85,.10));
    display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;
    gap:var(--sp-2,12px) var(--sp-3,16px);
  }

  /* ===== 骨架屏 =====
     课程清单要等一次网络往返才回来,那之前整页只有一个标题和一片空白 ——
     看着像"打不开",家长会去刷新。先摆三个灰块占住位置,尺寸跟真封面一样,
     数据到了就地换掉,画面不跳。
     ⚠️ 只做形状不做内容:骨架里写"加载中"之类的字,孩子也读不懂,
     而且真数据到了字一闪就没,反而是干扰。 */
  .skel{max-width:720px;margin:0 auto;}
  .skel-head{height:16px;width:150px;border-radius:8px;margin:26px var(--sp-3,16px) 10px;}
  /* 灰块的排布必须和真货架一模一样(同尺寸、同 gap、同左内边距、同样左对齐),
     数据到了就地换掉时画面才不跳 */
  .skel-row{
    display:flex;gap:var(--sp-2,12px);overflow:hidden;
    padding:var(--sp-1,8px) var(--sp-3,16px) var(--sp-3,16px);
  }
  .skel-card{
    flex:none;width:var(--cw);height:var(--ch);border-radius:16px;
  }
  .skel-head,.skel-card{background:#DCE7F5;animation:skel-pulse 1.4s ease-in-out infinite;}
  @keyframes skel-pulse{0%,100%{opacity:.5;}50%{opacity:.9;}}
  @media (prefers-reduced-motion:reduce){
    .skel-head,.skel-card{animation:none;opacity:.6;}
  }

  /* ===== 专辑架 ===== */
  /* .shelf 自己不加左右 padding:横滚行要一直铺到内容列边缘,卡片被右缘裁掉半张
     正是"还能往右滑"的提示。左内边距改由 .shelf-head 的 margin 和 .shelf-row 的
     padding 各自出,两者都是 16px —— 标题和第一张卡必须同一条左缘 */
  .shelf{max-width:720px;margin:0 auto;}
  .shelf-head{
    display:flex;align-items:center;gap:10px;
    margin:26px var(--sp-3,16px) 6px;font-size:15px;font-weight:900;color:var(--ink);
  }
  /* 组图标:每组一张水彩图,圆形裁切放在组名前面,给每条货架一个视觉身份。
     图 404 时 onerror 把 <img> 摘掉,标题回落成原来的纯文字,外观无损 */
  .shelf-head .ico{
    width:30px;height:30px;border-radius:50%;object-fit:cover;display:block;
    flex:none;box-shadow:0 1px 3px rgba(30,60,110,.18);
  }
  .shelf-head .rule{height:3px;background:#DCE7F5;flex:1;border-radius:9px;}
  .shelf-head .count{font-size:12px;font-weight:700;color:#5E6E8C;}

  /* 横滚货架:滚动、惯性、吸附全交给浏览器原生实现,不再自己写手势 ——
     换来的是一屏能看见三四张(原来一次只给看一张)、点哪张就进哪张(原来点侧卡
     要先转正、多一次点击),而且惯性和边界回弹是系统那一套,和别的应用一致。
     snap 用 proximity 不用 mandatory:mandatory 会把"只想推一点看看后面有什么"
     变成必须整张整张翻,而且滚到末尾时容易被吸回去。
     上下 padding 是给卡片投影和 :focus-visible 描边留的位置 ——
     overflow-x:auto 会把 overflow-y 一起变成 auto,不留就被切平。*/
  .shelf-row{
    display:flex;gap:var(--sp-2,12px);
    overflow-x:auto;overflow-y:hidden;
    scroll-snap-type:x proximity;
    padding:var(--sp-1,8px) var(--sp-3,16px) var(--sp-3,16px);
    scroll-padding-inline:var(--sp-3,16px);   /* 吸附后卡片左缘对齐标题,不贴死在边上 */
    -webkit-overflow-scrolling:touch;
  }
  /* 滚动条藏起来:这一页的读者是孩子,一条灰杠只会招来乱拖;
     "能滑"由右缘那张被裁一半的卡片来说明 */
  .shelf-row{scrollbar-width:none;}
  .shelf-row::-webkit-scrollbar{display:none;}
  /* 桌面鼠标的横滚入口:滚动条藏了、鼠标又没有"横划"手势,不给拖就完全滑不动
     (家长实测反馈)。只在真鼠标环境给抓手光标,触摸屏不受影响 */
  @media (hover:hover) and (pointer:fine){
    .shelf-row,.cal-scroll{cursor:grab;}
    .shelf-row.dragging,.cal-scroll.dragging{cursor:grabbing;}
  }

  .cover{
    flex:none;width:var(--cw);height:var(--ch);scroll-snap-align:start;
    display:flex;flex-direction:column;text-decoration:none;color:var(--ink);
    background:#fff;border-radius:16px;overflow:hidden;
    box-shadow:0 6px 16px rgba(43,58,85,.14);
  }
  .cover .art{
    flex:1;display:flex;align-items:center;justify-content:center;
    background:var(--c);
    position:relative;                         /* 星数角标的定位基准 */
    /* ⚠️ 圆角和裁剪必须写在 .art 自己身上,不能只靠 .cover 的 overflow:hidden。
       .cover 是 position:static,封面图是 position:absolute —— Safari/iPad 上
       合成层会忽略这种"隔着一层、又不是包含块"的祖先圆角裁剪,图片四角照方的画,
       在卡片的圆角外露出直角(Chromium 上看不出来,只在平板上现形)。
       让直接父元素自己裁,哪个内核都不会漏。*/
    border-radius:16px 16px 0 0;overflow:hidden;
  }
  /* 字号跟着卡宽走,卡片缩到 120px 时字形也要仍然是"一眼认出的那个字母";
     比例比通栏时期略提(.42→.46),小卡上字形周围的留白本来就少不了 */
  .cover .glyph{
    font-size:calc(var(--cw) * 0.46);font-weight:900;color:#fff;line-height:1;
    text-shadow:0 3px 0 rgba(0,0,0,.13);
  }
  .cover .glyph.long{font-size:calc(var(--cw) * 0.27);letter-spacing:-1px;}
  /* 课程封面画:有 cover 字段的课在字形徽章之上铺一张水彩图。
     图铺满 .art 绝对定位,底下的 glyph 照常渲染 —— 图 404 时 onerror 把 <img>
     摘掉,露出来的就是原来那个巨型字形封面,外观和以前一模一样。
     目前只有主题/科学几课配了图(见 docs/UI素材Prompt.md 的 C1~C3),
     其余的课本来就没有 cover 字段,走的是纯字形那一支 */
  .cover .art img{
    position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;
  }
  /* 有封面画的卡:图不再铺满 .art,四边留一圈边、带自己的圆角,垫在浅色衬底上 ——
     像一张贴在卡片上的画。铺满的版本家长实测反馈"把卡片撑得太满,反而不美观"。
     内缩量跟卡宽走(160px 卡约 10px),窄屏小卡自动收窄。
     衬底不用 var(--c):那是组色,饱和度高,围着水彩图一圈会很吵。
     字形只是藏起来不删 —— 图 404 时 onerror 把 has-cover 摘掉,字形原样回来。 */
  .cover .art.has-cover{background:#F4F7FC;}
  .cover .art.has-cover .glyph{visibility:hidden;}
  /* ⚠️ 宽高必须显式算出来,不能写 auto:<img> 是替换元素,绝对定位下
     left/right 同时给定也不会把它撑开,auto 只取固有尺寸 —— 实测缩成左上角
     40×53 的一小块。--inset 算一次,四边和宽高共用。 */
  .cover .art.has-cover img{
    --inset:calc(var(--cw) * 0.062);
    inset:var(--inset);
    width:calc(100% - var(--inset) * 2);height:calc(100% - var(--inset) * 2);
    border-radius:calc(var(--cw) * 0.07);
  }
  .cover .art.has-cover .cover-stars{top:calc(var(--cw) * 0.062 + 5px);right:calc(var(--cw) * 0.062 + 5px);}
  .cover .label{padding:8px 10px 10px;background:#fff;}
  .cover .en{font-size:14px;font-weight:900;line-height:1.2;
             white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .cover .cn{font-size:11px;color:#5E6E8C;font-weight:700;margin-top:2px;
             white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .cover:focus-visible{outline:4px solid var(--blue);outline-offset:3px;}

  /* 封面图是按 3:4 画的,而 .art 原来是近正方(160×156)—— object-fit:cover
     要上下各裁掉 13%,人头猫头全切在外面。让 .art 自己按 3:4 撑开、卡高跟着走,
     图就按画出来的样子完整显示。
     ⚠️ 必须用 @supports 包住:老 Safari(15 以下)不认 aspect-ratio,而 .art 是
     flex:none,不兜底会塌成 0 高度、整排封面消失。回落走原来的固定高度 —— 
     还是裁,但和以前一模一样,不算退步。
     .skel-card 要跟着一起变,否则骨架屏 205px、真卡片 266px,加载完跳一下。
     49px 是 .label 的实测高度(8+10 内边距 + 两行定死字号,不会换行)*/
  @supports (aspect-ratio: 3 / 4){
    .cover{height:auto;}
    .cover .art{flex:none;aspect-ratio:3 / 4;}
    .skel-card{height:calc(var(--cw) * 4 / 3 + 49px);}
  }

  /* ===== 打卡条 ===== */
  /* 本周(周一起)到今天,一天一个点。天天来的孩子看的就是这一行 ——
     空心变实心是他能自己看懂的唯一"进度"。
     它住在 .hat 这张白卡里,自己不再是一张卡:白底/边框/投影/max-width
     全部去掉,只留内部那条 flex 行 —— 卡中卡会多出一圈没有意义的描边。
     现在和 h1 同排:宽度只包住内容("点阵 + 连胜"是一组),margin-left:auto
     把整组推到卡的右缘 —— 同排时贴右,窄屏 wrap 到第二行时照样贴右,
     和左上角的标题形成对角平衡。
     ⚠️ 不要回到 flex:1 吃满剩余宽度的写法:悬停底色会跟着铺满标题到
     点阵之间整条空白,看着像一根莫名其妙的长条(家长实测点名)。
     min-height:44px:整条是可点的(开打卡日历),要够儿童手指的热区;
     右侧负 margin 抵掉 padding —— 悬停底色比内容宽一点,点阵位置不动。
     自身允许 wrap:连胜攒到三位数("🔥 365 天")、又赶上 320px 窄屏时,
     连胜自己折到点阵下面一行,而不是把整条撑出卡外 */
  .checkin{
    margin-left:auto;flex:0 1 auto;min-width:0;
    display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-end;
    gap:var(--sp-1,8px) var(--sp-2,12px);
    min-height:44px;padding:4px var(--sp-1,8px);
    margin-right:calc(var(--sp-1,8px) * -1);
    border-radius:14px;cursor:pointer;
    transition:background var(--dur-fast,.15s) var(--ease-out,ease);
  }
  /* 手机竖屏:标题和打卡条挤不进同一行,折行后右挂着、左边一大片空白,
     看着像摆错了位置(实测点名)。窄屏改成独占一行铺满卡宽:七个点均匀
     摊开、连胜收尾 —— 一条完整的"本周进度条",空白就成了呼吸而不是缺口 */
  @media (max-width: 560px){
    .checkin{
      width:100%;flex-basis:100%;margin-left:0;margin-right:0;
      flex-wrap:nowrap;justify-content:space-between;
      padding:4px 2px;gap:var(--sp-2,12px);
    }
    .checkin-days{flex:1 1 auto;justify-content:space-between;gap:0;}
  }
  .checkin:hover{background:#F4F8FE;}
  .checkin:active{background:#EAF1FC;}
  .checkin:focus-visible{outline:4px solid var(--blue);outline-offset:2px;}
  /* 内容是 JS 填的:老浏览器解析不了脚本时,帽子里就只剩按钮列,
     不能在按钮旁边留一个撑着 300px 的空盒子(会把按钮挤成半宽) */
  .checkin:empty{display:none;}
  .checkin-days{display:flex;gap:5px;}
  .cday{display:flex;flex-direction:column;align-items:center;gap:3px;}
  .cdot{
    width:20px;height:20px;border-radius:50%;
    border:2px solid #CFDCEE;background:#fff;box-sizing:border-box;
  }
  .cdot.on{background:var(--yellow);border-color:#E9A800;}
  /* 今天那格加一圈蓝描边:几个点长得一样时,孩子分不清哪个是"今天该点亮的" */
  .cday.today .cdot{border-color:var(--blue);box-shadow:0 0 0 3px rgba(62,139,255,.28);}
  /* 本周还没到的天:一眼要能和"过去没打卡的空圈"区分开 ——
     圈更淡、字更淡,读作"这周还剩这几天",不是"这几天没打" */
  .cday.future .cdot{border-color:#E4EDF8;}
  .cday.future .cw{color:#B9C6DA;}
  .cw{font-size:11px;font-weight:700;color:#5E6E8C;line-height:1;}
  .cday.today .cw{color:var(--blue);}
  .checkin-streak{font-size:15px;font-weight:900;white-space:nowrap;}

  /* ===== 打卡日历弹窗 =====
     打卡条只给"这一周",家长想看的"坚持了多久"没地方看。点一下打卡条弹出
     一整年的热力图 —— 它是回顾,不是操作,所以做成弹窗而不是再占一块首屏。
     ⚠️ 遮罩是 position:fixed,不进正常流,不会给整页添出横向滚动。
     ⚠️ 关着的时候用 visibility:hidden 而不是 display:none / hidden 属性:
     display 一变,过渡就没有起点可插值,还得靠 rAF 或 transitionend 补一帧 ——
     那些回调在后台标签页里根本不跑,弹窗会卡在"打开了但看不见"。
     visibility 和 display:none 一样会把里面的关闭钮移出 Tab 序和无障碍树,
     所以关着的时候键盘绝对够不到它;pointer-events:none 再挡掉鼠标。
     ⚠️ visibility 的过渡写成 0s:打开这一下必须在样式重算时就立刻生效
     (JS 紧接着要 focus() 关闭钮,而 visibility:hidden 的元素聚焦不了)——
     写成有时长的过渡就得等第一帧,后台标签页里那一帧不来,焦点就丢了。
     关闭时给 visibility 挂 --dur-base 的**延迟**:淡出跑完才真正藏起来,
     而 opacity/pointer-events 是立刻的,不用等任何回调。
     减弱动效时 --dur-* 归零,这一整套自动变成瞬时,不用写一行 JS 判断 */
  .cal-mask{
    position:fixed;inset:0;z-index:50;
    display:flex;align-items:center;justify-content:center;padding:var(--sp-3,16px);
    background:rgba(43,58,85,.45);
    opacity:0;visibility:hidden;pointer-events:none;
    transition:opacity var(--dur-base,.24s) var(--ease-out,ease),
               visibility 0s linear var(--dur-base,.24s);
  }
  .cal-mask.open{
    opacity:1;visibility:visible;pointer-events:auto;
    transition:opacity var(--dur-base,.24s) var(--ease-out,ease),
               visibility 0s linear 0s;
  }
  .cal{
    /* 700 而不是 680:一年(53 列)的热力图连星期标签一共 655px,加上卡的
       内边距和边框正好要 700 才能在桌面上一次看完 —— 差那 20px 就得横滚,
       而"一屏看完一年"正是这张图的意义。用了不止一年的存档会更长,
       那时候和窄屏一样在 .cal-scroll 里横滚,不影响这一档的体验 */
    width:100%;max-width:700px;max-height:calc(100vh - var(--sp-3,16px) * 2);
    overflow-y:auto;
    padding:var(--sp-3,16px);
    background:#fff;border:2px solid var(--line,#DCE5F2);border-radius:20px;
    box-shadow:var(--shadow, 0 3px 10px rgba(43,58,85,.10));
    /* 弹出用 spring:末尾轻微过冲,和 app.html 的弹窗是同一种"蹦出来"的手感 */
    transform:scale(.94);
    transition:transform var(--dur-base,.24s) var(--ease-spring,ease);
  }
  .cal-mask.open .cal{transform:scale(1);}
  .cal-head{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-2,12px);}
  .cal-head h2{font-size:17px;font-weight:900;letter-spacing:1px;}
  /* 44px 见方的热区,里面的 ✕ 只有 16px —— 图标大小和可点范围是两回事 */
  .cal-x{
    flex:none;width:44px;height:44px;margin:-10px -10px -10px 0;
    display:flex;align-items:center;justify-content:center;
    border:0;background:none;color:var(--muted,#5E6E8C);font-size:16px;
    border-radius:50%;cursor:pointer;
  }
  .cal-x:hover{background:#F4F8FE;color:var(--ink);}
  .cal-x:focus-visible{outline:4px solid var(--blue);outline-offset:-2px;}

  /* 热力图:列=周(周一在顶),从 52 周前排到本周,共 53 列。
     星期标签留在滚动容器外面 —— 横滚时"一/三/五"要一直钉在左边,
     跟着一起滑走的话滚到中间就没有坐标系了 */
  .cal-map{display:flex;align-items:flex-start;gap:4px;margin-top:var(--sp-2,12px);}
  /* padding-top 必须等于月份标签行的总高(14+2),否则星期和格子错半行 */
  .cal-wd{
    flex:none;display:flex;flex-direction:column;padding-top:16px;
    font-size:9px;font-weight:700;color:var(--muted,#5E6E8C);
  }
  .cal-wd span{height:10px;margin-bottom:2px;line-height:10px;}
  /* 53 列约 634px:桌面弹窗(680)刚好放得下,手机放不下就在这里横滚。
     滚动条藏起来,和货架同一套理由(读者是孩子,一条灰杠只会招来乱拖) */
  .cal-scroll{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;}
  .cal-scroll{scrollbar-width:none;}
  .cal-scroll::-webkit-scrollbar{display:none;}
  /* inline-block:让内层按内容宽度撑开(而不是被滚动容器压成 100%)。
     padding 给"今天"那圈 outline 留位置,月份行和格子行同时缩进,不会错位 */
  .cal-inner{display:inline-block;padding:2px;}
  .cal-months{display:flex;gap:2px;height:14px;margin-bottom:2px;}
  /* 每列一个占位格,月份名绝对定位吐在格子外面 —— 列只有 10px 宽,
     不脱离文档流的话"12月"三个字会把整行撑散、和格子对不上列 */
  .cal-mon{flex:none;width:10px;position:relative;}
  .cal-mon b{
    position:absolute;left:0;top:0;white-space:nowrap;
    font-size:9px;font-weight:700;color:var(--muted,#5E6E8C);
  }
  .cal-grid{display:flex;gap:2px;}
  .cal-col{flex:none;width:10px;display:flex;flex-direction:column;gap:2px;}
  /* 未打卡的浅蓝和 --line 同一族:是"还没填的格子",不是"缺席"的警示色 */
  .cal-cell{flex:none;width:10px;height:10px;border-radius:3px;background:#E2EBF7;}
  /* 六档绿 = 那天挣了多少星(四档看不出差距,实测点名)。色相全部锁死在 --green 上只动明度 ——
     换色相(比如浅的偏黄、深的偏蓝)会被读成"不同种类的一天",而它们只是多少之分。
     s0 是"打了卡但没有星数记录"的老数据:比 s1 还浅一档,和空格子拉开,
     但也不假装知道那天学了多少。阈值见 JS 的 STAR_TIERS */
  /* 相邻档明度差拉到肉眼一格可辨(原来 s2/s3/s4 挤在一起,看不出深浅 ——
     实测点名);最深档压到墨绿,和最浅档隔出整个亮度带 */
  .cal-cell.s0{background:#E0F3E6;}
  .cal-cell.s1{background:#CBEBD6;}
  .cal-cell.s2{background:#A5DFB9;}
  .cal-cell.s3{background:#7DD09B;}
  .cal-cell.s4{background:var(--green,#4CC26E);}
  .cal-cell.s5{background:#2E9C51;}
  .cal-cell.s6{background:#1A6B37;}
  .cal-legend{
    display:flex;align-items:center;gap:3px;
    margin-top:var(--sp-2,12px);
    font-size:11px;font-weight:700;color:var(--muted,#5E6E8C);
  }
  .cal-legend span:first-child{margin-right:2px;}
  .cal-legend span:last-child{margin-left:2px;}
  /* 规则说明:小字灰字,别抢热力图的戏 */
  .cal-note{
    margin-top:6px;font-size:12px;line-height:1.7;
    color:var(--muted,#5E6E8C);
  }
  /* 统计块:窄屏两列、宽屏四列,不写断点 —— auto-fit + minmax 让浏览器自己数
     一行放得下几个(手机上的可用宽度约 294px,放得下两个 120;
     弹窗最宽时约 644px,四个正好铺满) */
  .cal-stats{
    display:grid;grid-template-columns:repeat(auto-fit, minmax(120px, 1fr));
    gap:var(--sp-1,8px);margin-top:var(--sp-2,12px);
  }
  .cal-tile{
    padding:10px var(--sp-2,12px);border-radius:14px;background:#F2F7FD;
  }
  /* 数值大、单位和标签小:家长扫一眼要看到的是那个数,不是"天"字 */
  .cal-tile b{display:block;font-size:22px;font-weight:900;line-height:1.1;}
  .cal-tile b i{font-style:normal;font-size:12px;font-weight:700;margin-left:2px;
                color:var(--muted,#5E6E8C);}
  .cal-tile span{display:block;margin-top:2px;font-size:11px;font-weight:700;
                 color:var(--muted,#5E6E8C);}

  /* ===== 存档导出/导入(家长区)=====
     刻意做成弹窗最底下一行灰色小字链接,而不是彩色胶囊按钮:
     一是这是家长一年用不了几次的功能,做成按钮只会稀释旁边真正要点的入口;
     二是孩子翻到打卡日历时,不该有任何一个显眼的东西通向"覆盖存档"。
     虚线分隔:它和上面的热力图/统计不是一类内容(一个是看,一个是管)。
     wrap:手机上那句说明放不下就整条折到下一行(靠左继续排),
     不去挤两个按钮 —— 按钮被压窄到换行才是真难点 */
  .cal-io{
    display:flex;flex-wrap:wrap;align-items:center;gap:var(--sp-2,12px);
    margin-top:var(--sp-2,12px);padding-top:var(--sp-2,12px);
    border-top:1px dashed var(--line,#DCE5F2);
  }
  .cal-iobtn{
    border:0;background:none;padding:6px 2px;
    font:inherit;font-size:12px;font-weight:700;color:var(--muted,#5E6E8C);
    text-decoration:underline;text-underline-offset:3px;cursor:pointer;
  }
  .cal-iobtn:hover{color:var(--ink);}
  .cal-io-note{flex:1 1 auto;min-width:0;font-size:11px;line-height:1.6;color:var(--muted,#5E6E8C);}

  /* ===== 轻量提示条(toast)=====
     这一页目前只有"该备份了"这一句话要说。样式和 app.html 的 .toast 对齐 ——
     同一个应用里的提示条不该在两页长得不一样。
     z-index 必须高过日历弹窗的遮罩(50),否则弹窗开着时提示条被盖在底下。
     时长/缓动走 theme.css 的 token,减弱动效时归 0、自动变成瞬时显示。
     ⚠️ pointer-events 一直是 none(app.html 那版在 .in 里放开了):
     那边条上有可点的撤销按钮,这边只是一句话 —— 让它挡住底下的货架
     没有任何好处,孩子的手指正好会落在那一带 */
  .toast{
    position:fixed;left:50%;bottom:var(--sp-5,24px);z-index:70;
    display:flex;align-items:center;
    max-width:calc(100vw - 32px);
    padding:10px var(--sp-3,16px);border-radius:99px;
    background:rgba(30,42,64,.94);color:#fff;
    font-size:14px;font-weight:700;line-height:1.3;
    box-shadow:0 8px 24px rgba(20,30,50,.28);
    transform:translate(-50%,16px);opacity:0;pointer-events:none;
    transition:transform var(--dur-base,.24s) var(--ease-out,ease),
               opacity var(--dur-base,.24s) var(--ease-out,ease);
  }
  .toast.in{transform:translate(-50%,0);opacity:1;}
  .toast .toast-msg{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

  /* ===== header 行动区 ===== */
  /* 帽子里的按钮行(家长反馈:电脑上两个按钮竖着叠像"重叠",宽屏该并排)。
     不写媒体断点,靠 wrap 数学:每个按钮 flex-basis 240px ——
     宽屏一行放得下两个就并排各占一半,手机(卡内容 ~310px)放不下就
     自动换行、单个按钮撑满整行,和原来的堆叠一模一样。
     默认 align-items:stretch 让并排的两个按钮同高(次按钮被拉到主按钮的 52px) */
  .acts{
    flex:1 1 100%;min-width:0;
    display:flex;flex-wrap:wrap;gap:var(--sp-1,8px);
  }
  /* 几个入口(继续学/混合复习/按课堂复习/错题本)同排:都是"开始学"的
     同层级动作,并列省行,货架早进视野;主次靠颜色分。
     ⚠️ flex-basis 不能是 0:basis 0 的假想尺寸永远"放得下",flex-wrap
     一辈子不会触发 —— 按钮被硬均分,胶囊压得比文字窄,nowrap 的字从
     圆角底里淌出去(「错题本 · 14 个词在练」实测溢出)。
     basis 40% = 两列对称网格:一行恰好放两个(40%×3 超行宽),grow 把
     每行撑满 —— 四个入口 2×2,奇数个时落单的那个自动铺满整行。
     曾试过 basis auto 的自然折行:三种内容宽度挤一排、长的又独占整条,
     每行宽窄参差(实测点名"不协调"),对称网格才稳定 */
  /* > button 也要收进来:「按课堂复习」开的是弹窗不是链接,元素是 <button>。
     ⚠️ 高度/字号/内边距统一写死在这里,压过 .go-btn/.review-btn 各自的值
     (选择器 0,1,1 > 0,1,0)—— 四个胶囊必须同宽同高同字号,主次只靠颜色分;
     以前主按钮 52px/17px、次按钮 ~44px/15px,2×2 摆一起大小参差(实测点名) */
  .acts > a,.acts > button{
    flex:1 1 40%;min-width:0;white-space:nowrap;
    /* 44px:统一到 52 后整块头重(实测点名"太大"),44 是触屏热区的下限,
       视觉轻一档、热区不缩水 */
    min-height:44px;padding:9px 16px;font-size:15px;font-weight:900;line-height:1.25;
  }
  /* 手机竖屏:半宽格(~150px)装不下长文案,退回一行一个 */
  @media (max-width: 560px){
    .acts > a,.acts > button{flex-basis:100%;}
  }
  /* 继续学的课名长度不可控:label 装进 span 才有省略号
     (flex 容器里的裸文本节点没法 text-overflow) */
  .acts .go-btn span{overflow:hidden;text-overflow:ellipsis;}
  /* 有继续学时 renderContinue 给 .acts 挂 .trio:三按钮挤一排,
     混合复习的副标题让位;宽屏只有两按钮时副标题照旧 */
  .acts.trio .review-btn .sub{display:none;}
  @media (max-width:560px){
    .acts > a,.acts > button{flex:1 1 240px;}
    .acts.trio .review-btn .sub{display:inline;}  /* 折行后各占整行,副标题回来 */
  }
  /* 「继续学」在有存档时是唯一的主行动:直接回到昨天那一课,省掉在架子上找 */
  .go-btn{
    display:inline-flex;align-items:center;justify-content:center;
    /* 不设 max-width:在帽子的右列里要撑满列宽,和「混合复习」对齐成一条边;
       文字仍由 justify-content:center 居中 */
    min-height:52px;padding:12px 26px;border-radius:999px;
    /* 淡绿而不是实心绿:帽子行三个入口统一成粉彩胶囊(淡绿/淡蓝/淡橙),
       实心饱和绿夹在两块粉彩里是"一个重两个轻",怎么配都不协调。
       继续学靠首位 + 绿色相领头就够了 —— 这一行是快捷入口,
       页面真正的主行动是下面的课程封面。文字深一档同色相,4.5:1 过 AA */
    background:#DEF4E6;color:#1B7C46;font-weight:900;font-size:17px;
    text-decoration:none;box-shadow:none;line-height:1.25;
  }
  /* 按压反馈:粉彩胶囊平时没有投影,按下去只下沉,别凭空长出一层影子 */
  .go-btn:active{transform:translateY(2px);box-shadow:none;}
  .go-btn:focus-visible{outline:4px solid var(--blue);outline-offset:3px;}

  /* 复习入口放在目录页顶部而不是做成一节课:它不属于任何分组,
     而且每次进去内容都不一样,当成"课"会误导 */
  /* text-align:center 显式写出来:它以前是从 header 继承的,
     而 header 的 text-align 只服务标题,不该被按钮的居中依赖着 */
  /* 级别切换器:K1 导入前只有一个级别,整条 hidden,页面无变化 */
  .lv-bar{
    max-width:720px;margin:18px auto -6px;padding:0 16px;
    display:flex;gap:8px;
  }
  .lv-tab{
    padding:7px 22px;border:none;border-radius:999px;cursor:pointer;
    font-size:14px;font-weight:900;color:#7A879E;background:#E7EDF6;
  }
  .lv-tab.on{background:var(--blue);color:#fff;}
  .lv-tab:focus-visible{outline:3px solid var(--blue);outline-offset:2px;}
  .review-btn{
    /* flex 而不是 block:并排时会被 stretch 拉到和主按钮同高(52px),
       block 的文字会贴在顶上,竖向也要居中 */
    display:flex;align-items:center;justify-content:center;
    text-align:center;padding:10px 20px;border-radius:999px;
    /* 底色是淡蓝(和 .ghost 一致):帽子行不论两个还是三个按钮,
       都是同一排粉彩胶囊,没有哪种组合会出现"一个实心夹粉彩" */
    background:#E3EEFF;color:#2A66C4;font-weight:900;font-size:15px;
    text-decoration:none;box-shadow:none;
  }
  .review-btn:active{transform:translateY(2px);box-shadow:none;}
  .review-btn:focus-visible{outline:4px solid var(--blue);outline-offset:3px;}
  /* 有「继续学」时复习降级为次按钮:两个绿胶囊并排等于没有主次。
     次按钮不用素白 —— 一实心两白的三连排头重脚轻,给两个次入口各一层
     淡淡的身份色:混合复习淡蓝(换换花样)、错题本淡橙(要加把劲)。
     主次仍然清楚:实心饱和绿 vs 两块粉彩;文字取深一档同色相,15px 粗体过 AA */
  .review-btn.ghost{
    background:#E3EEFF;color:#2A66C4;border:none;box-shadow:none;
  }
  .review-btn.book{
    background:#FFF0DD;color:#9E5800;border:none;box-shadow:none;
  }
  /* 「按课堂复习」:第三块粉彩 —— 淡紫(挑某一天,专属感)。
     元素是 <button>,UA 的边框/字体都要抹平,字体跟着页面走。
     ⚠️ [hidden] 那条必须有:.review-btn 的 display:flex 优先级压过 UA 的
     [hidden]{display:none},不补这条按钮就永远藏不住 */
  .review-btn.day{
    background:#EFE8FF;color:#6E3FD1;border:none;box-shadow:none;
    font-family:inherit;cursor:pointer;
  }
  .review-btn[hidden]{display:none;}
  /* 次按钮平时就没有投影,按下去也不该凭空长出来一层 —— 只保留下沉 2px */
  .review-btn.ghost:active,.review-btn.book:active,.review-btn.day:active{transform:translateY(2px);box-shadow:none;}

  /* ===== 按课堂复习:日期选择弹窗 =====
     壳复用打卡日历的 .cal-mask/.cal(遮罩、开关、淡入淡出同一套),
     里面换成一列"课堂日"行。行是 <a>:点了直接进那天的复习 */
  .daypick{max-width:460px;}
  .day-list{
    display:flex;flex-direction:column;gap:var(--sp-1,8px);
    margin-top:var(--sp-2,12px);
  }
  /* 空态提示:入口常驻,没数据时弹窗里放一句话,不是一片空白 */
  .day-empty{
    padding:var(--sp-4,20px) var(--sp-2,12px);text-align:center;
    font-size:14px;line-height:1.9;color:var(--muted,#5E6E8C);
  }
  .day-row{
    display:flex;align-items:center;justify-content:space-between;gap:var(--sp-2,12px);
    padding:12px var(--sp-2,12px);border-radius:14px;
    background:#F7F4FE;text-decoration:none;color:var(--ink,#2B3A55);
  }
  .day-row:active{transform:translateY(2px);}

     不会出现"改了上线用户还是旧版"。详见 sw.js 顶部注释。 -->
<script>

}

<!-- 白屏兜底:页面内容全是 JS 渲染的,JS 一旦解析失败(老浏览器不认新语法)
     或初始化抛错,就会留下一片空白,看不出任何线索。这段单独成块、且只用 ES5 写,
     老浏览器也能跑,负责把错误显示在页面上。加新语法前先想想这里的兜底还在不在。 -->
<script>
window.onerror = function (msg, src, line) {
  var d = document.getElementById("fatalErr");
  if (!d) {
    d = document.createElement("div");
    d.id = "fatalErr";
    d.style.cssText = "margin:16px;padding:14px;border:2px solid #FF6FA5;border-radius:12px;"
      + "background:#FFF3F6;color:#333;font:14px/1.6 -apple-system,system-ui,sans-serif;"
      + "white-space:pre-wrap;word-break:break-word;";
    (document.body || document.documentElement).appendChild(d);
  }
  d.textContent = "\u9875\u9762\u6ca1\u80fd\u52a0\u8f7d \u2014\u2014 \u6d4f\u89c8\u5668\u7248\u672c\u53ef\u80fd\u592a\u65e7\u3002\n\u628a\u4e0b\u9762\u8fd9\u6bb5\u622a\u56fe\u53d1\u7ed9\u5f00\u53d1\u8005\uff1a\n\n"
    + msg + "\n" + (src || "") + "  \u7b2c " + line + " \u884c\n\n" + navigator.userAgent;
  return false;
};
</script>
<!-- 想把站点数据钉住,别让系统在存储紧张时把它当缓存清掉。

     就是几个月的星星和连续天数一次性消失,而家长完全不会知道发生过什么。
     ⚠️ 单独成块、只用 ES5 写,和下面的白屏兜底一个道理:老内核上要能安全跳过。
     ⚠️ 特性检测 + try/catch + 不看返回值:批准与否由浏览器自己判(Safari 看
     "是否加到主屏",Chrome 看站点参与度),被拒绝也没有第二条路可走,
     更不该为此打扰家长。失败就是回到今天的样子,不是错误。
     ⚠️ 这是"降低被清掉的概率",不是备份 —— 真正的兜底是日历里的导出存档。 -->
<script>
try{
  if (navigator.storage && navigator.storage.persist) {
    navigator.storage.persist().catch(function () {});
  }
}catch (e) {}
</script>

<!-- 两页共用的存档读写层(daka.v1 的 store + daka.rev.v1 的账本读写)。
     原先这几十行在两个页面里各存一份,注释上写着"改一处要同步改两处"。
     ⚠️ 必须排在主脚本之前、且不加 defer/async:下面顶层第一件事就是 store.load()。
     ⚠️ 它在 sw.js 的 SHELL 里,离线也拿得到;加文件记得同步那份清单。 -->
<script src="shared.js"></script>
<script>
/* 连续天数:从今天往回逐日查;今天还没打就从昨天起算(白天打开时不该显示 0),
   昨天也没有才是真的断了。setDate(-1) 自带跨月跨年,别自己算天数。 */
function streakOf(days){
  var set = {}, i;
  for(i = 0; i < days.length; i++) set[days[i]] = 1;
  var d = new Date();
  if(!set[ymd(d)]){
    d.setDate(d.getDate() - 1);
    if(!set[ymd(d)]) return 0;
  }
  var n = 0;
  while(set[ymd(d)]){ n++; d.setDate(d.getDate() - 1); }
  return n;
}

/* 货架的横滚位置记在 sessionStorage(不是 localStorage):从课程页返回时
   回到刚才滑到的地方,但下次重新打开应用还是从头开始 —— 位置是"这一趟"的上下文。
   ⚠️ 存的是像素 scrollLeft,不是第几张:卡宽跟着 vw 走,换个屏幕序号会对不上位。 */
var SHELF_KEY = "daka.shelf";
function shelfMem(){
  try{
    var s = sessionStorage.getItem(SHELF_KEY);
    if(s){ var o = JSON.parse(s); if(o && typeof o === "object") return o; }
  }catch(e){}
  return {};
}
function saveShelfMem(group, x){
  try{
    var o = shelfMem();
    o[group] = x;
    sessionStorage.setItem(SHELF_KEY, JSON.stringify(o));
  }catch(e){}
}

var SAVE = store.load();

/* 打卡条:本周固定 7 个点,周一排到周日 + 右侧连续天数。
   曾经试过"周一只画到今天"(不画未来)—— 周一当天整条只剩孤零零一个圈,
   家长看着像坏了,而且一眼看不出"这是一周"。定稿:七个圈永远都在,
   还没到的天用 .future 压淡(更浅的虚位样式),读作"这周还剩这几天",
   不会误当成"没打卡的空格"。今天蓝圈高亮不变。
   ⚠️ 连胜(streakOf)跟这个窗口无关,它算的是真实的连续天数,一天没动。
   周起点算法:getDay() 里周日是 0,(day+6)%7 把它挪成"离本周一过了几天" */
const WEEK_CN = ["日","一","二","三","四","五","六"];
function renderCheckin(){
  const box = document.getElementById("checkin");
  if(!box) return;
  const set = {};
  SAVE.days.forEach(d => { set[d] = 1; });
  const passed = (new Date().getDay() + 6) % 7;   // 今天是本周第几天(周一=0)
  let cells = "";
  for(let i = 0; i < 7; i++){                      // 永远画满周一..周日
    const d = new Date();
    d.setDate(d.getDate() + (i - passed));
    const key = ymd(d);
    const cls = i === passed ? " today" : (i > passed ? " future" : "");
    cells += `<div class="cday${cls}">` +
             `<span class="cdot${i <= passed && set[key] ? " on" : ""}"></span>` +
             `<span class="cw">${WEEK_CN[d.getDay()]}</span></div>`;
  }
  box.innerHTML =
    `<div class="checkin-days" role="img" aria-label="本周打卡情况">${cells}</div>` +
    `<div class="checkin-streak"><svg class="ic ic-flame" aria-hidden="true"><use href="#i-flame"/></svg> ${streakOf(SAVE.days)} 天</div>`;
}

/* ================================================================
   打卡日历弹窗 —— 全程热力图(列=周,周一在顶)
   打卡条只给"这一周",而家长真正想看的"孩子坚持了多久"没有地方看。
   点打卡条弹出这张图:一眼看完从头到今天,坚持得好不好不用数。
   ⚠️ 日期一律用 ymd() 手拼 + 字符串比较("YYYY-MM-DD" 补过零,
   字典序就是时间序),不碰 toISOString()(UTC,晚上会记成明天)。
   ================================================================ */
/* 默认最少往前画几个月(不含当月)。两个作用:一是没有任何记录时总得画点
   什么(全灰的仨月,空着的格子就是邀请);二是刚开始用的头几周,不至于弹出来
   只有孤零零一列。⚠️ 按"整月"不按"固定周数":固定 12 周会把第一个月拦腰
   截断 —— 6 月只剩两列却顶着"6月"标签,月份间距看着忽宽忽窄(实测点名)。 */
const CAL_MIN_MONTHS = 2;
/* 每天挣的星数分档阈值(六档),越深表示那天学得越多。
   ⚠️ 这几个数是可调的经验值(一节课大约 10~20 颗星),不是什么算出来的边界;
   要改就改这里,别去动下面的 if 链。
   ⚠️ dayStars 是后来才加的字段:更早的打卡记录只知道"打了卡",不知道挣了
   几颗星 —— 那些天走 s0(最浅的绿),既不能算成 0(它不是没学),
   也不能瞎归到某一档里去。 */
const STAR_TIERS = [4, 8, 14, 22, 32];   // 六档:1-3 / 4-7 / 8-13 / 14-21 / 22-31 / ≥32

/* "YYYY-MM-DD" → 本地时区的 Date。
   ⚠️ 不能写 new Date("2026-01-01"):只有日期没有时间的字符串按 UTC 解析,
   西半球的时区会整体偏成前一天。分开传年月日才是本地时区。 */
function parseYmd(s){
  const p = String(s).split("-");
  return new Date(+p[0], +p[1] - 1, +p[2]);
}
/* 某天的深浅档:没打卡 → 空;打了卡但没有星数记录 → s0;
   有记录按 STAR_TIERS 分档(数组驱动:加减档位只改数组和 CSS 色板,这里不动) */
function calTier(on, v){
  if(!on) return "";
  if(typeof v !== "number" || v <= 0) return " s0";
  let t = 1;
  for(let i = 0; i < STAR_TIERS.length; i++) if(v >= STAR_TIERS[i]) t = i + 2;
  return " s" + t;
}
/* 全程最长连续天数。不能拿"离今天最近的那段"(streakOf)充数:
   那是"现在连着几天",断过一次就归零,而家长想看的是"最好的时候坚持了多久"。
   days 已经是升序去重的,但这里自己再排一次去重 —— 存档是外部数据,
   不该假设它一定被谁整理过。 */
function longestStreak(days){
  const s = days.slice().sort();
  let best = 0, run = 0, prev = null;
  for(let i = 0; i < s.length; i++){
    if(s[i] === prev) continue;
    if(prev){
      const d = parseYmd(prev);
      d.setDate(d.getDate() + 1);              // setDate 自带跨月跨年
      run = ymd(d) === s[i] ? run + 1 : 1;
    }else{
      run = 1;
    }
    if(run > best) best = run;
    prev = s[i];
  }
  return best;
}

/* 画热力图 + 填统计块。今天之后的格子不渲染 —— 本周未来的那几行就是空的,
   和打卡条"不画未来"是同一条规矩(列顶对齐,缺的自然缺在底部) */
function renderCal(){
  const set = {};
  SAVE.days.forEach(d => { set[d] = 1; });
  const ds = SAVE.dayStars || {};              // 旧存档没有这个字段
  /* 深浅的口径(家长定):做题的星星 + 学一学听卡折的星(每 3 张折 1 颗)。
     只影响颜色,不进真实星星账(总星星统计块仍然只数做题挣的)。
     ⚠️ 这个 3 和 app.html 的 LEARN_MARK_N、下面 .cal-note 的文案是同一件事 */
  const dc = SAVE.dayCards || {};
  const eff = k => (typeof ds[k] === "number" ? ds[k] : 0) +
                   Math.floor((typeof dc[k] === "number" ? dc[k] : 0) / 3);

  const now = new Date();
  const todayKey = ymd(now);
  // 本周一(取本地零点:下面要拿它和另一个零点日期相减算周数,
  // 带着当前时分秒去减会差出小半天,四舍五入就可能少一列)
  const thisMon = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  thisMon.setDate(thisMon.getDate() - ((now.getDay() + 6) % 7));

  /* 画多远:从"最早那次打卡所在周的周一"一直画到本周 —— 不再是固定 52 周。
     固定窗口有两个毛病:刚用一个月的人看到的是一整片灰(像没记上),
     用了两年的人则看不到前一年。全程画,图的长度本身就是"坚持了多久"。 */
  let first = null;
  SAVE.days.forEach(d => { if(!first || d < first) first = d; });
  // 默认窗口:从 CAL_MIN_MONTHS 个月前的 1 号所在的那一周画起 ——
  // 图里第一个月永远是完整的,月份标签的间距就是真实的 4/5 周
  const defStart = new Date(now.getFullYear(), now.getMonth() - CAL_MIN_MONTHS, 1);
  defStart.setDate(defStart.getDate() - ((defStart.getDay() + 6) % 7));
  let cols = Math.round((thisMon - defStart) / 604800000) + 1;
  if(first){
    const fd = parseYmd(first);
    fd.setDate(fd.getDate() - ((fd.getDay() + 6) % 7));   // 那一周的周一
    const w = Math.round((thisMon - fd) / 604800000) + 1; // 604800000 = 一周的毫秒数
    if(w > cols) cols = w;
  }

  const cur = new Date(thisMon);
  cur.setDate(cur.getDate() - (cols - 1) * 7);

  /* 月份标签(和 GitHub 同款):严格钉在"包含 1 号的那一列"。
     旧算法按"列首周一的月份变了"标,还会在标签冲突时把月份名往后漂移
     几列 —— 名字和下面的格子对不上列;而且月初头几天所在的列,列首周一
     还是上个月,新月份要等下一周才出现(9 月 1 号当天看不到"9月",实测点名)。
     现在:第一遍建格子,顺手记下每个 1 号落在哪一列;第二遍生成标签,
     冲突时先把前一个标签的年份去掉再试,还不行才丢弃后者(绝不漂移)。 */
  let grid = "";
  const marks = [];                            // 待标的列:{c, y, m}
  for(let c = 0; c < cols; c++){
    if(c === 0) marks.push({c: 0, y: cur.getFullYear(), m: cur.getMonth()});
    let col = "";
    for(let r = 0; r < 7; r++){
      const key = ymd(cur);
      if(key > todayKey) break;                // 未来不画
      if(cur.getDate() === 1){
        // 1 号所在列就是这个月的标签列;第 0 列若同时含月末和月初,标新月
        // (它占了这一列的大头,也更有信息量)
        if(c === 0) marks[0] = {c: 0, y: cur.getFullYear(), m: cur.getMonth()};
        else marks.push({c, y: cur.getFullYear(), m: cur.getMonth()});
      }
      // 今天不再加蓝圈:热力图里一圈描边读作"被选中",而这图没有选中这回事;
      // 今天永远是最后一格,位置本身就说明了它是谁(实测点名)
      col += `<span class="cal-cell${calTier(!!set[key], eff(key))}"></span>`;
      cur.setDate(cur.getDate() + 1);          // setDate 自带跨月跨年
    }
    grid += `<span class="cal-col">${col}</span>`;
  }
  /* 标签文字:第一枚和一月带年份(跨年的地方正是一月)。
     宽度按 CJK 11px/ASCII 7px 估,每列 12px —— 前一枚铺进后一枚的列就算冲突 */
  const labW = t => {
    let px = 0;
    for(const ch of t) px += ch.charCodeAt(0) > 127 ? 11 : 7;
    return Math.ceil(px / 12);
  };
  const labs = marks.map((mk, i) => ({
    c: mk.c,
    text: (i === 0 || mk.m === 0) ? `${mk.y}年${mk.m + 1}月` : `${mk.m + 1}月`
  }));
  for(let i = 1; i < labs.length; i++){
    const prev = labs[i - 1];
    if(prev.c + labW(prev.text) > labs[i].c){
      const short = prev.text.replace(/^\d+年/, "");
      if(short !== prev.text && prev.c + labW(short) <= labs[i].c) prev.text = short;
      else { labs.splice(i, 1); i--; }         // 实在放不下:丢标签,不挪位置
    }
  }
  let months = "", li = 0;
  for(let c = 0; c < cols; c++){
    if(li < labs.length && labs[li].c === c){
      months += `<span class="cal-mon"><b>${labs[li].text}</b></span>`;
      li++;
    }else{
      months += `<span class="cal-mon"></span>`;
    }
  }

  document.getElementById("calMonths").innerHTML = months;
  document.getElementById("calGrid").innerHTML = grid;

  /* 四块统计。总星星按各课记录求和(SAVE.total 里还混着"混合复习"挣的星,
     而复习不属于任何一课 —— 两个口径都说得通,这里跟课程记录走,
     和封面右上角那些星数角标加起来对得上) */
  let starSum = 0;
  for(const id in SAVE.lessons){
    const r = SAVE.lessons[id];
    if(r && typeof r.stars === "number") starSum += r.stars;
  }
  const tiles = [
    [SAVE.days.length,        "天", "总打卡"],
    [starSum,                 "颗", "总星星"],
    [streakOf(SAVE.days),     "天", "当前连续"],
    [longestStreak(SAVE.days), "天", "最长连续"]
  ];
  document.getElementById("calStats").innerHTML = tiles.map(
    t => `<div class="cal-tile"><b>${t[0]}<i>${t[1]}</i></b><span>${t[2]}</span></div>`
  ).join("");
}

const calMask = document.getElementById("calMask");
const calClose = document.getElementById("calClose");
const calScroll = document.getElementById("calScroll");
enableMouseDrag(calScroll);                      // 日历横滚同样藏了滚动条,桌面也要能拖

/* 开关就是加/去一个 class,没有任何计时器、帧回调、transitionend ——
   淡入淡出、能不能点、进不进 Tab 序全部由 CSS 那三条属性负责。
   时序一旦交给 JS,后台标签页(rAF 不跑)和减弱动效(时长 0,transitionend
   不触发)这两种情况就各要一条兜底,而它们都是最容易漏测的 */
function openCal(){
  if(!calMask || calMask.classList.contains("open")) return;
  // 弹窗打开的这一刻重读存档:SAVE 是页面启动时的快照,而这一页经常是
  // 从课程页"后退"回来的 —— bfcache 直接恢复旧页面,不重新执行脚本,
  // 快照里就没有刚才在课程页挣的星星(实测:练了半天,总星星纹丝不动)
  SAVE = store.load();
  renderCal();
  calMask.classList.add("open");
  // 读一次 offsetHeight 逼浏览器立刻把上面这行的样式算出来:
  // 下面 focus() 要求元素此刻已经是 visible,样式还没刷新就会聚焦失败
  void calMask.offsetHeight;
  // 初始滚到最右:今天在最后一列,手机上放不下 53 列时先看见的必须是"现在"
  calScroll.scrollLeft = calScroll.scrollWidth;
  calClose.focus();
}

function closeCal(){
  if(!calMask || !calMask.classList.contains("open")) return;
  calMask.classList.remove("open");
  const box = document.getElementById("checkin");
  if(box) box.focus();                         // 焦点还给打开它的那一条
}

(function bindCal(){
  const box = document.getElementById("checkin");
  if(!box || !calMask) return;
  box.addEventListener("click", openCal);
  box.addEventListener("keydown", e => {
    // div + role=button 没有原生键盘行为,回车/空格要自己接。
    // 空格必须 preventDefault:默认行为是把整页往下翻一屏
    if(e.key === "Enter" || e.key === " " || e.key === "Spacebar"){
      e.preventDefault();
      openCal();
    }
  });
  calClose.addEventListener("click", closeCal);
  // 点遮罩关闭:只认打在遮罩自己身上的点击,冒泡上来的(点在白卡里)不算
  calMask.addEventListener("click", e => { if(e.target === calMask) closeCal(); });
  /* Esc 绑在 document 而不是 calMask:焦点若落到弹窗外(比如点了白卡里
     非聚焦区域,浏览器会把焦点丢给 body),按键就不会冒泡经过 calMask,
     Esc 就"死"了。绑 document、以 open 状态做开关,焦点在哪都能关 */
  document.addEventListener("keydown", e => {
    if((e.key === "Escape" || e.key === "Esc") && calMask.classList.contains("open")) closeCal();
  });
  calMask.addEventListener("keydown", e => {
    if(e.key !== "Tab") return;
    // 焦点圈在弹窗里:不拦的话 Tab 第二下就跑到遮罩背后的货架上去了,
    // 键盘用户看不见自己在哪儿。现在弹窗里只有关闭钮一个可聚焦元素,
    // 但按"一圈能焦点元素"写,以后加了别的控件不用回来改
    // ⚠️ 必须写 a[href] 不能写 [href]:图标是 <svg><use href="#i-close">,
    // 光写 [href] 会把那个 <use> 也算成"可聚焦元素",焦点圈就多出一站空的
    const f = calMask.querySelectorAll("button, a[href], [tabindex]:not([tabindex='-1'])");
    if(!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if(e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
    else if(!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
  });
})();

/* ================================================================
   轻量提示条 —— 全局唯一一条,新的顶掉旧的。2.5 秒自动淡出。
   ⚠️ 和 app.html 的 showToast 是同一套样式和时长,但**没有**动作按钮:
   这一页要说的话只有"该备份了",不需要一步可撤销的动作。真要加按钮时
   照 app.html 那版补 .toast-act,别在这里另发明一种。
   ================================================================ */
let toastTimer = 0;
function hideToast(){
  if(toastTimer){ clearTimeout(toastTimer); toastTimer = 0; }
  const el = document.getElementById("toast");
  if(el) el.classList.remove("in");
}
function showToast(msg){
  let el = document.getElementById("toast");
  if(!el){
    el = document.createElement("div");
    el.id = "toast";
    el.className = "toast";
    el.setAttribute("role", "status");
    document.body.appendChild(el);
  }
  hideToast();
  el.innerHTML = "";
  const s = document.createElement("span");
  s.className = "toast-msg";
  s.textContent = msg;                         // textContent:提示文案不进 HTML 解析
  el.appendChild(s);
  void el.offsetWidth;                         // 强制重排,连着两次出条才会重放淡入
  el.classList.add("in");
  toastTimer = setTimeout(hideToast, 2500);
}

/* ================================================================
   存档导出 / 导入 —— 唯一一条把记录带离这台设备的路。
   打卡数据全在 localStorage:换手机、清站点数据、iOS 长期不用自动清理,
   任何一条发生,几个月的星星和连续天数就一次性消失,而且没有任何征兆。
   persist()(见页面顶部那段)只降低概率,导出才是真正的兜底。

   信封格式(schema 1),故意不直接导出裸的三个键:
     { app:"daka", schema:1, exportedAt:"YYYY-MM-DD HH:mm", data:{ 键: 值 } }
   app/schema 两个字段的作用是导入时能一眼认出"这不是打卡存档",
   而不是把一份随便什么 JSON 塞进 localStorage 把存档搞坏。
   ⚠️ exportedAt 本地时区手拼,不用 toISOString() —— 理由同存档里的日期
   (UTC 会把晚上导出的记成第二天,家长对不上"我什么时候存的")。
   ================================================================ */
/* 要打包哪几个键。daka.shelf 不在里面:那是货架滚到哪儿了,存在
   sessionStorage、关掉应用就没了,备份它没有任何意义 */
const BACKUP_KEYS = ["daka.v1", "daka.rev.v1", "daka.coach"];

function stampNow(){
  const d = new Date(), h = d.getHours(), mi = d.getMinutes();
  return ymd(d) + " " + (h < 10 ? "0" : "") + h + ":" + (mi < 10 ? "0" : "") + mi;
}

/* 打包。某个键不存在(或存的东西已经坏到 parse 不出来)就不放进信封 ——
   宁可少一个键,也不要写一个 null 进去:导入方看见键就会照单覆盖 */
function buildBackup(){
  const data = {};
  BACKUP_KEYS.forEach(k => {
    try{
      const s = localStorage.getItem(k);
      if(s !== null) data[k] = JSON.parse(s);
    }catch(e){}
  });
  return { app:"daka", schema:1, exportedAt:stampNow(), data:data };
}

/* 记一笔"存过了",给下面的备份提醒用。
   ⚠️ 重新 load 一遍再写,不直接改内存里的 SAVE:这一页从不写存档,
   SAVE 是启动时的快照,拿它整个存回去等于用旧数据盖掉课程页刚记的星星
   (家长在另一个标签页里学完一课回来点导出,就是这个场景) */
function markBackedUp(){
  const o = store.load();
  o.lastBackupAt = today();
  if(store.save(o)) SAVE.lastBackupAt = o.lastBackupAt;
}

/* 回退路径:a[download] + Blob URL。
   ⚠️ 不能马上 revokeObjectURL —— 部分内核是异步取的流,撤早了下载直接断,
   而且不报错。给一分钟,页面活着就够用了 */
function downloadJSON(text, name){
  try{
    const url = URL.createObjectURL(new Blob([text], {type:"application/json"}));
    const a = document.createElement("a");
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 60000);
    return true;
  }catch(e){ return false; }
}

/* 优先系统分享面板:手机上"下载一个 json"多半只是躺进下载目录,家长下一步
   还得自己找出来发走;分享面板可以直接丢进微信收藏/网盘/AirDrop,那才是备份。
   ⚠️ 必须同步走完特性检测和 new File():share() 要求在用户手势里发起,
   中间插一个 await 就会被浏览器判成非手势调用而拒绝。
   ⚠️ canShare({files}) 要单独问一次 —— 有 navigator.share 不代表能分享文件
   (桌面 Chrome 就是这样),不问就会在那些机器上抛出去、什么也没发生。
   ⚠️ 只有 share 的 Promise 真的 resolve 才算存过:用户在面板上点取消是
   reject,那时候记 lastBackupAt 等于骗自己"备份好了"。 */
function doExport(){
  const text = JSON.stringify(buildBackup(), null, 2);
  const name = "daka-backup-" + today() + ".json";
  const fallback = () => {
    if(downloadJSON(text, name)){
      markBackedUp();
      showToast("存档已导出：" + name);
    }else{
      showToast("这台设备存不了文件");
    }
  };
  /* 分享面板只留给触屏设备(手机/平板):那里"下载的 json"多半只是躺进
     下载目录,分享面板才能直接丢进微信收藏/网盘/AirDrop。
     桌面(精确指针)直接下载 —— 桌面 Chrome 的 canShare({files}) 也会点头,
     但 share() 常被系统一口回绝,而且桌面用户预期的本来就是"下载一个文件"。 */
  const coarse = !!(window.matchMedia && matchMedia("(pointer: coarse)").matches);
  try{
    if(coarse && navigator.share && navigator.canShare && typeof File === "function"){
      const f = new File([text], name, {type:"application/json"});
      if(navigator.canShare({files:[f]})){
        navigator.share({files:[f], title:"打卡存档"})
          .then(() => { markBackedUp(); showToast("存档已导出"); })
          .catch(err => {
            /* 只有 AbortError 是"用户在面板上点了取消",安静退下;
               其它拒绝(NotAllowedError 等)是这条路本身走不通 ——
               必须回退下载,不然点导出就是无声无息(桌面实测就是这样) */
            if(err && err.name === "AbortError") return;
            fallback();
          });
        return;
      }
    }
  }catch(e){}                                  // 面板不可用就当没有这条路,往下走回退
  fallback();
}

/* 存档摘要"打卡 X 天 / Y 星"。星数按各课记录求和,和上面统计块的「总星星」
   同一个口径(不取 total —— 那里面还混着混合复习挣的星),
   两个数字家长会当场对照,口径不一样就成了 bug */
function backupBrief(o){
  let days = 0, stars = 0;
  if(o && typeof o === "object"){
    if(o.days instanceof Array) days = o.days.length;
    if(o.lessons && typeof o.lessons === "object"){
      for(const id in o.lessons){
        const r = o.lessons[id];
        if(r && typeof r.stars === "number") stars += r.stars;
      }
    }
  }
  return "打卡 " + days + " 天 / " + stars + " 星";
}
/* "2026-08-20 10:31" → "8月20日导出"。老信封里这个字段可能缺/坏,
   所以是正则取而不是 split —— 取不到就别硬说一个日期出来 */
function backupWhen(s){
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(s || ""));
  return m ? (+m[2]) + "月" + (+m[3]) + "日导出" : "导出时间不详";
}

/* 校验 + 确认 + 整体覆盖。
   ⚠️ 覆盖不合并:两份存档的 days/dayStars 合起来是"哪天学过"的并集,但
   lessons[id].stars 该取谁的?取大的会凭空多出星星,取新的又说不清哪份新。
   合并规则怎么定都会在某个场景下算错,而算错的是孩子攒了半年的星星 ——
   "把那台设备的记录搬过来"是家长真正想做的事,也只有这一件事说得清楚。
   ⚠️ 信封里没有的键不动本机的:只导出过一次、当时还没有错题本的老存档,
   不该在导入时把今天的错题本清空。
   ⚠️ 确认用 window.confirm:自绘弹层要多一套遮罩/焦点圈/Esc,而这个动作
   一年发生一次,原生框反而更难被误点过去(它会把页面钉住)。 */
function applyBackup(text){
  let env = null;
  try{ env = JSON.parse(text); }catch(e){}
  if(!env || typeof env !== "object" || env.app !== "daka" || env.schema !== 1 ||
     !env.data || typeof env.data !== "object" || env.data instanceof Array){
    showToast("这不是打卡存档文件");
    return;
  }
  const msg = "用备份覆盖这台设备上的记录？\n\n" +
              "备份：" + backupBrief(env.data["daka.v1"]) +
              "（" + backupWhen(env.exportedAt) + "）\n" +
              "本机：" + backupBrief(store.load()) + "\n\n" +
              "覆盖之后，本机现在的记录就找不回来了。";
  if(!window.confirm(msg)) return;
  let wrote = 0;
  BACKUP_KEYS.forEach(k => {
    if(!Object.prototype.hasOwnProperty.call(env.data, k)) return;
    try{ localStorage.setItem(k, JSON.stringify(env.data[k])); wrote++; }catch(e){}
  });
  if(!wrote){ showToast("没能写入存档"); return; }
  // 整页重来:打卡条、日历、货架定位、错题本计数全是启动时按 SAVE 画的,
  // 一个个重画既漏得多又没必要 —— 导入本来就该是"回到那台设备的样子"
  location.reload();
}

(function bindBackup(){
  const ex = document.getElementById("calExport");
  const im = document.getElementById("calImport");
  const file = document.getElementById("calImportFile");
  if(!ex || !im || !file) return;
  ex.addEventListener("click", doExport);
  im.addEventListener("click", () => file.click());
  file.addEventListener("change", () => {
    const f = file.files && file.files[0];
    // value 清空必须做:不清的话选同一个文件第二次不触发 change,
    // 家长会以为"点了没反应"
    file.value = "";
    if(!f) return;
    const r = new FileReader();
    r.onload = () => applyBackup(String(r.result));
    r.onerror = () => showToast("文件没能读出来");
    r.readAsText(f);
  });
})();

/* ================================================================
   备份提醒 —— 攒了东西、又很久没存过,才念叨一句。
   三个条件缺一不可:有打卡记录(没记录不存在"丢失")、上次备份超过 14 天
   (或从没备份过)、上次备份之后又学过新的(否则那份备份已经是最新的了,
   催他再存一遍只是噪音)。
   ⚠️ 一次会话只提醒一次,记在 sessionStorage:从课程页返回目录页是整页
   跳转,不记的话来回几趟就要弹好几遍,提醒会变成"又是它",直接被无视。
   下次重开应用还会提醒 —— 那时候确实又过了一天。
   ================================================================ */
const BACKUP_REMIND_DAYS = 14;
const REMIND_KEY = "daka.remind";              // sessionStorage,和 daka.* 那几个存档键无关
function remindedThisSession(){
  try{ return !!sessionStorage.getItem(REMIND_KEY); }catch(e){ return true; }
}
function markReminded(){
  try{ sessionStorage.setItem(REMIND_KEY, "1"); }catch(e){}
}
function dayGap(a, b){ return Math.round((parseYmd(b) - parseYmd(a)) / 864e5); }

function remindBackup(){
  if(remindedThisSession()) return;
  if(!SAVE.days.length) return;                // 还没打过卡,没有值得丢的东西
  // days 正常是升序的,但存档是外部数据,自己取一次最大值更稳
  let last = "";
  for(let i = 0; i < SAVE.days.length; i++) if(SAVE.days[i] > last) last = SAVE.days[i];
  const at = SAVE.lastBackupAt;
  const ok = typeof at === "string" && /^\d{4}-\d{2}-\d{2}$/.test(at);
  if(ok){
    if(dayGap(at, today()) <= BACKUP_REMIND_DAYS) return;   // 备份还新
    if(!(last > at)) return;                                // 存过之后没再学,那份就是最新的
  }
  markReminded();
  // 延后一点再出:首屏正在画货架,这时候弹条会和内容一起抖进来,
  // 而且家长的注意力还在"今天学哪一课"上,根本读不进去
  setTimeout(() => showToast("存档 " + BACKUP_REMIND_DAYS + " 天没备份了，点日历里的导出存一份"), 1500);
}
remindBackup();

/* 「继续学 · 某课」:有存档且那节课还在清单里才出。
   出现时把复习按钮降级成白底次按钮 —— 两个绿胶囊并排就没有主行动了 */
function renderContinue(lessons){
  const last = SAVE.last;
  const id = last && last.lesson ? last.lesson : null;
  if(!id) return;
  let hit = null;
  for(let i = 0; i < lessons.length; i++){ if(lessons[i].id === id){ hit = lessons[i]; break; } }
  if(!hit) return;
  const acts = document.getElementById("acts");
  const a = document.createElement("a");
  a.className = "go-btn";
  a.href = "app.html?lesson=" + hit.id;
  // 图标是我们自己写的常量、课程标题走 textContent 单独塞进去 —— 不拼 innerHTML,
  // 免得课程名里的字符被当成标签解析
  a.innerHTML = '<svg class="ic" aria-hidden="true"><use href="#i-play"/></svg> ';
  // 标题装进 span:同排时课名太长要省略号,裸文本节点做不到(见 .go-btn span)
  const label = document.createElement("span");
  label.textContent = "继续学 · " + hit.title;
  a.appendChild(label);
  acts.insertBefore(a, acts.firstChild);
  acts.classList.add("trio");   // 三按钮同排的开关:混合复习的副标题让位
  const rb = document.getElementById("reviewBtn");
  if(rb) rb.classList.add("ghost");
}

/* 错题本按钮带数:「N 个词在练」。数据来自 app.html 维护的复习账本
   daka.rev.v1(每卡 {b:盒号,t:最后见到,w:错次}),这里只读不写;
   在练 = 错过(w>0)且还没爬到 7 天盒(b≤3),口径必须和 app.html 的
   pickWrongBook 一致,不然按钮报 5 个点进去只有 3 个。
   ⚠️ 走 shared.js 的 revStore.load()(读不到时返回 {}),不要自己再 JSON.parse
   一遍 —— 两边各写一套读法,正是"报 5 个点进去 3 个"的来路。 */
function renderWrongCount(){
  const el = document.getElementById("wrongBtnLabel");   // 只改文字,图标留在旁边
  if(!el) return;
  const o = revStore.load();
  let n = 0;
  for(const k in o){
    const r = o[k];
    if(r && typeof r === "object" && r.w > 0 &&
       typeof r.b === "number" && r.b <= 3) n++;
  }
  if(n > 0) el.textContent = "错题本 · " + n + " 个词在练";   // 0 个就保持素颜按钮,入口不藏
}
renderWrongCount();

/* ================================================================
   从课程页回来时刷新画面。这一页所有数字(打卡条、封面星角标、错题本
   计数、日历统计)都是启动时按 SAVE 快照画的,但"后退"回目录经常走
   bfcache —— 页面从内存里原样恢复,脚本不重跑,刚在课程页挣的星星
   一颗都看不见(家长实测:总星星不会动)。两个钩子都要挂:
   - pageshow(persisted):bfcache 恢复
   - visibilitychange → visible:目录页和课程页开在两个标签页来回切
   封面角标就地改文字,不重建货架(重建会丢横滚位置)。 */
function updateCoverStars(){
  document.querySelectorAll(".cover").forEach(a => {
    const m = /[?&]lesson=([^&]+)/.exec(a.getAttribute("href") || "");
    if(!m) return;
    const rec = SAVE.lessons[decodeURIComponent(m[1])];
    const got = rec && typeof rec.stars === "number" ? rec.stars : 0;
    if(got <= 0) return;
    let tag = a.querySelector(".cover-stars");
    if(!tag){
      const art = a.querySelector(".art");
      if(!art) return;
      tag = document.createElement("span");
      tag.className = "cover-stars";
      tag.innerHTML = `<svg class="ic ic-star" aria-hidden="true"><use href="#i-star"/></svg> `;
      art.appendChild(tag);
    }
    // 只动数字,别整块重写(SVG 引用不必反复重建)
    const want = String(got);
    if(tag.lastChild && tag.lastChild.nodeType === 3) tag.lastChild.textContent = " " + want;
    else tag.appendChild(document.createTextNode(" " + want));
  });
}
function refreshFromStore(){
  SAVE = store.load();
  renderCheckin();
  renderWrongCount();
  updateCoverStars();
  // 日历若恰好开着(平板分屏边练边看),重画统计
  if(calMask && calMask.classList.contains("open")) renderCal();
}
addEventListener("pageshow", e => { if(e.persisted) refreshFromStore(); });
document.addEventListener("visibilitychange", () => {
  if(!document.hidden) refreshFromStore();
});

/* ================================================================
   「按课堂复习」:入口按钮 + 日期选择弹窗
   一次线下课的内容会散进好几节课(字母加两张、常见词加三张……),想复习
   "那天学的"得挨个课去翻。数据侧给每张卡盖了上课日期(added,gen_audio.py
   自动盖),index.json 里有按日聚合的 days 汇总 —— 这里把汇总画成可选的
   日期列表,点一行就进 app.html?lesson=review&pick=day&d=那天。
   ⚠️ 入口**常驻**(家长定的:错题本和按课堂复习都要一直在,方便随手进):
   days 缺失/为空时按钮照样显示,点开弹窗给一句空态提示 —— 曾经是
   "没数据就藏按钮",结果入口时有时无,家长以为功能坏了。
   ================================================================ */
function renderDayPicker(data){
  const days = data.days || [];
  const btn = document.getElementById("dayBtn");
  if(!btn) return;
  if(!days.length){
    document.getElementById("dayList").innerHTML =
      `<p class="day-empty">这里会按上课日期列出每天学过的卡片，` +
      `选一天就能整套重过。<br>等课程带上日期信息后就有内容了。</p>`;
  }else{
    renderDayList(data, days);
  }

  btn.hidden = false;
  // 三个以上入口同排:混合复习的副标题让位(和「继续学」出现时同一开关)
  document.getElementById("acts").classList.add("trio");

  /* 开关照抄打卡日历那套:open class + CSS 过渡,零计时器。
     理由和注意事项见日历弹窗一节(visibility 0s、后台标签页、减弱动效) */
  const mask = document.getElementById("dayMask");
  const close = document.getElementById("dayClose");
  btn.addEventListener("click", () => {
    mask.classList.add("open");
    void mask.offsetHeight;              // 逼样式立刻生效,下一句才聚焦得上
    close.focus();
  });
  const shut = () => {
    if(!mask.classList.contains("open")) return;
    mask.classList.remove("open");
    btn.focus();                         // 焦点还给打开它的按钮
  };
  close.addEventListener("click", shut);
  mask.addEventListener("click", e => { if(e.target === mask) shut(); });
  document.addEventListener("keydown", e => {
    if((e.key === "Escape" || e.key === "Esc") && mask.classList.contains("open")) shut();
  });
  // 焦点圈在弹窗里:和日历弹窗同一段逻辑(a[href] 的写法讲究也一样)
  mask.addEventListener("keydown", e => {
    if(e.key !== "Tab") return;
    const f = mask.querySelectorAll("button, a[href], [tabindex]:not([tabindex='-1'])");
    if(!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if(e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
    else if(!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
  });
}

/* 有日期数据时的列表渲染(从 renderDayPicker 拆出来,入口常驻后
   "画列表"和"装弹窗"不再绑在一起) */
function renderDayList(data, days){
  // 行尾报"字母、常见词"比课程 id 直白:取每节课组名的中文半截(空格前)
  const groupOf = {};
  (data.lessons || []).forEach(l => {
    groupOf[l.id] = String(l.group || "").split(" ")[0];
  });
  // 近三天给相对称呼:孩子家长嘴里都是"昨天上的",不是"8月30日上的"
  const rel = {};
  ["今天", "昨天", "前天"].forEach((w, i) => {
    const d = new Date();
    d.setDate(d.getDate() - i);
    rel[ymd(d)] = w;
  });

  document.getElementById("dayList").innerHTML = days.map(dy => {
    const p = String(dy.date).split("-");
    const md = p.length === 3 ? `${+p[1]}月${+p[2]}日` : dy.date;
    const wd = p.length === 3 ? "周" + WEEK_CN[parseYmd(dy.date).getDay()] : "";
    const groups = [];
    (dy.lessons || []).forEach(id => {
      const g = groupOf[id];
      if(g && groups.indexOf(g) < 0) groups.push(g);
    });
    // 有课名就把课名放在第二行:家长找的是"讲宠物那节",不是"8月30日那节"。
    // 没起名的日子退回分组名(字母、常见词),至少比只有日期强(main 侧改进,合并保留)
    const sub = dy.name || groups.join("、");
    return `<a class="day-row" href="app.html?lesson=review&pick=day&d=${encodeURIComponent(dy.date)}">` +
      `<span><b>${rel[dy.date] || md}</b><i>${rel[dy.date] ? md + " " + wd : wd}</i></span>` +
      `<span class="r"><b>${dy.cards} 张卡</b><i>${sub}</i></span></a>`;
  }).join("");
}

/* 封面色 —— 旧写法是五色按**组内序号**循环,于是每个组的第一张永远是同一个粉色、
   第二张永远是同一个蓝色:颜色只表达"你是这组的第几张",不表达"你属于哪一组"。
   翻到第三屏时家长和孩子都认不出自己滑到哪儿了。
   改成一组一个主色相,组内只在同色的 2~3 档深浅之间轮换 —— 色相认组,深浅分张。
   ⚠️ 明度全部对齐现有 --c1..--c5 的水平(白底巨型字形的对比度 2.6~6.4:1),
   任何一档都不许再往浅了调:封面上那个字号的白字是这一页唯一的信息,
   浅一档就糊在底色里了。橙/绿两组的第三档试过都掉到 2.3~2.6 以下,所以只留两档。
   ⚠️ 按**组名关键字**匹配(中英各写一条,课程数据两种写法都出现过);
   匹配不上的组(比如以后的 8xx 绘本)照旧走五色循环,不至于没颜色。 */
const COVER_COLORS = ["var(--c1)","var(--c2)","var(--c3)","var(--c4)","var(--c5)"];
const GROUP_COLORS = [
  {re:/字母|letter/i,        colors:["#2F7BEF","#1F63CC","#4C93FF"]},  /* 蓝 */
  {re:/词族|word\s*family/i, colors:["#8557EA","#6E3FD1","#9C74F5"]},  /* 紫 */
  {re:/拼读|phonics/i,       colors:["#EE8420","#C86A10"]},            /* 橙 */
  {re:/常见词|sight/i,       colors:["#E85C93","#C9407A","#F0729F"]},  /* 粉 */
  {re:/主题|topic/i,         colors:["#37A85B","#268A47"]},            /* 绿 */
  {re:/数学|math/i,          colors:["#1F8FA8","#16748A","#2AA0BC"]},  /* 青 */
  {re:/科学|science/i,       colors:["#2E8B74","#1F7160","#3A9E87"]}   /* 深绿 */
];
function coverColors(group){
  const g = group ? String(group) : "";
  for(let i = 0; i < GROUP_COLORS.length; i++){
    if(GROUP_COLORS[i].re.test(g)) return GROUP_COLORS[i].colors;
  }
  return COVER_COLORS;
}

/* 桌面鼠标拖动滚动。触摸端浏览器原生就能横划,但鼠标没有"横划"这个动作,
   滚动条又特意藏了(读者是孩子,灰杠只会招来乱拖) —— 结果桌面上货架
   完全滑不动(家长实测反馈)。只接管 pointerType==="mouse" 的主键拖动:
   - 死区 6px:没过线就是普通点击,卡片 <a> 默认跳转不受影响
   - 过线后 scrollLeft 跟手,松手带一点惯性(scrollBy smooth 顺便让
     scroll-snap 落位),并在捕获阶段拦掉这一次 click(拖完松手不算点)
   - 触摸/触控笔一概不碰,原生滚动照旧 */
function enableMouseDrag(row){
  if(!row) return;
  let down = false, moved = false, sx = 0, sl = 0, vx = 0, lx = 0, lt = 0;
  let restoreTimer = 0;
  // 拖动期间必须把 scroll-snap 关掉:程序逐帧改 scrollLeft 会被吸附点
  // 每次都拽回去,表现是"卡住不动 → 猛跳一格",完全不是滑动(实测反馈)。
  // 松手后自己算落点(带惯性 + 吸到最近的卡),平滑滚过去,再把 snap 还回来。
  const snapOff = () => {
    clearTimeout(restoreTimer);
    row.style.scrollSnapType = "none";
  };
  const snapRestore = () => {
    clearTimeout(restoreTimer);
    restoreTimer = setTimeout(() => { row.style.scrollSnapType = ""; }, 650);
  };
  row.addEventListener("pointerdown", e => {
    if(e.pointerType !== "mouse" || e.button !== 0) return;
    down = true; moved = false; sx = lx = e.clientX;
    /* 按住 = 接住正在滑行的货架。上一次松手的 smooth 滚动还在后台逐帧写
       scrollLeft,不掐掉它就和手里这次拖动互相抢,拖起来一顿一顿(实测:
       第一次拖顺,紧接着再拖就不流畅)。一次瞬时 scrollTo 会立刻中止
       在途的平滑滚动;起点必须在取消**之后**再记 */
    row.scrollTo({left: row.scrollLeft, behavior: "auto"});
    sl = row.scrollLeft;
    lt = performance.now(); vx = 0;
  });
  row.addEventListener("pointermove", e => {
    if(!down || e.pointerType !== "mouse") return;
    const dx = e.clientX - sx;
    if(!moved){
      if(Math.abs(dx) < 6) return;               // 死区:手一抖不算拖
      moved = true;
      row.classList.add("dragging");
      snapOff();
      // 捕获指针:拖出货架边界、甚至拖出窗口,move/up 也还归我们
      try{ row.setPointerCapture(e.pointerId); }catch(err){}
    }
    row.scrollLeft = sl - dx;
    const now = performance.now(), dt = Math.max(1, now - lt);
    vx = vx * 0.7 + ((lx - e.clientX) / dt) * 0.3;   // px/ms,低通滤抖
    lx = e.clientX; lt = now;
    e.preventDefault();
  });
  const up = () => {
    if(!down) return;
    down = false;
    if(moved){
      row.classList.remove("dragging");
      // 落点 = 当前位置 + 惯性,再吸到最近一张卡的左缘(snap 此刻还关着,
      // 得自己吸;算法和 restoreShelfPos 同源:卡与卡的 offsetLeft 之差)
      let target = row.scrollLeft + vx * 220;
      target = Math.max(0, Math.min(target, row.scrollWidth - row.clientWidth));
      const kids = row.children;
      if(kids.length && /^cover/.test(kids[0].className)){
        const base = kids[0].offsetLeft;
        let best = 0, bd = Infinity;
        for(let i = 0; i < kids.length; i++){
          const x = kids[i].offsetLeft - base;
          const d = Math.abs(x - target);
          if(d < bd){ bd = d; best = x; }
        }
        // 已经滚到底时别硬拽回卡缘,贴着右端停
        if(target < row.scrollWidth - row.clientWidth - 8) target = best;
      }
      row.scrollTo({left: target, behavior: "smooth"});
      snapRestore();
    }
  };
  row.addEventListener("pointerup", up);
  row.addEventListener("pointercancel", up);
  // 拖动过的这一次松手不算点击:捕获阶段拦掉,免得落点在卡片上触发跳转
  row.addEventListener("click", e => {
    if(moved){ moved = false; e.preventDefault(); e.stopPropagation(); }
  }, true);
  // 封面画是 <img>,浏览器默认能拽出个"幽灵图"把拖动手势顶掉
  row.addEventListener("dragstart", e => e.preventDefault());
}

/* 每组一张的组图标。键取组名的中文段(「字母 Letters」→「字母」),
   K1/K2 同名组共用一张 —— 教的东西是一回事,不必分级各出一张。
   没登记的组不画图标,标题就是原来的纯文字 */
var SHELF_ICO = {
  "字母":"k1-cover-letters", "数字":"k1-cover-numbers", "颜色":"k1-cover-colors",
  "动物":"k1-cover-animals", "身体":"k1-cover-body",   "动作":"k1-cover-actions",
  "职业":"k1-cover-jobs",    "天气":"k1-cover-weather", "形状":"k1-cover-shapes",
  "规律":"k1-cover-patterns","乐器":"k1-cover-instruments", "节日":"k1-cover-holidays",
  "词族":"k2-cover-word-family", "拼读":"k2-cover-phonics", "常见词":"k2-cover-sight-words",
  "主题":"k2-cover-topics",      "数学":"k2-cover-math",    "科学":"k2-cover-science"
};

/* 组名 → 图标 <img>。取组名第一段(空格前)去查表;查不到返回空串 */
function shelfIco(group){
  var key = String(group || "").split(" ")[0];
  var slug = SHELF_ICO[key];
  if(!slug) return "";
  return '<img class="ico" src="lessons/images/' + slug + '.webp" alt="" ' +
         'loading="lazy" onerror="this.parentNode&&this.parentNode.removeChild(this)">';
}

function buildShelf(group, lessons, memKey){
  memKey = memKey || group;      // 多级别后 K1/K2 都有「字母 Letters」,记忆键要带级别
  const wrap = document.createElement("section");
  wrap.className = "shelf";
  wrap.innerHTML =
    `<div class="shelf-head">` + shelfIco(group) + `<span>${group}</span>` +
    `<span class="count">${lessons.length} 节</span><span class="rule"></span></div>` +
    `<div class="shelf-row"></div>`;
  const row = wrap.querySelector(".shelf-row");
  const palette = coverColors(group);

  lessons.forEach((l, i) => {
    const [en, cn] = String(l.title).split(" · ");
    // 不用 ?? ——它是 ES2020 语法,iOS 13.4 以下的 Safari 解析不了整个 <script>,
    // 页面会一节课都不显示。下面这写法语义等价(只在 null/undefined 时回落)
    const glyph = l.badge != null ? l.badge : (l.num != null ? l.num : "•");
    const a = document.createElement("a");
    a.className = "cover";
    a.href = `app.html?lesson=${l.id}`;
    a.draggable = false;
    a.style.setProperty("--c", palette[i % palette.length]);
    // 这一课攒了多少星:攒过才显示,0 星的课挂个「星 0」等于提醒他没做
    const rec = SAVE.lessons[l.id];
    const got = rec && typeof rec.stars === "number" ? rec.stars : 0;
    // 封面画(可选):有 cover 字段就铺一张图盖住字形徽章;图还没入库时 onerror
    // 把 <img> 摘掉,露出底下照常渲染的 glyph —— 404 下外观和以前完全一样
    // onerror 要把 has-cover 一起摘掉:类名留着的话字形还是藏的、衬底还是浅色,
    // 404 退回来的就不是"原来那个字形封面"而是一块空白
    const cover = l.cover
      ? `<img src="lessons/${l.cover}" alt="" loading="lazy"` +
        ` onerror="var p=this.parentNode;if(p){p.classList.remove('has-cover');p.removeChild(this);}">`
      : ``;
    a.innerHTML =
      `<div class="art${l.cover ? " has-cover" : ""}"><span class="glyph${String(glyph).length > 2 ? " long" : ""}">${glyph}</span>` +
      cover +
      (got > 0 ? `<span class="cover-stars"><svg class="ic ic-star" aria-hidden="true"><use href="#i-star"/></svg> ${got}</span>` : ``) + `</div>` +
      `<div class="label"><div class="en">${en}</div>` +
      `<div class="cn">${cn || l.badge_sub || ""}</div></div>`;
    row.appendChild(a);
  });

  /* 组名报给读屏:横滚行在辅助技术里只是个普通容器,不给名字就只剩一串链接,
     读不出"这是哪一组"。role 必须一起给 —— 光在裸 <div> 上挂 aria-label,
     多数读屏根本不读(没有角色的元素不进无障碍树)。
     ⚠️ 不给它加 tabIndex —— 可滚动容器浏览器本来就允许键盘滚动,
     手动加只会在 Tab 序里多出一站空的。卡片是 <a>,Tab + Enter 原生可达,
     聚焦到看不见的那张时浏览器会自己把它滚进可视区。*/
  row.setAttribute("role", "group");
  row.setAttribute("aria-label", group);

  // 跳转走 <a> 的默认行为,这里只顺手记下滚到哪儿了(处理器在导航之前跑完)
  row.addEventListener("click", () => saveShelfMem(memKey, row.scrollLeft));
  enableMouseDrag(row);                          // 桌面鼠标也能拖着滚

  return wrap;
}

/* 横滚位置的初始定位,优先级:本趟停过的位置 > 最近学的那一课 > 第一张。
   ⚠️ 必须在货架插进文档之后调用:没上树的元素量不到 offsetLeft,scrollLeft 也写不进去。
   ⚠️ 不用 scrollIntoView():它会连带把整页竖向滚一段 —— 一进目录页就被拽到
   第三个货架那儿去了。两张卡的 offsetLeft 之差不受 offsetParent 是谁的影响,
   正好等于要滚的距离(第一张停在 scrollLeft=0 时左缘正对标题)。 */
function restoreShelfPos(group, wrap, lessons){   // group 这里已是记忆键(级别|组)
  const row = wrap.querySelector(".shelf-row");
  const covers = row.children;
  const mem = shelfMem();
  let x = 0;
  if(typeof mem[group] === "number" && mem[group] > 0){
    x = mem[group];
  }else if(SAVE.last && SAVE.last.lesson){
    for(let i = 1; i < lessons.length; i++){    // 从 1 起:第 0 张本来就在 x=0
      if(lessons[i].id === SAVE.last.lesson){
        x = covers[i].offsetLeft - covers[0].offsetLeft;
        break;
      }
    }
  }
  if(x > 0) row.scrollLeft = x;                // 超出可滚范围浏览器自己会夹住
}

/* 清单还没回来时先占住版面(见 CSS 的「骨架屏」)。
   ⚠️ 两条出路都要记得撤掉它:成功时被真架子换掉,失败时在 catch 里清空。
   漏了失败那条,页面就是"错误提示 + 底下三个灰块还在呼吸",自相矛盾。 */
/* ── 级别切换器 + 分级货架 ─────────────────────────────────────────
   目录只显示一个级别的货架:K1 全套导入后课程翻倍,平铺的话孩子每天要
   滚过一整屏已学完的旧课才摸到正在学的。只有一个级别时切换器不渲染,
   页面和从前一个像素都不差。
   默认停在"当前级别"(手里排位最高的那个 —— 导入跟着孩子进度走,K1 学完
   才会有 K2);手动切换记在 localStorage(设备本地的浏览习惯,不进存档信封)。 */
var LV_KEY = "daka-level";
function pickLevel(levels){
  try{
    var m = localStorage.getItem(LV_KEY);
    if(m && levels.indexOf(m) >= 0) return m;
  }catch(e){}
  return levels[levels.length - 1];          // levels 已按 LV_ORDER 排,末位=当前级别
}
function renderLevels(lessons){
  var levels = [];
  lessons.forEach(function(l){
    if(levels.indexOf(lvOf(l)) < 0) levels.push(lvOf(l));
  });
  levels.sort(function(a, b){ return lvRank(a) - lvRank(b); });
  var bar = document.getElementById("lvBar");
  if(levels.length > 1){
    var cur = pickLevel(levels);
    bar.hidden = false;
    bar.innerHTML = levels.map(function(lv){
      return '<button type="button" class="lv-tab' + (lv === cur ? " on" : "") +
             '" data-lv="' + lv + '">' + lv + "</button>";
    }).join("");
    bar.onclick = function(e){
      var b = e.target.closest(".lv-tab");
      if(!b || b.classList.contains("on")) return;
      try{ localStorage.setItem(LV_KEY, b.dataset.lv); }catch(err){}
      renderLevels(lessons);                 // 重画切换器高亮 + 货架
    };
    renderShelves(lessons.filter(function(l){ return lvOf(l) === cur; }), cur);
  }else{
    bar.hidden = true;
    renderShelves(lessons, levels[0] || "K2");
  }
}
function renderShelves(lessons, lv){
  const shelves = document.getElementById("shelves");
  shelves.innerHTML = "";
  const order = [], byGroup = new Map();
  lessons.forEach(l => {
    const g = l.group || "其他 Others";
    if(!byGroup.has(g)){ byGroup.set(g, []); order.push(g); }
    byGroup.get(g).push(l);
  });
  order.forEach(g => {
    const ls = byGroup.get(g);
    const key = lv + "|" + g;                // 记忆键带级别,K1/K2 同名组不串位
    const wrap = buildShelf(g, ls, key);
    shelves.appendChild(wrap);
    restoreShelfPos(key, wrap, ls);          // 先上树再定位,理由见函数注释
  });
}

function showSkeleton(){
  var box = document.getElementById("shelves");
  box.innerHTML =
    '<div class="skel" aria-hidden="true">' +
    '<div class="skel-head"></div>' +
    '<div class="skel-row">' +
    '<div class="skel-card"></div><div class="skel-card"></div>' +
    '<div class="skel-card"></div></div></div>';
}

(async function(){
  renderCheckin();               // 打卡条不依赖课程清单,先画出来;清单拉不到也还在
  showSkeleton();
  try{
    const r = await fetch("lessons/index.json", {cache:"no-store"});
    if(!r.ok) throw new Error();
    const data = await r.json();
    renderContinue(data.lessons);            // 继续学/按课堂复习看全部级别
    renderDayPicker(data);
    renderLevels(data.lessons);              // 货架按级别渲染(单级别时没有切换器)
  }catch(e){
    // 骨架必须撤掉:留着它就是"永远在加载",而下面明明写着加载失败了
    document.getElementById("shelves").innerHTML = "";
    document.getElementById("note").innerHTML =
      "课程清单需要通过本地服务器访问：<br>在项目目录运行 <b>python3 -m http.server</b>，<br>然后浏览器打开 <b>http://localhost:8000</b>";
  }
})();
</script>
