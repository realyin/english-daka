<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的英语打卡</title>
<meta name="theme-color" content="#F0F7FF">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<!-- iOS 对 svg 的 apple-touch-icon 支持不好(多半会退回网页截图),所以这里指向 png。
     icon-180.png 由 docs/UI素材Prompt.md 的 A1 生成(1024 缩到 180),现在还没入库 ——
     404 无害:iOS 拿不到就退回原来的网页截图行为,和以前一模一样。
     favicon 仍然走矢量的 icon.svg,不受影响 -->
<link rel="apple-touch-icon" href="icon-180.png" sizes="180x180">

<style>
  :root{
    --bg:#F0F7FF; --ink:#2B3A55;
    --pink:#FF6FA5; --yellow:#FFC53D; --green:#4CC26E;
    --blue:#3E8BFF; --purple:#9B6DFF; --orange:#FF9A3D;
  }
  /* 全局禁选:长按单词是本应用的查词手势,不能被系统的"复制/翻译"选择菜单抢走
     (安卓长按会选中文字并弹出原生菜单,挡住我们的词义弹窗) */
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;
    -webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;
    -webkit-touch-callout:none;}
  /* 目录页 ⇄ 课程页是整页跳转,新文档在样式生效前会先刷一帧浏览器默认白底 ——
     深色底的封面流跳到这里就是"啪"一下白闪。背景写在 html 上,首帧就有色。
     overflow-x 必须封在 html 上(理由同 index.html 那段血泪注释,body 上没用):
     换课时 #pages 被 translateX(±60px) 滑出视口、换题 swapIn 也 ±40px 平移
     面板 —— 不封的话过渡的每一帧都在底部闪一条横向滚动条(桌面实测点名) */
  html{ background:var(--bg); overflow-x:hidden; }
  /* ===== 图标 =====
     UI 层原来用的是 emoji。emoji 的字形、粗细、基线各平台各不相同(安卓那套
     线条细、iOS 那套厚实),同一行里和文字高矮对不齐,而且换个系统整页气质就变了。
     换成内联 SVG:形状我们自己定,颜色跟着文字走(fill:currentColor),
     字号一变图标跟着变(1em 见方)。
     ⚠️ 课程内容层的 emoji(卡片贴纸槽 .lhead .emoji、考题选项、答题反馈 pResult)
     不在此列 —— 那些是课程数据画出来的画面,不是界面控件。
     ⚠️ 引用变量必须带回落值:这段内联 <style> 排在 theme.css 之前 */
  .ic{width:1em;height:1em;display:inline-block;vertical-align:-.12em;fill:currentColor;flex:none;}
  /* 星星金、火苗橙:这两个是"奖励/连胜"的语义色,不该跟着正文变灰 */
  .ic-star{color:var(--yellow,#FFC53D);}
  .ic-flame{color:var(--orange,#FF9A3D);}
  body{
    /* 与 theme.css 的 --font-main 保持同序:英文圆体优先、中文回落苹方。
       theme.css 万一没加载,这里也不能把 PingFang 排在英文字体前面 */
    font-family:ui-rounded,"SF Pro Rounded","Arial Rounded MT Bold",
                "Comic Sans MS","Trebuchet MS","PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--ink);
    min-height:100vh; padding-bottom:40px;
    /* 关掉滚动锚定:展开卡片时浏览器(安卓 Chrome)会挑一个可见节点当锚,
       内容一长就自己改 scrollTop 去"稳住"那个锚——正好把我们展开后补回来的
       滚动位置又冲掉,卡片重新往上窜。这页没有异步插内容的地方,不需要锚定 */
    overflow-anchor:none;
  }
  /* 课程页顶部只留一条吸顶工具条:返回 + 课程名 + 星星 + 模式切换。
     内容限宽到和卡片同一列 —— 否则宽屏上 flex 会把返回键甩到屏幕最左角,
     和内容完全脱节。课程页不再重复显示应用名,省下一整行高度。 */
  .topbar{
    position:sticky;top:0;z-index:20;background:var(--bg);
    /* 参数保持(负扩散只在下缘留一道窄影),但透明度从 .45 降到 .22 ——
       .45 是墨色硬阴影时代留下的,和全站的柔投影(--shadow 才 .10)不在一个量级,
       吸顶条底下那道黑边比页面上任何一张卡都重 */
    box-shadow:0 8px 14px -10px rgba(43,58,85,.22);
  }
  /* 纵向 padding/gap 比原来紧一档(8/8/11 → 6/6/8):页签合成分段控件后,
     容器自己多了一圈 2px 边框 + 3px 内衬(见 .tabs),不收一收整条顶栏反而变高 */
  .topbar-in{
    max-width:520px;margin:0 auto;padding:6px 14px 8px;
    display:flex;flex-direction:column;gap:6px;
  }
  /* gap 8 而不是 10:一行要塞下 back(48)+navbtn(48)+标题+navbtn(48)+星罐,
     375px 屏上 10px 的间距会把标题挤没 */
  .bar-row{display:flex;align-items:center;gap:8px;}
  /* min-width:64px —— 光有 min-width:0 时,窄屏上 flex 会把标题压到只剩一两个字
     再接省略号("K2 字母…" → "K…"),那还不如干脆不显示。给它一个下限:
     宁可让省略号早一点出现,也要保证标题始终是"一小段可读的字" */
  .lesson-title{
    flex:1;min-width:64px;font-size:15px;font-weight:800;color:var(--ink);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  /* 一行的固定宽度加起来已经 ~234px(48×3 + 星罐 ~58 + 4 个 8px 间距),
     320px 屏减掉 topbar-in 的左右 14px 只剩 ~58px 给标题 —— 顶不住 64 的下限,
     整条 bar 会溢出、把吸顶条撑得能横滚。所以下限只在 361px 以上生效,
     再窄就退回"能压多小压多小"(那种屏上标题本来也读不成句) */
  @media (max-width:360px){ .lesson-title{min-width:0;} }
  /* 星罐:白底细边。原来是黄底黄框 —— 顶栏一行里就有了两处黄色高亮
     (星罐 + 选中的页签),"现在在哪一栏"这条唯一该抢眼的信息被稀释了。
     星星本身是金色的 i-star,识别度已经够,罐子不必再染色。
     ⚠️ 返回/上下课钮已经去壳(见下),这一行现在是顶栏里**唯一**还带描边的
     小块 —— 它不是按钮,是个读数,留一圈边正好把它和旁边的图标钮分开 */
  .star-jar{
    flex:none;display:inline-flex;align-items:center;gap:5px;
    background:#fff;border:2px solid var(--line,#DCE5F2);border-radius:999px;
    padding:6px 12px;font-size:16px;font-weight:800;
  }
  /* 返回 / 上一课 / 下一课都去壳:一条顶栏原来并排 6 个白底描边投影块,
     壳的视觉重量比里面的图标还大。只留图标 + 48×48 热区(热区是不能缩的,
     壳没了也照样是 48)。没有底色可以"沉"下去了,按压反馈改成压透明度 ——
     和下面的 .tab 一个口径 */
  .back,.navbtn{
    flex:none;width:48px;height:48px;padding:0;
    border:none;background:none;box-shadow:none;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:opacity var(--dur-fast,.15s);
  }
  .back{font-size:22px;font-weight:800;color:var(--ink,#2B3A55);text-decoration:none;}
  /* 上一课/下一课:整页左右滑也能切,但按钮要在,否则孩子发现不了这个手势 */
  .navbtn{font-size:26px;line-height:1;font-weight:900;color:var(--blue,#3E8BFF);}
  .navbtn:disabled{opacity:.3;cursor:default;}
  .back:active,.navbtn:not(:disabled):active{opacity:.5;}
  /* 分段控件:三个页签共用**一个**盒子,边框/白底/投影只画在容器上,
     里面靠"选中的那块有黄底"区分。原来是三张各自描边投影的独立卡,
     既没说清"这三个是一组、只能选一个",又把顶栏塞得满满当当 */
  .tabs{
    display:flex;gap:2px;
    background:#fff;border:2px solid var(--line,#DCE5F2);border-radius:16px;
    padding:3px;box-shadow:var(--shadow-sm,0 1px 4px rgba(43,58,85,.14));
  }
  /* 字号跟屏宽收,别让"问答闯关"在窄屏折成两行 */
  /* gap 而不是靠 HTML 里那个空格:.tab 是 flex 容器,图标和文案是两个 flex 项,
     它们之间那个纯空白文本节点不参与布局(会被丢掉),写了空格也是贴在一起 */
  /* 圆角比容器小一档(16-3 内衬 ≈ 13,取 12):选中块的圆弧要贴着容器内壁走 */
  .tab{
    flex:1;padding:0 2px;min-height:44px;
    border:none;background:none;box-shadow:none;border-radius:12px;
    font-size:clamp(13px, 3.6vw, 15px);font-weight:800;color:var(--ink,#2B3A55);
    white-space:nowrap;gap:.35em;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:background var(--dur-fast,.15s) var(--ease-out,ease),
               opacity var(--dur-fast,.15s);
  }
  .tab.on{background:var(--yellow,#FFC53D);}
  .tab:active{opacity:.5;}
  /* pan-y:纵向滚动交给浏览器,横向留给"上一课/下一课"手势 */
  .page{display:none;padding:0 14px;max-width:520px;margin:0 auto;touch-action:pan-y;}
  .page.on{display:block;}
  /* 页签切换的方向感:往右边的页签走就从右边滑进来,往左走就从左边。
     三个页签是并排的一条,硬切会让人分不清刚才点的是哪一个 */
  @keyframes page-in-r{ from{ opacity:0; transform:translateX(26px); } }
  @keyframes page-in-l{ from{ opacity:0; transform:translateX(-26px); } }
  .page.page-in-r{ animation:page-in-r var(--dur-base) var(--ease-out); }
  .page.page-in-l{ animation:page-in-l var(--dur-base) var(--ease-out); }
  .hint{text-align:center;font-size:12px;color:#5E6E8C;margin-bottom:10px;line-height:1.7;}

  .panel{
    background:#fff;border:2px solid var(--line);border-radius:22px;
    box-shadow:var(--shadow);padding:16px;margin-bottom:14px;
  }

  /* 配图是问答的陪衬,不是主角:再按 26vh 兜一道底,
     矮屏(横屏平板/小窗口)上自动收窄,保证问答和选项不被挤出屏幕 */
  .pic{
    width:100%;max-width:min(200px, 26vh);margin:0 auto;
    aspect-ratio:3/4;object-fit:cover;display:block;
    border:2px solid var(--line);border-radius:16px;background:#EAF0F8;
  }
  .pic.mid{max-width:min(190px, 24vh);}   /* 闯关还要给下方选项留位置 */

  /* ===== 学一学 ===== */
  /* 卡片头部模板:左侧固定尺寸徽章槽(图片/算式/emoji 通吃)+ 词条 + 标签 */
  .lhead{display:flex;align-items:center;gap:12px;cursor:pointer;}
  .lhead .slot{
    flex:none;width:76px;height:70px;
    display:flex;align-items:center;justify-content:center;
  }
  /* ===== emoji 兜底的"贴纸"底 =====
     没配图的卡在列表里就是一个裸字符,和旁边那些有白框水彩缩略图的卡并排时,
     看着像"这张还没做完"。给 emoji 一层浅蓝渐变圆角底 + 同款细边框,
     两种卡的视觉重量就齐了 —— 尺寸也照着 .thumb 走(52×70),换图后
     补上 image 字段,位置一格都不会挪。
     字号从 40 收到 34:52px 宽减掉两条 2px 边框只剩 48px 内宽,40px 的
     emoji 字形(实际渲染常常比字号还宽一点)会顶到边上,贴纸就不像贴纸了 */
  .lhead .emoji{
    width:52px;height:70px;display:flex;align-items:center;justify-content:center;
    font-size:34px;line-height:1;
    background:linear-gradient(#F4F9FF,#E8F1FC);
    border:2px solid var(--line);border-radius:10px;
  }
  .lhead .thumb{width:52px;height:70px;object-fit:cover;border-radius:10px;border:2px solid var(--line);}
  .lhead .eq{font-size:14px;}
  .lhead .word{font-size:19px;font-weight:800;line-height:1.25;}
  .lhead .cn{font-size:12px;color:#5E6E8C;margin-top:2px;}
  /* 只剩「复习」这一种标记 —— 原课件字母课里夹的复习页(颜色/数数),
     内容留着,但标出来别和本课主线混。
     word/letter/sight/sign 那几个英文类型胶囊已删:孩子不认字,家长也不需要
     在每张卡上被告知"这是个 sight word",它只是给每一行加了一块彩色噪点 */
  .lhead .tag.review{
    margin-left:auto;font-size:10px;font-weight:700;color:#fff;
    background:var(--green,#4CC26E);
    border-radius:999px;padding:3px 9px;white-space:nowrap;
  }
  /* 展开/收起走 grid-template-rows 0fr→1fr:高度是内容撑出来的,不用 JS 量高。
     ⚠️ 三件套缺一不可 —— 外层 display:grid、内层 min-height:0 + overflow:hidden,
     少一个就折不平。不支持过渡 grid 的老内核(Safari 16 以前)照样能 0fr/1fr
     折叠,只是没动画,退回硬切。
     ⚠️ 内层的纵向 padding **不会**被 0fr 压掉(min-height:0 只让内容缩,padding
     留着),收起的卡会平白多出一条 14px 空条 —— 所以纵向 padding 只写在 .open
     状态里,并和行高一起过渡,收起时归零。
     横向 -4px 负边距是给 .mini / .sound-tile 的柔投影留的余量(overflow:hidden
     会把它切掉一条边);只动横向,纵向负边距会掺进 grid 行高计算。 */
  .dialog{
    display:grid;grid-template-rows:0fr;
    transition:grid-template-rows var(--dur-slow) var(--ease-out);
  }
  .lcard.open .dialog{grid-template-rows:1fr;}
  .dialog-in{
    overflow:hidden;min-height:0;padding:0 4px;margin:0 -4px;
    transition:padding var(--dur-slow) var(--ease-out);
  }
  .lcard.open .dialog-in{padding:10px 4px 4px;}
  /* 展开指示角标:卡片头看不出"这里能点开",一个会转的角标就够了。
     margin-left:auto —— 以前是类型标签把自己和角标一起顶到右边的,标签删了
     角标得自己撑;还带着「复习」标记的卡由标记接管撑开,角标贴着它(下一条) */
  .lhead .chev{
    flex:none;margin-left:auto;font-size:20px;font-weight:900;line-height:1;
    color:var(--muted,#5E6E8C);
    transition:transform var(--dur-base) var(--ease-out);
  }
  .lhead .tag.review + .chev{margin-left:6px;}
  .lcard.open .lhead .chev{transform:rotate(90deg);}
  /* 卡头右侧的小旗子:点一下手动进/出错题本(插旗=标记要练)(家长觉得不熟就标,不用等答错)。
     默认淡灰只当个安静的示能 —— 一页几十张卡,亮着反而吵;
     进本后换错题本的橙(和目录页错题本按钮同一身份色)。
     它接管 margin-left:auto 把自己和角标一起顶到右边,角标的 auto 让位
     (两个 auto 会平分空隙,书角被挤到中间) */
  .lhead .bookmark{
    flex:none;margin-left:auto;width:38px;height:38px;border:none;border-radius:50%;
    background:none;color:#C3D0E3;padding:0;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  .lhead .bookmark svg{width:20px;height:20px;fill:currentColor;}
  .lhead .bookmark.on{color:#9E5800;background:#FFF0DD;}
  .lhead .bookmark:active{transform:translateY(1px);}
  /* ⚠️ 是 ~ 不是 +:旗子和角标之间还隔着 .word-play(收起时 display:none,
     但元素在),相邻选择器够不着角标,它的 auto 边距就还活着 ——
     和旗子的 auto 平分空隙,每张卡的旗子停在各自文字宽度的中途,整列是乱的 */
  .lhead .bookmark ~ .chev{margin-left:2px;}
  /* 收起状态的旗子一律隐形(插没插旗都藏,曾留过"插了旗的当标记"——
     家长看着像残留物,实测点名撤掉;在不在错题本,展开卡片或目录页的
     错题本计数都看得到)。用 visibility 而不是 display:占位不变
     (display:none 会让 auto 边距换主人,整行布局跳),点到原位置落在
     卡头上 = 正常展开,误触也就不存在了。
     展开后旗子恢复可点,并和角标多拉开一点距离 */
  .lcard:not(.open) .lhead .bookmark{visibility:hidden;pointer-events:none;}
  .lcard.open .lhead .bookmark ~ .chev{margin-left:8px;}
  .word-play{display:none;}
  .lcard.open .word-play{display:inline-block;}

  /* ===== CVC 拼读 ===== */
  .sound-group{
    margin:22px 2px 10px;font-size:16px;font-weight:900;color:var(--ink);
    display:flex;align-items:center;gap:8px;
  }
  .sound-group::after{content:"";height:3px;background:#DCE7F5;flex:1;border-radius:9px;}
  .phonics{
    margin-top:12px;padding:13px;background:#F7FAFF;
    border:2.5px dashed #A9BCE0;border-radius:17px;text-align:center;
  }
  .phonics-step{font-size:11px;font-weight:800;color:#5E6E8C;margin:2px 0 8px;}
  .sound-tiles{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;}
  .sound-tile{
    min-width:62px;border:2px solid var(--line);border-radius:14px;
    background:#E7F0FF;color:var(--ink);padding:8px 9px;
    box-shadow:var(--shadow);cursor:pointer;
  }
  .sound-tile.vowel{background:#FFE5EF;}
  .sound-tile.silent{background:#EEF1F5;color:#5E6E8C;border-style:dashed;box-shadow:none;}
  .sound-tile:active,.sound-tile.speaking{transform:translateY(2px);box-shadow:none;background:var(--yellow);}
  .sound-tile .letter{display:block;font-size:25px;font-weight:900;line-height:1;}
  .sound-tile .ipa{display:block;font-size:12px;font-weight:700;margin-top:5px;}
  .sound-cue{font-size:12px;color:#66748B;font-weight:650;line-height:1.6;margin:10px auto 0;max-width:390px;}
  .blend-row{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:12px;flex-wrap:wrap;}
  .blend-chip{
    border:2px solid var(--line);border-radius:13px;background:#FFF3D6;
    padding:7px 13px;font-size:21px;font-weight:900;cursor:pointer;
  }
  .blend-arrow{font-size:18px;font-weight:900;color:#5E6E8C;}
  .blend-chip.speaking{background:var(--yellow);transform:scale(1.06);}
  .blend-word{font-size:28px;color:var(--purple);}
  .blend-play{margin-top:12px;background:var(--green);color:#fff;}
  .dialog .pic{margin-top:10px;}

  /* ===== 气泡:句级 + 词级点读 ===== */
  /* 气泡是纯信息展示,不是能按的控件 —— 2px 彩色描边是留给交互件的语言
     (.opt/.ans-chip 靠 border-color 报对错,.pic 的边是画框)。
     这里去掉边框只留底色,底色相应加深半档:没有边界线兜着,原来那两个
     很浅的底在白卡上会散成一片。padding 补回被边框吃掉的 2px,块的大小不变 */
  .bubble{
    max-width:88%;padding:11px 14px;border-radius:16px;
    font-size:16px;font-weight:600;line-height:1.55;margin-top:9px;
  }
  .bubble.q{background:#FFE8CE;border-bottom-left-radius:4px;margin-right:auto;}
  .bubble.a{background:#DCE8FF;border-bottom-right-radius:4px;margin-left:auto;}
  .bubble .who{font-size:10px;color:#5E6E8C;font-weight:700;display:block;margin-bottom:4px;}
  /* 角色标签只有 10px,图标按 1em 就是 10px —— 机器人的天线和眼睛在那个尺寸下糊成一团。
     放到 1.3em(13px)并把基线相应压下去,和旁边的字仍在一条线上 */
  .bubble .who .ic{width:1.3em;height:1.3em;vertical-align:-.28em;}
  .bubble{cursor:pointer;}
  .sline{margin-top:6px;}
  .sline:first-of-type{margin-top:0;}
  .line{display:flex;align-items:flex-start;gap:7px;}
  .mini{
    flex:none;width:27px;height:27px;border-radius:50%;
    border:2px solid var(--line);background:#fff;
    font-size:12px;font-weight:800;color:var(--ink);
    box-shadow:var(--shadow);cursor:pointer;padding:0;margin-top:1px;
  }
  .mini:active{transform:translateY(2px);box-shadow:none;}
  /* .mini 是 27px 的圆钮,12px 字号是当年给「中」那个汉字定的。emoji 的字形画得比
     字号大不少,换成 SVG 后按 1em 只有 12px,在圆钮里空一圈 —— 放到 1.35em(≈16px) */
  .mini .ic{width:1.35em;height:1.35em;vertical-align:-.3em;}
  .mini.on{background:var(--yellow);}
  .stext{flex:1;user-select:none;-webkit-user-select:none;}
  .stext.speaking{text-shadow:0 0 0;background:linear-gradient(transparent 65%, #FFE9A8 65%);border-radius:4px;}
  /* 点读热区:16px 的词自身只有 ~19px 高,手指点不准。
     不能直接往 .w 上加纵向 padding —— 气泡 line-height 是 1.55(行盒 ~25px),
     padding 一撑 .w.hl 的黄底就变成 33px 高、跨行压住相邻行的字。
     改用一层透明 ::after 单独扩热区:背景和排版都不动,伪元素又不是事件目标,
     e.target 仍是 .w,line 600 的 closest(".w") 判断照旧成立。
     横向只扩 1px(视觉 3px),把词间空白留给"点空白播整句"。 */
  /* ⚠️ display 从 inline 改成 inline-block 是为了让 .pressing 的 scale 生效
     (transform 对非替换的行内元素无效)。代价是背景框高度改由自身行高决定 ——
     所以要把 line-height 压回 1.25:直接继承气泡的 1.55 会让 .hl 的黄底长到
     27px,又变回上面那段说的"跨行压住相邻行的字"。vertical-align:baseline
     保证它和词间空格里的文字对得上。 */
  .w{
    padding:1px 2px;border-radius:6px;cursor:pointer;position:relative;
    display:inline-block;line-height:1.25;vertical-align:baseline;
    transition:background var(--dur-fast) var(--ease-out),
               transform var(--dur-fast) var(--ease-out);
  }
  .w::after{content:"";position:absolute;inset:-9px -1px;}
  .w.hl{background:var(--yellow);}
  /* 按住查词的过程反馈:按下 120ms 后才亮(轻点不闪),450ms 弹出词典时撤掉。
     底色比 .hl 浅一档 —— 这是"正在按住",不是"正在念" */
  .w.pressing{background:#FFE9A8;transform:scale(1.08);}
  .trans{
    display:none;font-size:12.5px;color:#5E6E8C;font-weight:600;
    margin-top:4px;padding-left:36px;
  }
  .sline.showzh .trans{display:block;}

  /* 一次性的手势提示条(第一次展开卡片时浮一下,4 秒自己淡掉)。
     这一条是给家长看的 —— 孩子不认字,长按这个手势没人告诉他就发现不了。
     做得小、占一行、插在问句气泡上方,不挡内容 */
  .coach-tip{
    width:fit-content;max-width:92%;margin:2px auto 8px;padding:6px 13px;
    border-radius:999px;background:#EFE6FF;color:var(--purple);
    font-size:12.5px;font-weight:800;text-align:center;line-height:1.4;
    transition:opacity var(--dur-base) var(--ease-out);
  }
  .coach-tip.out{opacity:0;}

  /* 词典弹窗 */
  /* ⚠️ 蒙层常驻 display:block(要过渡就不能 display:none),挡不挡得住整页点击
     全靠 pointer-events —— 少了 pointer-events:none 这行,整个应用会变成"点哪都
     没反应"。.show 才把它收回来 */
  #wpopWrap{
    display:block;position:fixed;inset:0;z-index:50;
    background:rgba(43,58,85,.35);
    opacity:0;pointer-events:none;
    transition:opacity var(--dur-base) var(--ease-out);
  }
  #wpopWrap.show{opacity:1;pointer-events:auto;}
  /* transform 里的 translateX(-50%) 是定位用的,任何时候都不能丢 */
  #wpop{
    position:absolute;left:50%;bottom:12vh;
    transform:translateX(-50%) translateY(24px) scale(.96);opacity:0;
    transition:transform var(--dur-base) var(--ease-spring),
               opacity var(--dur-base) var(--ease-out);
    width:min(320px, 86vw);
    background:#fff;border:2px solid var(--line);border-radius:22px;
    box-shadow:var(--shadow);padding:var(--sp-4,20px);text-align:center;
  }
  #wpopWrap.show #wpop{transform:translateX(-50%) translateY(0) scale(1);opacity:1;}
  /* 关闭按钮:视觉上是个小叉,热区靠 padding 撑到 48px —— 只能点蒙层关闭
     对孩子不成立,他不知道"外面"是可以点的 */
  .pop-close{
    position:absolute;top:0;right:0;min-width:48px;min-height:48px;padding:0;
    border:none;background:none;cursor:pointer;
    font-size:16px;font-weight:900;line-height:1;color:var(--muted,#5E6E8C);
    display:flex;align-items:center;justify-content:center;
  }
  /* 词典弹窗的缩略图:本课有这张卡的配图就顶上去。孩子不认字,"cat = 猫"
     这行中文对他同样是图形 —— 图才是他能直接读懂的那个解释。
     常驻在 DOM 里,由 JS 控制 display,找不到图就藏起来 */
  #wpop .pop-pic{
    display:none;width:120px;height:160px;object-fit:cover;
    border-radius:14px;margin:0 auto 12px;border:2px solid var(--line);
  }
  #wpop .pw{font-size:30px;font-weight:900;color:var(--purple);}
  #wpop .pc{font-size:16px;font-weight:700;margin-top:8px;line-height:1.5;}
  #wpop .pc.none{color:#5E6E8C;font-size:13px;}
  #wpop .mini{width:40px;height:40px;font-size:17px;margin-top:14px;}

  /* ===== 问答闯关 ===== */
  .p-head{text-align:center;}
  /* 同 .lhead .emoji:没配图时也要是一张"卡",不是一个飘在白底上的字符。
     不照抄 .pic.mid 的 3:4(190×253 的框里放一个 64px 的 emoji 太空),
     做成方形贴纸;上下外边距和 .p-head .pic 对齐,有图没图换位置不跳 */
  .p-emoji{
    font-size:64px;line-height:1;
    width:118px;height:118px;margin:10px auto 4px;
    display:flex;align-items:center;justify-content:center;
    background:linear-gradient(#F4F9FF,#E8F1FC);
    border:2px solid var(--line);border-radius:22px;
  }
  /* 机器人:闯关页常驻的那个"提问的人"。三个模块里只有闯关是一问一答的对话,
     但页面上从来没有出现过"谁在问" —— 一个会呼吸的小机器人就够了。
     里面装的是 i-robot 的 SVG,font-size 仍然决定它多大(.ic 是 1em 见方),
     呼吸/跳跃的动画和定位逻辑一行没动。
     inline-flex:transform 对纯行内元素无效(同 .w 那段的教训) */
  .bot{
    display:inline-flex;font-size:19px;line-height:1;vertical-align:-2px;
    margin-right:5px;animation:bot-breathe 3s ease-in-out infinite;
  }
  @keyframes bot-breathe{50%{transform:scale(1.06);}}
  /* 答对时跳一下:上跳带一点落地压扁(squash),纯位移看着像元素在滚动 */
  .bot.happy{animation:bot-hop .5s var(--ease-spring);}
  @keyframes bot-hop{
    25%{transform:translateY(-8px) scale(.92,1.10);}   /* 起跳:纵向拉长 */
    60%{transform:translateY(0)    scale(1.12,.88);}   /* 落地:压扁一下 */
  }
  /* 算式渲染(替代 keycap emoji,各平台样式一致) */
  .eq{display:inline-flex;align-items:center;gap:.28em;font-weight:900;}
  .eq b{
    background:var(--blue);color:#fff;border:none;
    border-radius:.32em;padding:.1em .36em;line-height:1.25;
    box-shadow:0 .08em .25em rgba(43,58,85,.25);
  }
  .eq b:nth-of-type(2){background:var(--pink);}
  .eq i{font-style:normal;color:var(--ink);font-size:.85em;}
  .p-head .eq{font-size:40px;margin-top:6px;}
  .eq-box{text-align:center;margin:16px 0 6px;}
  .eq-box .eq{font-size:54px;}
  /* 拼读串联没有配图时放大字母:整词一个底色连起来 ——
     三块不同颜色会让孩子把字母看成三个独立的东西,而这一问要练的正是"连成一个词" */
  .eq.letters b{background:var(--blue);letter-spacing:.1em;padding:.1em .3em .1em .4em;}
  .opt .eq{font-size:26px;}
  .p-word{font-size:28px;font-weight:900;color:var(--purple);}
  .p-head .pic{margin:10px auto 4px;}
  .chat{min-height:56px;margin-top:6px;display:flex;flex-direction:column;}
  .ctrl{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px;}
  .btn{
    border:2px solid var(--line);border-radius:16px;background:#fff;
    font-size:15px;font-weight:800;color:var(--ink);padding:12px 16px;
    box-shadow:var(--shadow);cursor:pointer;transition:transform var(--dur-fast,.15s);
  }
  .btn:active{transform:translateY(2px);box-shadow:var(--shadow-sm);}
  .btn.go{background:var(--green);color:#fff;}
  .btn.blue{background:var(--blue);color:#fff;}
  .heard{
    margin-top:12px;font-size:14px;color:#5E6E8C;text-align:center;
    background:#F4F6FA;border-radius:12px;padding:8px;display:none;
  }
  .heard b{color:var(--ink);}
  .p-hint{margin-top:14px;font-size:13px;color:#5E6E8C;font-weight:700;text-align:center;}
  .ans-chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:10px;}
  .ans-chip{
    border:2px solid var(--line);border-radius:16px;background:#FFF3D6;
    padding:12px 18px;font-size:20px;font-weight:900;color:var(--ink);
    box-shadow:var(--shadow);cursor:pointer;transition:transform var(--dur-fast,.15s);
  }
  .ans-chip:active{transform:translateY(2px);box-shadow:var(--shadow-sm);}
  /* 正在念到的那个选项高亮 —— 孩子靠"哪个在响"把声音和字对上 */
  .ans-chip.speaking{background:var(--yellow,#FFD34D);transform:scale(1.08);}
  /* 两段式选项的中间态:点过一下(听过音了),再点同一个才算选定。
     用 outline 不用 border —— 边框会改变尺寸让整行选项跳一下;
     蓝描边压在黄底 chip 上也够显眼 */
  .ans-chip.right{background:var(--green);color:#fff;}
  .ans-chip.wrong{background:#FFD9D9;animation:shake .3s;}
  @keyframes shake{25%{transform:translateX(-5px);}75%{transform:translateX(5px);}}
  .progress{text-align:center;font-size:13px;color:#5E6E8C;margin-bottom:8px;}
  /* 高度写死:min-height 44 挡不住 38px emoji 的真实行高(~50px),
     🎉 一出现这行就长 6px,整页跟着变长(实测点名)。空态就按 50 占好位 */
  .result-emoji{text-align:center;font-size:38px;margin-top:6px;height:50px;line-height:50px;}

  .done{text-align:center;font-size:19px;font-weight:800;line-height:1.8;}
  /* 结算页那个奖杯/庆祝贴纸(见下面的 .bigart)是整页的主角,
     却和成绩、按钮一起"啪"地出现 ——
     给它一个从小弹到大的入场,庆祝就有了一个开始的时刻。
     block 而不是原来的 inline-block:emoji 时代 54px 的字形跟半句话还能挤一行,
     换成 86px 的贴纸后同一行的文案会被顶得中途折行("……答/案,"孤字成行)。
     独占一行、靠 .done 的 text-align:center 居中,主角就该站在文案上面。
     (transform 对 block 一样有效,动画不受影响)
     动画时长 .5s ≈ celebrate() 等的 --dur-base(240ms)+ 号角起音,
     弹到位和彩带炸开正好前后脚 */
  .done .big{
    font-size:54px;display:block;
    animation:big-in .5s var(--ease-spring) both;
  }
  @keyframes big-in{from{opacity:0;transform:scale(.3);}}
  /* ===== 大图标位:水彩贴纸 + emoji 回退 =====
     入口页和结算页那个"主角"位置改用手绘水彩贴纸(lessons/images/ui-*.webp,
     由 docs/UI素材Prompt.md 的 S1~S4 生成)。素材还没入库,现在全是 404 ——
     img 的 onerror 给父级加 .noimg,换回原来的 emoji,所以图片没生成时
     外观和以前一模一样,不会留下一个碎图占位符。
     贴纸尺寸 86px ≈ 54px emoji 的视觉体量;入场动画由外层 .done .big 一起带,
     图和 emoji 都是同一下 big-in,换不换素材节奏都一样 */
  .bigart{display:inline-block;line-height:1;}
  .bigart img{display:block;width:86px;height:86px;object-fit:contain;margin:0 auto;}
  .bigart-fb{display:none;}
  .bigart.noimg img{display:none;}
  .bigart.noimg .bigart-fb{display:inline;}
  /* 主 CTA 一律胶囊:目录页的「继续学 / 混合复习」是 999px 的胶囊,
     课程页的「开始 / 再来一轮 / 下一课」和它们是同一个层级的按钮,
     圆角对不上就成了两套设计语言。padding 不动,只改圆角 */
  .big-btn{
    margin-top:16px;border:2px solid var(--line);border-radius:999px;
    background:var(--green);color:#fff;font-size:18px;font-weight:800;
    padding:13px 34px;box-shadow:var(--shadow);cursor:pointer;
  }
  .big-btn:active{transform:translateY(2px);box-shadow:var(--shadow-sm);}

  /* 结算页:两行成绩 + 竖排出口。三个按钮都是儿童热区,min-height 48px 起 */
  .done-stat{font-size:17px;font-weight:800;margin-top:4px;}
  .done-streak{font-size:15px;font-weight:800;color:var(--orange);margin-top:2px;}
  .done-acts{
    display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:18px;
  }
  .done-acts .big-btn{
    margin-top:0;min-height:48px;min-width:190px;
    display:inline-flex;align-items:center;justify-content:center;
    text-decoration:none;line-height:1.2;
  }
  /* 「回目录」是同级但更弱的出口:白底描边,别和主行动抢眼 */
  .big-btn.ghost{background:#fff;color:var(--ink);box-shadow:var(--shadow-sm);}

  /* ===== 考一考 ===== */
  .q-word{font-size:36px;font-weight:900;color:var(--purple);margin:6px 0 2px;text-align:center;}
  /* 听句选图的题面是整句,比单词长得多,压小并留边 */
  .q-sent{font-size:22px;font-weight:900;color:var(--purple);margin:6px auto 2px;
          text-align:center;line-height:1.35;max-width:19em;padding:0 8px;}
  .q-prompt{font-size:14px;color:#5E6E8C;text-align:center;}
  .speak-btn{
    margin:12px auto;width:58px;height:58px;border-radius:50%;
    border:2px solid var(--line);background:var(--blue);color:#fff;font-size:26px;
    box-shadow:var(--shadow);cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  .speak-btn:active{transform:translateY(2px);box-shadow:var(--shadow-sm);}
  .opts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px;}
  .opts.two{grid-template-columns:repeat(2,1fr);}
  .opt{
    border:2px solid var(--line);border-radius:18px;background:#fff;
    font-size:42px;padding:14px 0;box-shadow:var(--shadow);
    cursor:pointer;transition:transform var(--dur-fast,.15s);overflow:hidden;
  }
  /* 无图选项(emoji / 算式)也走贴纸底,和 .lhead .emoji、.p-emoji 一套。
     三选一里混着一张水彩图和两个白底 emoji 时,那张图会显得"更像答案" ——
     底色一致才是公平的三选一。
     ⚠️ 必须排在 .opt.right / .opt.wrong 之前:两边特指度都是 0,2,0
     (:not() 记它参数的特指度),靠先后顺序决胜,写到后面会把判分的绿/红盖掉 */
  .opt:not(.haspic){background:linear-gradient(#F4F9FF,#E8F1FC);}
  .opt.haspic{padding:0;font-size:0;}
  .opt.haspic img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block;}
  .opt:active{transform:translateY(2px);box-shadow:var(--shadow-sm);}
  /* 答对后整排选项会被 disable(见 nextQuestion)。不去掉 :active 的位移和
     手型,按下去还会"陷"一下,孩子以为点上了还在连点。
     注意别在这里加 opacity/灰底 —— 答对的那颗 .opt.right 要保持绿色高亮,
     它是这 1.8 秒定格里唯一的"你答对了"反馈。
     color/opacity 是压 UA 默认的 button:disabled 灰化(emoji 选项会被它调灰)。
     ⚠️ 上面这段原来在中间多了一个注释结束符,注释提前闭合,剩下的半句就成了
     选择器的一部分 —— 而带结束符的选择器是非法的,整条 .opt:disabled 规则会被
     浏览器整个丢掉,答对后那颗绿选项就被 UA 灰化了。
     CSS 注释不嵌套,所以正文里一个结束符都不能出现(这句话本身就是踩过的坑) */
  .opt:disabled{cursor:default;opacity:1;color:var(--ink);}
  .opt:disabled:active{transform:none;box-shadow:var(--shadow);}
  .opt.right{background:#DFF7E6;border-color:var(--green);animation:pop .4s;}
  .opt.wrong{background:#FFE3E3;border-color:var(--pink);animation:shake .4s;}
  @keyframes pop{50%{transform:scale(1.1);}}
  @keyframes shake{25%{transform:translateX(-6px);}75%{transform:translateX(6px);}}
  @media (prefers-reduced-motion: reduce){
    /* .ans-chip.wrong 用的是同一条 shake,以前漏在了外面 —— 判错时闯关的选项
       照抖不误。答错的红底本身就是反馈,关掉抖动不丢信息 */
    .opt.right,.opt.wrong,.ans-chip.wrong{animation:none;}
  }

  /* ===== 声音的两种"不正常"状态 =====
     .loading  正在等音频(点了 300ms 还没出声)——脉动,意思是"在忙,别再戳"
     .sound-fail  mp3 和 TTS 都没响 —— 抖两下,意思是"点到了,但它哑了"
     两个都只加在被点的那个元素上(句子行/单词/选项/喇叭钮),不弹任何文字:
     孩子不识字,提示条对他等于没有。 */
  .loading{animation:snd-load 1s ease-in-out infinite;}
  @keyframes snd-load{50%{opacity:.45;}}
  .sound-fail{animation:snd-fail .4s;}
  @keyframes snd-fail{
    20%{transform:translateX(-2px);} 40%{transform:translateX(2px);}
    60%{transform:translateX(-2px);} 80%{transform:translateX(2px);}
  }
  @media (prefers-reduced-motion: reduce){
    /* 动画关了也得留下"哑了"的痕迹,否则这条反馈整个消失 */
    .loading{animation:none;opacity:.5;}
    .sound-fail{animation:none;outline:2px solid var(--pink);}
  }

  /* ===== 奖励反馈层:飞星 / 彩带 / 进度条 ===== */
  /* 数字用等宽数位:0→10 位数变化时罐子宽度不跳,弹跳动画才不会跟着抖 */
  .star-jar #stars{font-variant-numeric:tabular-nums;}
  .star-jar.bounce{animation:jar-bounce .45s var(--ease-spring);}
  @keyframes jar-bounce{40%{transform:scale(1.22);}}
  /* 飞星和彩带都是 position:fixed 挂在 body 上的临时元素,
     z-index 必须高过 .topbar(20),否则星星飞到罐子跟前会钻到吸顶条底下 */
  .flystar{
    position:fixed;z-index:60;pointer-events:none;
    font-size:26px;line-height:1;will-change:transform,opacity;
  }
  .confetti{
    position:fixed;z-index:59;pointer-events:none;
    animation:confetti-fly 600ms var(--ease-out) forwards;
  }
  /* --dx/--dy 由 JS 逐片写在元素上,keyframes 只有一条、所有粒子共用 */
  @keyframes confetti-fly{
    from{ transform:translate(0,0) scale(1); opacity:1; }
    to  { transform:translate(var(--dx,0px),var(--dy,0px)) scale(.3); opacity:0; }
  }
  /* 进度条:"第 N/M 问"那行字对不认字的孩子等于没有,进度得看得见 */
  .pbar{
    height:12px;border-radius:99px;background:#E3ECF7;
    overflow:hidden;margin:0 auto 8px;max-width:260px;
  }
  .pbar i{
    display:block;height:100%;width:0;border-radius:99px;background:var(--green);
    transition:width var(--dur-slow) var(--ease-out);
  }
  @media (prefers-reduced-motion:reduce){
    .star-jar.bounce{animation:none;}
    .confetti{display:none;}

       这类常驻循环动画对前庭敏感的人最难受,必须关。
       ⚠️ .done .big 是 animation:...both —— 只写 animation:none 就够了
       (none 之后 fill-mode 也不再起作用,不会卡在 opacity:0 上) */
    .bot,.bot.happy{animation:none;}
    .done .big{animation:none;}
  }

  /* ===== 轻量提示条(toast):目前只给「横滑换课」用 =====
     手势换课是最容易误触的一步(孩子的手掌整个压在屏幕上划过去),
     所以换完要留一句话告诉他换到哪了、并给一条一步退回去的路。
     时长/缓动照旧走 theme.css 的 token,减弱动效时 --dur-base 归 0,
     transition 自然变成瞬时显示/消失,不用再写一条 media 规则关动画。
     z-index 要高过飞星(60)—— 星星飞过去时提示条不该被盖住 */
  .toast{
    position:fixed;left:50%;bottom:var(--sp-5,24px);z-index:70;
    display:flex;align-items:center;gap:10px;
    max-width:calc(100vw - 32px);
    padding:10px 10px 10px var(--sp-3,16px);border-radius:99px;
    background:rgba(30,42,64,.94);color:#fff;
    font-size:14px;font-weight:700;line-height:1.3;
    box-shadow:0 8px 24px rgba(20,30,50,.28);
    transform:translate(-50%,16px);opacity:0;pointer-events:none;
    transition:transform var(--dur-base) var(--ease-out),
               opacity var(--dur-base) var(--ease-out);
  }
  .toast.in{transform:translate(-50%,0);opacity:1;pointer-events:auto;}
  .toast .toast-msg{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .toast .toast-act{
    flex:none;border:0;border-radius:99px;padding:7px 14px;
    background:#fff;color:#1E2A40;
    font:inherit;font-weight:800;cursor:pointer;
  }
  .toast .toast-act:active{transform:scale(.94);}

  /* 键盘焦点圈:这页所有控件都是自绘样式,浏览器默认 outline 被圆角和阴影盖住,
     用键盘/外接设备走一遍完全看不出焦点在哪。:focus-visible 只对键盘生效,
     不会在触摸点击后留下一圈框(index.html 里已有同款规则) */
  button:focus-visible,a:focus-visible,[tabindex]:focus-visible{

  }

  /* 目录页 ⇄ 课程页的跨文档过渡(渐进增强)。不认识 @view-transition 的浏览器
     按 CSS 错误恢复规则整块跳过,退回原来的硬跳转,不会坏。
     两页都要声明,少一边就不生效。
     减弱动效时不写 navigation:none(嵌套 @view-transition 的支持度不明),
     改成把快照的动画关掉 —— 效果一样是瞬时,而且是稳的选择器语法 */
  @view-transition{ navigation:auto; }
  @media (prefers-reduced-motion:reduce){
    ::view-transition-group(*),
    ::view-transition-old(root),
    ::view-transition-new(root){ animation:none !important; }
  }

/* 进度存档(STORE_KEY / ymd / today / store)和复习账本(REV_KEY / REV_GAP /
   revStore / revRec)都在 shared.js 里 —— 那两段和目录页本来就是同一份代码,
   各存一份就得"改一处同步改两处"(两边的注释已经飘成两个版本了)。
   本文件只留自己独有的消费逻辑(记账时机、调度、手动进出错题本)。 */

/* 一次性示能演示的记账 —— 单独一个键 "daka.coach"({card:1,press:1};
   目录页那条 shelf 演示已随横滚货架改造去掉,旧存档里残留的 shelf:1 无害),
   和进度分开:清演示不该把星星一起清掉,反过来也一样。
   ⚠️ coachDone 读不到(隐私模式抛错)一律返回 true = "做过了" —— 存不住标记的
   浏览器里,演示会每次进页面都放一遍,那比不演示更烦人。 */
var COACH_KEY = "daka.coach";
function coachDone(k){
  try{
    var s = localStorage.getItem(COACH_KEY);
    var o = s ? JSON.parse(s) : null;
    return !!(o && typeof o === "object" && o[k]);
  }catch(e){ return true; }
}
function markCoach(k){
  try{
    var s = localStorage.getItem(COACH_KEY);
    var o = s ? JSON.parse(s) : null;
    if(!o || typeof o !== "object") o = {};
    o[k] = 1;
    localStorage.setItem(COACH_KEY, JSON.stringify(o));
  }catch(e){}
}
/* 同一个键下的**计数**槽位(目前只有 learnHint):有些提示不是"演一次就够",
   而是"看两次就记住了"。和布尔槽位互不干扰 —— 键名不同,coachDone 对数字
   也照样判真,两套读法不会打架。
   ⚠️ 读不到(隐私模式抛错)返回 Infinity = "早看够了",和 coachDone 返回 true
   是同一个取舍:存不住计数的浏览器里,每次进页面都摆一遍比不摆更烦人 */
function coachCount(k){
  try{
    var s = localStorage.getItem(COACH_KEY);
    var o = s ? JSON.parse(s) : null;
    return (o && typeof o === "object" && +o[k]) || 0;
  }catch(e){ return Infinity; }
}
function bumpCoach(k){
  try{
    var s = localStorage.getItem(COACH_KEY);
    var o = s ? JSON.parse(s) : null;
    if(!o || typeof o !== "object") o = {};
    o[k] = (+o[k] || 0) + 1;
    localStorage.setItem(COACH_KEY, JSON.stringify(o));
  }catch(e){}
}

/* 复习账本(REV_KEY / REV_GAP / revStore / revRec)见 shared.js。
   下面是这一页独有的部分:账本的键怎么拼、什么时候记一笔。 */
function revKey(card){ return card._src + ":" + card.word; }
/* 俩 ymd 差几天(b - a)。手拆再拼 Date:不走字符串解析,老 Safari 对
   ISO 串的时区解释踩过坑,本地日期构造没有歧义 */
function ymdDate(s){ var p = s.split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }
function dayDiff(a, b){ return Math.round((ymdDate(b) - ymdDate(a)) / 864e5); }
/* 记一笔:只在混合复习里调用(卡上有 _src 才记得了账)。
   对 → 升一盒;错/看答案 → 降一盒但最低留在盒 1 ——
   一错归零对成人背单词合理,对 5 岁孩子偶然点歪过于严厉,降一档已够拉回高频区。
   新卡(盒 0)答错留在盒 0:间隔 0 天等于天天到期,直到答对为止。
   回炉卡(_retry)一律不记账:错已经在原题记过了,当轮再问一遍只是当场闭环的
   练习 —— 记进去等于同一次错还能靠"马上重做"把盒号刷回来,调度就失真了。 */
function revMark(card, ok){
  if(CUR_ID !== "review" || !card || !card._src || card._retry) return;
  var o = revStore.load();
  // 一张卡一天只记一笔:当天已经记过账(不管对错)就只当练习,不再动盒子。
  // 否则错题本「再来一轮」连刷半小时,一张卡能靠短时记忆从盒 0 刷到毕业 ——
  // 短时记忆不算记住,间隔重复要的恰恰是隔夜验证。每天的第一答才定性。
  var prev = o[revKey(card)];
  if(prev && prev.t === today()) return;
  var r = revRec(o, revKey(card));
  if(ok) r.b = Math.min(r.b + 1, REV_GAP.length - 1);
  else { if(r.b > 1) r.b -= 1; r.w += 1; }
  r.t = today();
  revStore.save(o);
}

/* 手动进出错题本(学一学卡头上的小旗子)。
   revKey 只认 _src(复习临时课的卡才有),这里泛化:普通课里 CUR_ID 就是课程 id。
   进本 = 记成"今天就到期的低盒卡"(b=0,错次至少 1);
   出本 = 提前毕业到盒 4 —— 不删记录,历史错次留着,7 天后混合复习照常验证。
   这是家长的显式操作,不走 revMark 的一天一笔。 */
function revKeyOf(c){
  var src = c._src || (CUR_ID && CUR_ID !== "review" ? CUR_ID : null);
  return src ? src + ":" + c.word : null;
}
function inWrongBook(c){
  var k = revKeyOf(c);
  if(!k) return false;
  var o = revStore.load();
  if(!o[k]) return false;
  var r = revRec(o, k);
  return r.w > 0 && r.b <= 3;
}
function toggleWrongBook(c){
  var k = revKeyOf(c);
  if(!k) return null;
  var o = revStore.load();
  var r = revRec(o, k);
  var was = r.w > 0 && r.b <= 3;
  if(was){ r.b = 4; }
  else { r.b = 0; r.w = Math.max(r.w, 1); r.t = today(); }
  revStore.save(o);
  return !was;
}

function rec4(o, id){                          // 取/建某课的记录
  var r = o.lessons[id];
  if(!r || typeof r !== "object") r = {stars:0, done:0};
  if(typeof r.stars !== "number") r.stars = 0;
  if(typeof r.done  !== "number") r.done  = 0;
  o.lessons[id] = r;
  return r;
}
/* 打卡日保留多少条。原来是 60 —— 那时候只有目录页的"最近 7 天"要用它,
   留两个月绰绰有余。现在目录页的打卡日历要画**全程**,60 条等于最多两个月,
   "坚持了一年"这件事根本存不下来,所以放宽到 1200 天(三年多)。
   字符串日期一条 11 字节,1200 条连 dayStars 一起也就 40KB 上下,
   离 localStorage 的 5MB 还差两个数量级。 */
var KEEP_DAYS = 1200;
function markToday(o){                         // 今天并进打卡日,去重升序,只留最近 KEEP_DAYS 天
  var t = today();
  if(o.days.indexOf(t) < 0){
    o.days.push(t);
    o.days.sort();
    if(o.days.length > KEEP_DAYS){
      o.days = o.days.slice(o.days.length - KEEP_DAYS);
      // dayStars 必须跟着 days 一起裁:它是按天累加的,不裁就会无限长大,
      // 而且裁剩的日子在日历上根本画不出来,留着也没人看
      var keepS = {}, keepC = {}, i, k;
      for(i = 0; i < o.days.length; i++){
        k = o.days[i];
        if(typeof o.dayStars[k] === "number") keepS[k] = o.dayStars[k];
        if(typeof o.dayCards[k] === "number") keepC[k] = o.dayCards[k];
      }
      o.dayStars = keepS;
      o.dayCards = keepC;   // 和 dayStars 一样按天累加,不裁就无限长大
    }
  }
}
/* 连续天数:从今天往回逐日查;今天还没打就从昨天起算(白天打开时不该显示 0),
   昨天也没有才是真的断了。setDate(-1) 自带跨月跨年,别自己算天数。 */
function streakOf(days){
  var set = {}, i;
  for(i = 0; i < days.length; i++) set[days[i]] = 1;
  var d = new Date();
  if(!set[ymd(d)]){
    d.setDate(d.getDate() - 1);
    if(!set[ymd(d)]) return 0;
  }
  var n = 0;
  while(set[ymd(d)]){ n++; d.setDate(d.getDate() - 1); }
  return n;
}

/* CUR_ID = 当前课程 id。三档语义,别合并:
   真课程 id → 星数记到该课 + 记总数 + 记打卡日 + 记"最近学的课"
   "review"(混合复习)→ 只记总数和打卡日(它不是一节课,不该有自己的星罐)
   null(没带 ?lesson= 的预览课)→ 什么都不写 */
var CUR_ID = null;
/* review 的变体(URL 的 ?pick=):"wrong" = 错题本(账本切片),
   "day" = 按课堂复习(某天上课的卡,日期在 ?d=),null = 正常调度。
   CUR_ID 各变体下都是 "review" —— 记账、不建星罐、不存快照这些特例要照单全收 */
var REVIEW_PICK = null;
var REVIEW_DAY = null;   // pick=day 时的目标课堂日(YYYY-MM-DD,来自 URL 的 ?d=)
let stars = 0;                                 // 语义:**本课**累计星数(不是总数)
function addStars(n){
  stars += n;
  document.getElementById("stars").textContent = stars;
  if(!CUR_ID) return;
  var o = store.load();
  o.total = o.total + n;
  /* 记一笔"今天挣了多少星" —— 目录页的打卡日历靠它给格子分深浅:
     光有"来没来"只能画出两种颜色,分了深浅才看得出哪天是真的学了一大段。
     ⚠️ 这里是全站唯一的星星入账口(星罐动画那条路最后也落到这个函数),
     记在这一处就不会漏;将来要是又多出一条加星的路,也必须收到这里来。
     ⚠️ 和 o.total 一样只在 CUR_ID 存在时记(上面已经 return 过):
     没带 ?lesson= 的预览课不写任何存档。 */
  var t = today();
  o.dayStars[t] = (typeof o.dayStars[t] === "number" ? o.dayStars[t] : 0) + n;
  /* 挣到星星的那天就算打卡日。原来只有 recordFinish()(完成一整轮到结算页)
     才 markToday —— 孩子学了半截退出去,那天就"白学":日历上没格子、
     dayStars 里却有星数,统计还会出现"0 天打卡但有星星"的怪账(家长实际
     遇到了)。收进这里,和 dayStars 的口径合上:有星必有打卡日 */
  markToday(o);
  if(CUR_ID !== "review") rec4(o, CUR_ID).stars += n;
  store.save(o);
}

/* 学一学的打卡口径:当天展开听过 LEARN_MARK_N 张**不同的**卡就算打卡。
   K2 的孩子"听"本身就是学习,原来只有答题得星才留记录,认真听半小时的
   那天在日历上是空的(家长定的规则:3 张卡)。
   听卡不进真实的星星账(星罐/总星星只算做题),但**参与日历的深浅**:
   o.dayCards 记"当天听过几张不同的卡",目录页按 每 3 张折 1 星 和
   dayStars 加在一起分档(家长定的规则:听得多颜色也要深)。
   o.learnMark = {d:今天, cards:[今天听过的卡], done:打卡记了没}:
   按天自动重置;cards 全天保留用来去重和计数,同一张卡翻来覆去听只算一次;
   去重键是 课程id:词,跨课不串。
   ⚠️ 弹窗里写给家长看的规则文案(index.html 的 .cal-note)和它的折星算法
   (calTier 调用处的 /3)都写着"3",改这个数字要三处一起改 */
var LEARN_MARK_N = 3;
function noteLearnOpen(word){
  if(!CUR_ID) return;                          // 预览课不写任何存档,口径同上
  var o = store.load();
  var t = today();
  if(!o.learnMark || o.learnMark.d !== t) o.learnMark = {d: t, cards: [], done: false};
  var lm = o.learnMark, key = CUR_ID + ":" + word;
  if(lm.cards.indexOf(key) >= 0) return;       // 今天已经数过这张
  lm.cards.push(key);
  o.dayCards[t] = lm.cards.length;             // 给日历分深浅用的"今天听了几张"
  if(!lm.done && lm.cards.length >= LEARN_MARK_N){
    lm.done = true;
    markToday(o);
  }
  store.save(o);
}
/* 进课/换课时把星罐恢复成这一课的累计数,顺便记下"最近学的课" */
function loadLessonProgress(){
  var o = store.load();
  stars = (CUR_ID && CUR_ID !== "review") ? rec4(o, CUR_ID).stars : 0;
  document.getElementById("stars").textContent = stars;
  if(CUR_ID && CUR_ID !== "review"){
    o.last = {lesson: CUR_ID, at: today()};
    store.save(o);
  }
}
/* 完成一轮:记打卡日 + 该课完成轮数 +1。返回结算页要显示的总数与连续天数。
   ⚠️ 必须在 flushStars() 之后调用,否则半空中的星星还没落袋,total 少算 */
let doneStat = {total:0, streak:0};
function recordFinish(){
  var o = store.load();
  if(CUR_ID){
    markToday(o);
    if(CUR_ID !== "review") rec4(o, CUR_ID).done += 1;
    store.save(o);
  }
  return {total: o.total, streak: streakOf(o.days)};
}

/* ================================================================
   课程代号 lessonGen —— 换一次课加一,用来作废"上一课挂着的定时器"。
   考一考答对后要定格 1.8 秒再翻页;这 1.8 秒里横滑换了课,旧定时器照样会
   醒过来把**上一课的题**渲染进新课的面板(题目、图、答案全是旧课的,
   而 qi/quizOrder 也还是旧的,接着答下去整轮都是错位的)。
   凡是"会渲染内容或推进题号"的延时回调,都要先记下当时的 gen、
   回调里对不上就直接 return。纯装饰的定时器(飞星/彩带自删、
   .wrong 抖动清理)作废与否都无所谓,不用挂。
   ================================================================ */
let lessonGen = 0;

/* ================================================================
   本轮答题快照 —— sessionStorage 单键 "daka.round"
   { lesson, mode:"practice"|"quiz", at:存盘毫秒时间戳(30 分钟外作废,见 restoreRound),
     practice:{cards:[卡在 lesson.cards 里的下标...], pc, pq},
     quiz:{items:[{ci,kind,qaIdx,pic}...], qi} }
   为什么要存:闯关/考一考一轮 12 问,中途手一滑换了课(或干脆刷新),
   回来是从头再来 —— 孩子刚答到第 9 问,重来一遍就不肯玩了。
   ⚠️ 用**下标**定位而不是 word:同一课里 man/fan 这类词会有两张卡两张图,
   按词找回来可能找到另一张,题面就对不上了。找不回任何一张就整个丢弃快照,
   宁可从头,也不能拼出一轮张冠李戴的题。
   ⚠️ 只用 sessionStorage:标签页关掉就该忘掉,不是长期进度(那在 daka.v1)。
   ⚠️ 单槽:换到别的课并开一轮新的会把这一份顶掉,这是有意的取舍 ——
   多槽存下去要管过期和清理,收益却只有"两课来回切还都留着"这一种情形。
   ⚠️ review(混合复习)每次进来现抽卡片,下标指不回同一批题,不存也不恢复。
   ================================================================ */
var ROUND_KEY = "daka.round";
function roundLoad(){
  var o = null;
  try{
    var s = sessionStorage.getItem(ROUND_KEY);
    if(s) o = JSON.parse(s);
  }catch(e){ o = null; }
  return (o && typeof o === "object") ? o : null;
}
function roundWrite(o){
  try{
    if(o) sessionStorage.setItem(ROUND_KEY, JSON.stringify(o));
    else sessionStorage.removeItem(ROUND_KEY);
  }catch(e){}
}
function roundSnapshotOK(){ return !!CUR_ID && CUR_ID !== "review"; }
/* 存:只覆盖 mode 那一半,另一半(若还在)留着。
   at 是快照的救场时限:它只救"手滑换课/误刷新",不是隔天续考 ——
   restoreRound 那头 30 分钟外按过期清。
   ⚠️ 孩子亲手切页签离开进行中的一轮,视为"这轮先不玩了",
   tapPage 会把那半快照弃掉 —— 快照劫持落地页曾是真实投诉:
   sessionStorage 在一直不关的平板标签页里事实上永生,
   三天前没做完的半轮考一考每次进课都往里拽,还没有任何放弃的出口。 */
function saveRound(mode, data){
  if(!roundSnapshotOK()) return;
  var o = roundLoad();
  if(!o || o.lesson !== CUR_ID) o = {lesson: CUR_ID};
  o.mode = mode;
  o[mode] = data;
  o.at = Date.now();
  roundWrite(o);
}
/* 清:一轮做完了就把这一半抹掉;两半都没了就把键删干净 */
function clearRound(mode){
  var o = roundLoad();
  // 存的是别的课的快照就别动它 —— 在 B 课做完一轮不该去动 A 课那份
  if(!o || o.lesson !== CUR_ID) return;
  delete o[mode];
  if(o.mode === mode) delete o.mode;
  roundWrite((o.practice || o.quiz) ? o : null);
}

/* ================================================================
   声音:有预生成音频文件就播文件,没有降级到设备 TTS
   role: q=提问(童声/高音调) a=回答 w=单词(更慢)
   ================================================================ */
/* 设备 TTS 不是每个浏览器都有(国产壳浏览器、部分 WebView 就没有)。
   注意不能写 `speechSynthesis && ...` —— 全局不存在时,光是引用这个裸标识符
   就抛 ReferenceError,&& 根本轮不到执行;顶层抛错会让整个 <script> 停在那里,
   页面变成一片空白。必须用 typeof 或 window. 来探测。
   没有 TTS 不影响使用:所有句子/单词都有预生成的 mp3,TTS 只是加载失败时的兜底。 */
const TTS = (typeof speechSynthesis !== "undefined") ? speechSynthesis : null;
const HAS_TTS = !!(TTS && typeof SpeechSynthesisUtterance !== "undefined");

function ttsUtter(text, role){
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "en-US";
  u.rate = role === "w" ? 0.65 : 0.82;
  u.pitch = role === "q" ? 1.25 : 1.0;
  const v = TTS.getVoices().find(v=>v.lang.startsWith("en"));
  if(v) u.voice = v;
  return u;
}
let currentAudio = null;
/* 播放代号:打断只 pause 当前这条,队列里"下一条"的 250ms 定时器还在飞,
   不作废就会和新播的声音叠在一起(念选项时点了别的按钮最容易撞上) */
let playGen = 0;
function stopAllSound(){
  playGen++;
  if(TTS) TTS.cancel();
  if(currentAudio){ currentAudio.pause(); currentAudio = null; }
}
/* 点了却没声 —— 抖两下。孩子不识字,弹「音频加载失败」等于什么都没说;
   按钮抖一下他至少知道"我点到了,是它不响",不会继续戳到失去耐心。
   ⚠️ 只在 mp3 和 TTS 双双落空时才抖:mp3 失败但 TTS 顶上了,那是有声音的。 */
function soundFail(el){
  if(!el) return;
  el.classList.remove("sound-fail");
  void el.offsetWidth;                          // 重排一次动画才会重头播,否则连点第二下不抖
  el.classList.add("sound-fail");
  setTimeout(function(){ el.classList.remove("sound-fail"); }, 500);
}
function playSeq(items, onDone){
  stopAllSound();
  const gen = playGen;
  let i = 0;
  function next(){
    if(gen !== playGen) return;                 // 已被新的播放接管
    if(i >= items.length){ onDone && onDone(); return; }
    const it = items[i++];
    it.el && it.el.classList.add("speaking");
    /* 喇叭钮的加载态:网络慢的时候点下去要等好几秒才出声,中间没有任何反馈,
       孩子只会以为没点上、接着连戳。300ms 还没响就让按钮脉动起来。
       ⚠️ 门槛不能太低:本地/已缓存的音频几十毫秒就开播,闪一下反而是噪音。 */
    let slowT = 0;
    function unslow(){
      if(slowT){ clearTimeout(slowT); slowT = 0; }
      it.el && it.el.classList.remove("loading");
    }
    const finish = ()=>{
      unslow();
      it.el && it.el.classList.remove("speaking");
      setTimeout(next, 250);
    };
    if(it.audio){
      const a = new Audio(LESSON_BASE + it.audio);
      currentAudio = a;
      slowT = setTimeout(function(){
        slowT = 0;
        if(gen !== playGen) return;             // 已经被打断,别再往按钮上贴状态
        it.el && it.el.classList.add("loading");
      }, 300);
      a.addEventListener("playing", unslow);
      a.addEventListener("canplay", unslow);
      a.onended = finish;
      // noTts 的音(拼读纯音)没有 TTS 说法可退,mp3 挂了就是真的没声音 —— 抖一下
      const fallback = ()=>{
        unslow();
        if(it.noTts){ soundFail(it.el); finish(); }
        else ttsPlay(it, finish);
      };
      a.onerror = fallback;
      a.play().catch(fallback);
    }else if(it.noTts){
      finish();
    }else{
      ttsPlay(it, finish);
    }
  }
  function ttsPlay(it, cb){
    // 没有 TTS 就跳过这句,别卡住整个队列 —— 但要让孩子看见"这下没响"
    if(!HAS_TTS){ soundFail(it.el); cb(); return; }
    const u = ttsUtter(it.text, it.role);
    u.onend = cb;
    u.onerror = ()=>{ soundFail(it.el); cb(); };
    TTS.speak(u);
  }
  next();
}
function playOne(text, role, audio, cb, el){ playSeq([{text, role, audio, el}], cb); }
function playWord(word){
  const audio = lesson.word_audio ? lesson.word_audio[word] : null;
  playOne(word, "w", audio);
}
function praise(text, cb){
  const audio = lesson.praise_audio ? lesson.praise_audio[text] : null;
  playOne(text, "q", audio, cb);
}
if(TTS) TTS.getVoices();   // 预热音色表(部分浏览器首次调用是异步填充的)

const PRAISES = ["Great job!","Well done!","Awesome!","Excellent!","Perfect!"];
function randPraise(){ return PRAISES[Math.floor(Math.random()*PRAISES.length)]; }

/* ================================================================
   UI 音效:Web Audio 现场合成,零音频文件、零依赖
   ⚠️ 和上面那套语音是**两条完全独立的通道**:不经过 currentAudio / playGen,
   所以 stopAllSound() 打断不了它,它也永远打断不了语音 —— 语音是教学主体,
   音效只是"我点到了 / 我答对了"的即时回执,叠在语音上响没关系,盖住就有关系。
   保证不盖住的手段是一个总闸 master(增益 .2):所有音都串在它下面,
   同时响几个都超不过 .25。单个音的 peak 是相对总闸的比例,不是绝对音量。
   ⚠️ 每个音起止都要 ramp。直接 setValueAtTime 拉起/切断,扬声器会"啪"一声爆音,
   在小音量的平板上比音效本身还响。
   减弱动效(prefers-reduced-motion)不关音效 —— 那管的是动画,不是声音。
   ================================================================ */
var SFX = (function(){
  var ctx = null, master = null, dead = false;
  /* 懒创建:AudioContext 一建就占着音频硬件,没人点过按钮就不该建。
     ⚠️ 必须 typeof 探测 —— Safari 只有 webkitAudioContext,
     裸写 AudioContext 在没有它的内核上是 ReferenceError,顶层一抛整页白。*/
  function ac(){
    if(dead) return null;
    try{
      if(!ctx){
        var C = (typeof AudioContext !== "undefined") ? AudioContext
              : (typeof webkitAudioContext !== "undefined") ? webkitAudioContext
              : null;
        if(!C){ dead = true; return null; }
        ctx = new C();
      }
      // 首次用户手势之前 AudioContext 是 suspended。我们的音效全部由点击触发,
      // 所以这里 resume 天然满足"用户手势内"的要求,一次就能解锁。
      if(ctx.state === "suspended" && ctx.resume) ctx.resume();
      if(!master){
        master = ctx.createGain();
        master.gain.value = .2;          // 总闸:音效永远压在语音下面
        master.connect(ctx.destination);
      }
      return ctx;
    }catch(e){ dead = true; return null; }
  }
  /* attack/decay 包络。exponentialRamp 不接受 0,所以起止用 .0001 代替静音 */
  function env(gain, t0, dur, peak){
    var p = Math.max(.001, Math.min(peak || .4, 1));
    gain.gain.setValueAtTime(.0001, t0);
    gain.gain.exponentialRampToValueAtTime(p, t0 + Math.min(.012, dur * .3));
    gain.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
  }
  /* o = {freq, to(可选,滑到这个频率), type, at(相对现在的起始秒), dur, peak} */
  function tone(o){
    var c = ac(); if(!c) return;
    try{
      var t = c.currentTime + (o.at || 0);
      var osc = c.createOscillator(), g = c.createGain();
      osc.type = o.type || "sine";
      osc.frequency.setValueAtTime(o.freq, t);
      if(o.to) osc.frequency.exponentialRampToValueAtTime(o.to, t + o.dur);
      env(g, t, o.dur, o.peak);
      osc.connect(g); g.connect(master);
      osc.start(t);
      osc.stop(t + o.dur + .02);
    }catch(e){}
  }
  var api = { enabled: true };
  function on(fn){
    return function(){
      if(!api.enabled) return;
      try{ fn(); }catch(e){}          // 音效坏掉绝不能影响判分/翻页
    };
  }
  api.tap   = on(function(){ tone({freq:880, to:660,  dur:.04, peak:.45}); });
  api.pop   = on(function(){ tone({freq:620, to:880,  dur:.05, peak:.4});
                             tone({freq:880, to:1180, dur:.05, peak:.35, at:.045}); });
  api.flip  = on(function(){ tone({freq:1200, to:340, dur:.08, peak:.3, type:"triangle"}); });
  api.star  = on(function(){ tone({freq:1318.5, dur:.13, peak:.5});                 // E6
                             tone({freq:1760,   dur:.14, peak:.5, at:.11}); });      // A6
  // 答错要"低、软、比得星小一档":音量小、方波但增益压到 .22,像轻轻摇头,不像警报
  api.wrong = on(function(){ tone({freq:220, to:180, dur:.09, peak:.22, type:"square"});
                             tone({freq:165, to:140, dur:.10, peak:.18, type:"square", at:.085}); });
  api.win   = on(function(){ tone({freq:1046.5, dur:.2, peak:.45});                  // C6
                             tone({freq:1318.5, dur:.2, peak:.45, at:.13});          // E6
                             tone({freq:1568,   dur:.24, peak:.5, at:.26}); });      // G6
  return api;
})();

/* ================================================================
   奖励反馈层:飞星入罐 + 答对彩带 + 完成庆祝
   ================================================================ */
/* 动效总开关。durMs 归 0(theme.css 在减弱动效下把 token 清零)或系统直接
   报了 reduce,都按"不做动画"走 —— 但音效照播,那是另一回事 */
function motionOff(){
  if(durMs("--dur-base") <= 0) return true;
  try{
    return !!(window.matchMedia &&
              window.matchMedia("(prefers-reduced-motion:reduce)").matches);
  }catch(e){ return false; }
}

/* 还在半空中的星星:结算页要显示总数,得先把它们催落袋,
   否则"本课 星 × N"那行少算刚挣的那两颗(飞行 620ms,孩子手快就撞上了) */
var pendingLands = [];
function flushStars(){
  var q = pendingLands; pendingLands = [];
  for(var i = 0; i < q.length; i++) q[i]();   // land() 自带 landed 哨兵,重复调用无害
}

/* 从 fromEl 中心飞一颗(n≥2 飞两颗)金星进顶栏星罐,落袋时罐子弹一下,
   **然后才** addStars(n) —— 数字必须等飞完再加:先加数字再飞,孩子早看见分了,
   飞的那一下就没有"这颗星是我挣的"的因果感。
   ⚠️ 不改 addStars 的签名/语义(后续要做持久化,入口只能有一个)。
   ⚠️ 星罐在 sticky topbar 里永远可见,直接量 rect 就行,不用管滚动。
   减弱动效 / 量不到位置 / 没有 fromEl:直接 addStars,不飞。*/
function flyStar(fromEl, n, done){
  n = n || 1;
  var jar = document.querySelector(".star-jar");
  var a = null, b = null;
  if(fromEl && jar && !motionOff()){
    try{
      a = fromEl.getBoundingClientRect();
      b = jar.getBoundingClientRect();
    }catch(e){ a = null; }
  }
  if(!a || !b){ addStars(n); if(done) done(); return; }

  var landed = false;
  function land(){
    if(landed) return;
    landed = true;
    jar.classList.remove("bounce");
    void jar.offsetWidth;                       // 强制重排,否则连着答对两题不会重放
    jar.classList.add("bounce");
    setTimeout(function(){ jar.classList.remove("bounce"); }, 520);
    addStars(n);                                // 数字在罐子弹跳的同一帧 +n
    if(done) done();
  }
  pendingLands.push(land);

  var count = n >= 2 ? 2 : 1;                   // 两颗星飞两颗,但只加一次数字
  var x0 = a.left + a.width / 2,  y0 = a.top + a.height / 2;
  var x1 = b.left + b.width / 2,  y1 = b.top + b.height / 2;
  function launch(i){
    var s = document.createElement("span");
    s.className = "flystar";
    // 塞的是 i-star 的 SVG(金色),不是 emoji —— .flystar 的 font-size:26px 仍然
    // 决定它的大小(.ic 是 1em 见方),飞行/落袋这一整套逻辑一点没动
    s.innerHTML = IC_STAR;
    s.style.left = (x0 - 13) + "px";
    s.style.top  = (y0 - 13) + "px";
    s.style.transform = "translate(0,0) scale(1)";
    s.style.opacity = "1";
    document.body.appendChild(s);
    void s.offsetWidth;                         // 起点样式先落地,否则两次赋值被合并、过渡不跑
    var gone = false;
    function bye(){
      if(gone) return;
      gone = true;
      if(s.parentNode) s.parentNode.removeChild(s);
      if(i === count - 1) land();               // 最后起飞的那颗最后落地
    }
    setTimeout(function(){
      // cubic-bezier 的 y 起手为负 = 先微微下坠再飞出去,走出一道弧线;
      // 直线飞看着像 UI 元素在滑动,弧线才像"被吸进罐子里"
      s.style.transition = "transform 620ms cubic-bezier(.35,-0.2,.35,1), " +
                           "opacity 620ms linear";
      s.style.transform = "translate(" + (x1 - x0) + "px," + (y1 - y0) + "px) scale(.55)";
      s.style.opacity = ".25";
      // transform 和 opacity 各发一次 transitionend,bye 自带哨兵;
      // 另挂 setTimeout 兜底 —— 元素被别的逻辑摘掉时 transitionend 根本不会来
      s.addEventListener("transitionend", bye);
      setTimeout(bye, 1000);
    }, i * 120);
  }
  for(var i = 0; i < count; i++) launch(i);
}

/* 答对的彩带:在 fromEl 原地炸开 12–14 片,和飞星同时发生 ——
   粒子留在原地炸、星星飞去罐子,两件事层次分明,不会看成一团 */
var CONFETTI_VARS = ["--pink","--yellow","--green","--blue","--purple","--orange"];
function burst(fromEl){
  if(!fromEl || motionOff()) return;
  var r;
  try{ r = fromEl.getBoundingClientRect(); }catch(e){ return; }
  if(!r.width && !r.height) return;
  var x0 = r.left + r.width / 2, y0 = r.top + r.height / 2;
  var n = 12 + Math.floor(Math.random() * 3);
  function piece(i){
    var p = document.createElement("span");
    p.className = "confetti";
    var size = 6 + Math.floor(Math.random() * 5);          // 6–10px
    // 按序号铺满一圈再加抖动:纯随机方向会成片挤在一侧,看着像漏气不像炸开
    var ang  = Math.PI * 2 * (i / n) + (Math.random() - .5) * .5;
    var dist = 60 + Math.random() * 70;
    p.style.width  = size + "px";
    p.style.height = size + "px";
    p.style.left   = (x0 - size / 2) + "px";
    p.style.top    = (y0 - size / 2) + "px";
    p.style.background = "var(" + CONFETTI_VARS[Math.floor(Math.random() * CONFETTI_VARS.length)] + ")";
    p.style.borderRadius = Math.random() < .5 ? "50%" : "2px";
    p.style.setProperty("--dx", (Math.cos(ang) * dist).toFixed(1) + "px");
    p.style.setProperty("--dy", (Math.sin(ang) * dist - 20).toFixed(1) + "px");  // -20 让整团略微上飘
    document.body.appendChild(p);
    var gone = false;
    function bye(){
      if(gone) return;
      gone = true;
      if(p.parentNode) p.parentNode.removeChild(p);
    }
    p.addEventListener("animationend", bye);
    setTimeout(bye, 900);                                   // 兜底:动画被跳过时也要自删
  }
  for(var i = 0; i < n; i++) piece(i);
}

/* 闯关页那个提问的小机器人:答对时跳一下。
   ⚠️ 必须先摘 class 再强制重排:连着答对两题时,.happy 还挂在身上,
   重复 add 不会重放动画(同 flyStar 里罐子弹跳、showPage 里换页动画那一手)。
   ⚠️ animationend 之外还要挂 setTimeout 兜底:元素被换题的 innerHTML 抹掉、
   或者动画被跳过时,animationend 根本不会来 —— 那时 off() 里的 removeEventListener
   也就没人调,监听器会一直挂在一个已经离开文档的节点上。 */
function botHappy(){
  var el = document.getElementById("pBot");
  if(!el || motionOff()) return;
  el.classList.remove("happy");
  void el.offsetWidth;
  el.classList.add("happy");
  var gone = false;
  function off(){
    if(gone) return;
    gone = true;
    el.classList.remove("happy");
    el.removeEventListener("animationend", off);
  }
  el.addEventListener("animationend", off);
  setTimeout(off, 800);
}

/* 进度条的增长动画。
   ⚠️ 题面是 innerHTML 整块重建的,新 <i> 一出生就是新宽度,CSS transition
   压根没有旧值可过渡 —— 直接写死宽度只会"闪"到新位置,看不见涨。
   所以渲染后补一步:先把宽度按回上一题的值、强制重排、再设新值,过渡才真的跑。
   (另一条路是把 pbar 挪到 swapIn 容器外面固定一条,但那样进度条就不跟着换题
   一起滑,和题面脱开了,反而更奇怪)*/
function growBar(el, from, to){
  if(!el) return;
  if(durMs("--dur-slow") <= 0 || from === to) return;   // 减弱动效:留在新宽度上,不折腾
  el.style.width = from + "%";
  void el.offsetWidth;
  el.style.width = to + "%";
}

/* 结算页的号角 + 彩带 + 人声夸奖。
   ⚠️ 要等换页滑动落位再炸:swapIn 调 render() 的那一刻面板还偏在 -40px 上,
   这时量 .done .big(奖杯/庆祝贴纸)的位置,彩带会炸在它左边 40px 的空处。
   ⚠️ 人声比号角晚 300ms:号角只有半秒,压着人声开头一起响会把
   "You did it" 的第一个词糊掉。目标次序是「号角+彩带同帧 → 随后人声」*/
function celebrate(box, say){
  var gen = lessonGen;                 // 结算页刚出来就被横滑换掉课:号角和彩带作废
  setTimeout(function(){
    if(gen !== lessonGen) return;
    SFX.win();
    burst((box && box.querySelector(".done .big")) || box);
    setTimeout(function(){ if(gen === lessonGen) say(); }, 300);
  }, durMs("--dur-base"));
}

/* ================================================================
   点读句子构建:每个单词可点(发音)、可长按(词典)
   sline = [喇叭钮][眼睛钮] 单词们 + 隐藏的整句翻译
   ================================================================ */
function normWord(w){ return w.toLowerCase().replace(/[^a-z']/g, ""); }
/* 整词/短语匹配用:前后补空格,避免 man 命中 woman */
function norm(s){
  return " " + s.toLowerCase().replace(/[^a-z' ]/g, " ").replace(/\s+/g, " ").trim() + " ";
}
function lookup(w){
  if(DICT[w]) return DICT[w];
  if(w.endsWith("'s") && DICT[w.slice(0,-2)]) return DICT[w.slice(0,-2)] + " 的";
  if(w.endsWith("s") && DICT[w.slice(0,-1)]) return DICT[w.slice(0,-1)];
  if(w.endsWith("es") && DICT[w.slice(0,-2)]) return DICT[w.slice(0,-2)];      // boxes→box
  if(w.endsWith("ies") && DICT[w.slice(0,-3)+"y"]) return DICT[w.slice(0,-3)+"y"];
  if(w.endsWith("ing") && DICT[w.slice(0,-3)]) return DICT[w.slice(0,-3)];     // running→run
  if(w.endsWith("ed") && DICT[w.slice(0,-2)]) return DICT[w.slice(0,-2)];
  return null;
}

let popCurrentWord = null;
/* 本课有没有这个词的配图。匹配只做两档:精确、以及去掉复数 s ——
   双向 startsWith 这类"聪明"匹配会把 cat 配到 caterpillar 的图上,
   给一个不认字的孩子配错图比不配图更糟 */
function popPicSrc(word){
  var cards = (lesson && lesson.cards) || null;
  if(!cards) return null;
  var w = String(word).toLowerCase();
  var alt = (w.length > 2 && w.charAt(w.length - 1) === "s") ? w.slice(0, -1) : null;
  var i, cw;
  for(i = 0; i < cards.length; i++){
    if(!cards[i].image) continue;
    cw = String(cards[i].word || "").toLowerCase();
    if(cw === w || (alt && cw === alt)) return imgSrc(cards[i].image);
  }
  return null;
}
function openPop(word){
  popCurrentWord = word;
  var pic = document.getElementById("popPic"), src = popPicSrc(word);
  // ⚠️ 先 display 再 src:这张图是 loading="lazy" 的,而 display:none 的图
  // 不在视口里、不会开始加载。反过来写等于让它在隐身状态下排队,白等一帧
  if(src){ pic.style.display = "block"; pic.src = src; }
  else   { pic.removeAttribute("src"); pic.style.display = "none"; }
  document.getElementById("popWord").textContent = word;
  const cn = lookup(word);
  const pc = document.getElementById("popCn");
  pc.textContent = cn || "这个词还没收进词典";
  pc.className = cn ? "pc" : "pc none";
  // 蒙层常驻 display:block(见 CSS),显隐靠 .show 走过渡
  document.getElementById("wpopWrap").classList.add("show");
  playWord(word);
}
function closePop(){
  document.getElementById("wpopWrap").classList.remove("show");
}
function popSpeak(){ if(popCurrentWord) playWord(popCurrentWord); }
/* 弹窗是在长按过程中弹出来的,手指还按着,安卓会接着选中弹窗里的词并弹原生菜单 */
document.getElementById("wpopWrap").addEventListener("contextmenu", e=>e.preventDefault());
document.getElementById("wpopWrap").addEventListener("click", e=>{
  if(e.target.id === "wpopWrap") closePop();
});

function makeWordSpan(raw){
  const word = normWord(raw);
  const sp = document.createElement("span");
  sp.className = "w";
  sp.textContent = raw;
  if(!word) return sp;
  /* 句中的 /s/ /ks/ 这类音标要点出纯音 —— 走 words/ 会读成字母名
     ("ess"、"kay ess"),那是这个词条里最不该听到的声音 */
  const ph = raw.match(/^\/([a-z]+)\/[.,!?]*$/);
  if(ph){
    sp.onclick = e=>{
      e.stopPropagation();
      sp.classList.add("hl");
      setTimeout(()=>sp.classList.remove("hl"), 500);
      // noTts:纯音没有对应的 TTS 说法,音频缺了就安静,别去念 "slash k s slash"
      playSeq([{text: raw, role: "w", audio: chipAudio("/" + ph[1] + "/"),
                noTts: true}]);
    };
    return sp;
  }
  /* 长按 450ms 弹词典。整个过程原来是没有任何反馈的 —— 孩子按住不动,屏幕
     也不动,他没法知道"再按一会儿就有东西",通常半路就松手了。
     按下 120ms 后先把词点亮(轻点不会闪一下),弹出词典那一刻撤掉。
     两个定时器要一起清:只清 timer 会把 .pressing 永久留在词上。 */
  let timer = null, hold = null, longed = false;
  const unpress = ()=>{
    clearTimeout(hold); hold = null;
    sp.classList.remove("pressing");
  };
  const start = e=>{
    longed = false;
    hold = setTimeout(()=>{ sp.classList.add("pressing"); }, 120);
    timer = setTimeout(()=>{ longed = true; unpress(); openPop(word); }, 450);
  };
  const end = e=>{
    clearTimeout(timer);
    unpress();
    // 手指是横着划过去的(在换课),不是点这个词
    if(!longed && Math.abs(swDx) < 12){
      sp.classList.add("hl");
      setTimeout(()=>sp.classList.remove("hl"), 500);
      playWord(word);
    }
    e.preventDefault(); e.stopPropagation();
  };
  sp.addEventListener("pointerdown", start);
  sp.addEventListener("pointerup", end);
  sp.addEventListener("pointercancel", ()=>{ clearTimeout(timer); unpress(); });
  sp.addEventListener("pointerleave", ()=>{ clearTimeout(timer); unpress(); });
  sp.addEventListener("contextmenu", e=>e.preventDefault());
  return sp;
}

function makeSline(text, cn, role, audio){
  const sline = document.createElement("div");
  sline.className = "sline";
  const line = document.createElement("div");
  line.className = "line";

  const spk = document.createElement("button");
  spk.className = "mini"; spk.innerHTML = IC_SPEAKER;
  spk.setAttribute("aria-label", "朗读这一句");
  const stext = document.createElement("span");
  stext.className = "stext";
  spk.onclick = e=>{ e.stopPropagation(); playOne(text, role, audio, null, stext); };

  // 「中」是个汉字,对不认字的孩子和旁边的英文一样是图形;换成眼睛图标,
  // "看一眼" 这个动作他能自己猜出来(aria-label 留给读屏和家长)
  const zh = document.createElement("button");
  zh.className = "mini"; zh.innerHTML = IC_EYE;
  zh.setAttribute("aria-label", "显示中文翻译");
  zh.onclick = e=>{
    e.stopPropagation();
    sline.classList.toggle("showzh");
    zh.classList.toggle("on");
  };

  text.split(" ").forEach((raw,i)=>{
    if(i) stext.appendChild(document.createTextNode(" "));
    stext.appendChild(makeWordSpan(raw));
  });

  line.appendChild(spk);
  if(cn) line.appendChild(zh);
  line.appendChild(stext);
  sline.appendChild(line);
  // 点句子行的空白处(非单词、非按钮)也播放整句
  sline._say = { text, role, audio, el: stext };
  sline.addEventListener("click", e=>{
    if(e.target.closest(".w") || e.target.closest(".mini")) return;
    e.stopPropagation();
    playOne(text, role, audio, null, stext);
  });
  if(cn){
    const tr = document.createElement("div");
    tr.className = "trans"; tr.textContent = cn;
    sline.appendChild(tr);
  }
  return sline;
}

/* 一整个气泡(问 或 答) */
function makeBubble(role, qa){
  const b = document.createElement("div");
  b.className = "bubble " + role;
  const who = document.createElement("span");
  who.className = "who";
  who.innerHTML = (role === "q" ? IC_ROBOT : IC_SPEECH) + (role === "q" ? " 提问" : " 回答");
  b.appendChild(who);
  if(role === "q"){
    b.appendChild(makeSline(qa.q, qa.q_cn, "q", qa.q_audio));
  }else{
    qa.a.forEach((s,i)=>{
      b.appendChild(makeSline(s, (qa.a_cn||[])[i], "a", (qa.a_audio||[])[i]));
    });
  }
  // 点气泡自身的空白处(边缘、角色标签)顺序播放整个气泡。
  // ⚠️ 角色标签里现在嵌着一个 <svg> 图标,点正它时 e.target 是那个 svg 而不是 .who ——
  // 所以用 closest 往上找,不能再判 classList
  b.addEventListener("click", e=>{
    if(e.target !== b && !e.target.closest(".who")) return;
    const items = [...b.querySelectorAll(".sline")].map(s=>s._say).filter(Boolean);
    if(items.length) playSeq(items);
  });
  return b;
}

/* ================================================================
   学一学:点开卡片看对话,不自动播,句句可点、词词可点
   ================================================================ */
/* 卡片头的类型胶囊只剩「复习」一种:课程数据里的 tag 还有 word/letter/sight
   word/sign/CVC/number/science 等等,但那些是给做课件的人看的分类,渲染到每张卡上
   只是一行行彩色噪点。review 不一样 —— 它标的是"这一页不是本课主线"(原课件字母课里
   夹的颜色/数数复习页),家长需要这条信息,所以留着,并且用中文说 */
function tagHTML(t){ return t === "review" ? `<span class="tag review">复习</span>` : ``; }
/* 卡片算式("9-1" / "0")→ 彩色数字块,替代渲染不可控的 keycap emoji */
function eqHTML(eq){
  return `<span class="eq">` +
    String(eq).split("-").map(x=>`<b>${x}</b>`).join("<i>−</i>") + `</span>`;
}
function imgSrc(p){ return p.startsWith("data:") ? p : LESSON_BASE + p; }

/* 拼读串联的问答没有配图时,把要拼的几个字母放大成色块顶上去。
   sot / mot 这类假词本来就没有对应的东西可画,硬配一张图等于告诉孩子这是真词;
   放字母反而正对着这一问要练的事 —— 看字母、出声、拼成词。 */
function letterTiles(word){
  return `<span class="eq letters"><b>${String(word).toUpperCase()}</b></span>`;
}

/* 考一考只收「一张图 = 一个词」的卡片。
   聚合卡(word 是 "more T words"/"sound it out" 这类页面标题,不是单词)会问出
   “Which one is more T words?”——无法作答;没图没算式的卡片则只能渲染成空白方块。
   两种都用 quiz:false 或缺少可视内容排除掉,课程可用题不足 2 张就整个隐藏考一考。 */
/* 一轮打卡的题量上限(闯关和考一考各自计) */
const ROUND_MAX = 12;

function quizCards(){
  return (lesson.cards || []).filter(
    c => c.quiz !== false && (c.image || c.eq || c.emoji));
}

/* 考一考有两种问法,同一批图共用:
   - word 题「哪一个是 X?」—— 只在卡的 word 就是画里那个东西时成立
   - sent 题「听一听,说的是哪一张?」—— 播这条问答的答句音频,选图
   虚词卡(here / is / to / my / like)的 word 根本画不出来,word 题无解;
   但它们底下的问答各自有单格图和答句音频,改成听句选图就成立了,
   而且练的是"听懂整句"而不是"认单词",对虚词才是对的考法。*/
/* 套话句式:说的是"这个词"不是画面,不能拿来听句选图
   ("It's sight word my." 对着任何图都成立) */
const QUIZ_FORMULA = /^(it's|this is|it is)\s+(sight word|key word|letter|number)\b|\bbegins with\b|\bends with\b|\bmakes the sound\b|belong to|family\.?$/i;

/* quiz:false 只挡 word 题,不该连带挡掉好的 sent 题 ——
   虚词卡(is / to)的 word 问不出来,但它每一问都有自己的单格图和答句,
   听句选图完全成立。所以 sent 题只认「这一问自己的图」:
   - t.image 是拆图时回填的单格图,一问一图,可靠
   - 整张卡只有一问、且这张卡本身可考时,卡片图就是这一问的图
   反过来,残余聚合卡(sort it out / need)只有一张拼图、没有单格图,
   两种题都出不来,正是我们要的。*/
/* 这张卡的图是不是「画着好几样东西的整版拼图」。拼图配一句话必然对不上
   (recycling-sort 四格里根本没有 glass),两种考题都出不来。
   ⚠️ 这是**卡片上显式声明**的,不要再退回按文件名推断。
   曾经的写法是「同一课里有别的图以它的名字加连字符开头,它就是拼图」——
   因为拆图的单格图叫 <拼图名>-<词>.webp。但这是把语义塞进文件名,
   一撞前缀就误伤:o-box.webp(纸箱里的狐狸)被 o-box-fox-in.webp 顶掉、
   f-fox 被 f-fox-forest 顶掉…… 实测 10 张正经的一图一词卡被挡在考一考外面,
   而它们跟拼图毫无关系,只是名字撞了。命名从此可以自由取。*/
function isCollage(card){
  return !!(card && card.collage);
}

function quizItems(){
  const items = [];
  for(const c of (lesson.cards || [])){
    // 整版拼图当选项永远是坏题(画着四样东西,问哪一个是 X 无从答起),
    // 两种题都挡掉,不必等数据侧补 quiz:false
    const wordOK = c.quiz !== false && !!(c.image || c.eq || c.emoji)
                   && !isCollage(c);
    if(wordOK)
      items.push({kind:"word", c, image:c.image, eq:c.eq, emoji:c.emoji,
                  pic: c.image || c.eq || c.emoji});
    for(const t of c.dialog){
      const img = t.image || (c.dialog.length === 1 && !isCollage(c) ? c.image : null);
      if(!img || !t.a_audio) continue;
      // 一问的答句可能不止一条:["It's sight word my.", "This is my toy."]
      // 第一条常是套话(说的是词不是画面),往后找第一条真正描述画面、且配了音的
      const ai = t.a.findIndex((s, i) => t.a_audio[i] && !QUIZ_FORMULA.test(s));
      if(ai >= 0) items.push({kind:"sent", c, qa:t, ai, image:img, pic:img});
    }
  }
  return items;
}
/* 选项池:按图去重(同一张图既有 word 题又有 sent 题,做选项时只算一个) */
function quizPics(){
  const seen = new Set();
  return quizItems().filter(it => !seen.has(it.pic) && seen.add(it.pic));
}
