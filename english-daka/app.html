/* 读 theme.css 里的动效时长 token,换算成毫秒。
   一切"等动画播完再干活"的逻辑都以它为准 —— 系统开了「减弱动效」时 token 是 0s,
   这里返回 0,调用方就该走直通分支(不等待、不监听 transitionend)。
   theme.css 万一没加载,取到空串,同样按 0 处理:没有过渡可等,直接硬切。
   ES5 写法(不用 ?? / ?.),这是顶层脚本,一处新语法就能白掉整页 */
function durMs(name){
  var v = "";
  try{
    v = getComputedStyle(document.documentElement).getPropertyValue(name || "--dur-base");
  }catch(e){ return 0; }
  v = String(v).trim();
  if(!v) return 0;
  if(v.slice(-2) === "ms") return parseFloat(v) || 0;
  if(v.slice(-1) === "s")  return (parseFloat(v) || 0) * 1000;
  return parseFloat(v) || 0;
}

/* 等卡片展开动画结束再执行 fn。
   ⚠️ 两道保险都不能省:老内核(Safari 16 以前)不支持过渡 grid-template-rows,
   压根不会发 transitionend;减弱动效时时长为 0 也不会发。所以既监听 transitionend,
   又挂一个 setTimeout 兜底,谁先到谁算数(done 标志防止跑两次)。*/
function afterExpand(dialog, fn){
  var ms = durMs("--dur-slow");
  if(ms <= 0){ fn(); return; }
  var done = false;
  function finish(){
    if(done) return;
    done = true;
    dialog.removeEventListener("transitionend", onEnd);
    fn();
  }
  function onEnd(e){
    // 只认 dialog 自己那条 grid 行高的过渡:里面气泡/图片的过渡不算数
    if(e.target === dialog && e.propertyName === "grid-template-rows") finish();
  }
  dialog.addEventListener("transitionend", onEnd);
  setTimeout(finish, ms + 50);
}

// 卡片头别缩在吸顶条底下,卡片尾别掉出屏幕。
// 两个诉求冲突时(长卡装不下)以"头露出来"为准——孩子要先看见点的是哪个词
function revealDelta(d){
  const bar = document.querySelector(".topbar").getBoundingClientRect().bottom;
  const r = d.getBoundingClientRect();
  const topRoom = r.top - (bar + 8);            // >0 说明头下方还有余量可以往上滚
  const overflow = r.bottom - (innerHeight - 8); // >0 说明卡尾露在屏幕外
  if(topRoom < 0) return topRoom;
  if(overflow > 0) return Math.min(overflow, topRoom);
  return 0;
}
// 过渡结束后的兜底校正(懒加载的图片把高度撑变了之类)。
// 用瞬时滚动:平滑滚动在部分内核里被静默忽略(预览浏览器就是),
// 补位补不上等于没修;正常情况下主补位已由 glideScrollBy 和展开动画
// 同步跑完,这里量到的是 0 或几个像素
function revealCard(d){
  const delta = revealDelta(d);
  if(delta) window.scrollBy(0, delta);
}
/* 和展开动画并行的滚动:自己 rAF 驱动(不依赖内核的 smooth 支持),
   缓动形状对齐 --ease-out,时长同 --dur-slow —— 卡片撑开和页面滚动是
   同一个动作,分两段做(先展完、再瞬移)看着就是"先往下张嘴、又猛跳到顶" */
let glideId = 0;
function glideScrollBy(delta, ms){
  cancelAnimationFrame(glideId);
  if(!delta) return;
  const from = window.scrollY, t0 = performance.now();
  const ease = t => 1 - Math.pow(1 - t, 3);
  function step(now){
    const t = Math.min(1, (now - t0) / ms);
    window.scrollTo(0, from + delta * ease(t));
    if(t < 1) glideId = requestAnimationFrame(step);
  }
  glideId = requestAnimationFrame(step);
}

/* ================================================================
   一次性示能演示 —— 用户不识字,说明书写得再清楚也等于没写,
   所以把"能做什么"演一遍给他看。每种只演一次,记在 daka.coach。
   ⚠️ 三条铁律:减弱动效跳过;换课(lessonGen 变了)作废;
   用户一碰屏幕立刻收手并复原 —— 演示不能和真实操作抢画面。
   ================================================================ */
/* 第一张卡自动开合一次:"卡片是能点开的"这件事,展开一次比任何文字都清楚。
   ⚠️ 只动 class,不走 head.onclick —— 那条路会 SFX.pop() 出声、会滚动补位,
   等于页面自己假装被点了一下 */
function coachCard(){
  if(!CUR_ID || CUR_ID === "review") return;    // 预览课/复习课不演
  if(coachDone("card")) return;
  if(motionOff()){ markCoach("card"); return; }
  var first = document.querySelector("#learnList .lcard");
  if(!first) return;
  markCoach("card");
  var gen = lessonGen, t1 = 0, t2 = 0, over = false;
  function stop(){
    if(over) return;
    over = true;
    clearTimeout(t1); clearTimeout(t2);
    first.classList.remove("open");
    document.removeEventListener("pointerdown", stop, true);
  }
  document.addEventListener("pointerdown", stop, true);   // 捕获阶段:先于任何点击处理
  t1 = setTimeout(function(){
    if(over || gen !== lessonGen) return stop();
    // 演示期间孩子可能已经翻到别的页签了,那就别在背后偷偷展开
    var page = document.getElementById("pageLearn");
    if(!page || !page.classList.contains("on")) return stop();
    // ⚠️ 演示走的是 class 不是 onclick,内容延迟构建后这里也得自己建一次:
    // 空 dialog 展开高度为 0,"卡片能点开"这件事一点都演不出来
    ensureDialog(first);
    first.classList.add("open");
  }, 900);
  t2 = setTimeout(stop, 2300);
}
/* 长按查词的提示条:第一次真的展开了某张卡之后 2 秒浮一条,4 秒淡掉。
   这一条有字,是有意的 —— 长按没有任何视觉线索可演,只能告诉大人一次。 */
function coachPress(d){
  if(coachDone("press")) return;
  markCoach("press");
  var gen = lessonGen;
  setTimeout(function(){
    if(gen !== lessonGen) return;                          // 换课了
    if(!d.classList.contains("open")) return;              // 卡又被收起来了
    if(d.querySelector(".coach-tip")) return;
    var q = d.querySelector(".dialog-in .bubble.q");
    if(!q || !q.parentNode) return;
    var tip = document.createElement("div");
    tip.className = "coach-tip";
    tip.textContent = "按住单词可以看意思";
    // ⚠️ 插进 .dialog-in,不能直接插到 .dialog:那是 grid 容器,
    // 多出来的子元素不受行高约束,收起状态会露在外面
    q.parentNode.insertBefore(tip, q);
    var gone = false;
    function kill(){
      if(gone) return;
      gone = true;
      document.removeEventListener("pointerdown", kill, true);
      tip.classList.add("out");
      setTimeout(function(){
        if(tip.parentNode) tip.parentNode.removeChild(tip);
      }, durMs("--dur-base") + 50);
    }
    document.addEventListener("pointerdown", kill, true);
    setTimeout(kill, 4000);
  }, 2000);
}

/* 一张卡的对话内容 —— **不在 renderLearn 里建**,等第一次展开时才建。
   一课 20+ 张卡、每张两三问,首屏就把上百个气泡/图片全建出来,进课程要卡半秒,
   而孩子一次只看得见一张卡。这里只负责往空的 .dialog-in 里填内容,谁来调都一样。
   ⚠️ 内容一律往 din 里塞,不要直接 appendChild 到 dialog:
   dialog 是 grid 容器,行高从 0fr 过渡到 1fr,靠的就是"只有一个子元素、
   它自己 overflow:hidden + min-height:0"。往 dialog 直接加第二个子元素,
   多出来的那个不受行高约束,收起状态会露在外面 */
function buildDialog(c, din){
  // 只要有问答带了自己的单格图,就整张卡改成"一问一图"(和闯关的 qa.image||c.image 一致):
  // 图不再顶在最上面滚出屏幕,没有单格图的那几问回落到卡片图,就近显示
  const perQA = c.dialog.some(qa=>qa.image);
  if(c.image && !perQA){
    const img = document.createElement("img");
    img.className = "pic"; img.loading = "lazy";
    img.src = imgSrc(c.image); img.alt = c.word;
    din.appendChild(img);
  }else if(c.eq){
    // 没有配图的算式卡:把算式放大顶上,一眼看清在问什么
    const box = document.createElement("div");
    box.className = "eq-box";
    box.innerHTML = eqHTML(c.eq);
    din.appendChild(box);
  }
  if(c.phonics) din.appendChild(makePhonicsPanel(c));
  c.dialog.forEach(qa=>{
    const pic = perQA ? (qa.image || c.image) : null;
    if(pic){
      const img = document.createElement("img");
      img.className = "pic"; img.loading = "lazy"; img.src = imgSrc(pic);
      din.appendChild(img);
    }else if(perQA && /^[a-z]{2,6}$/i.test(qa.key[0] || "")){
      // 这一问没图、卡片也没图 —— 放字母,不要留空
      const box = document.createElement("div");
      box.className = "eq-box";
      box.innerHTML = letterTiles(qa.key[0]);
      din.appendChild(box);
    }
    din.appendChild(makeBubble("q", qa));
    din.appendChild(makeBubble("a", qa));
  });
}
/* 展开前必须先经过这里 —— 空 dialog 的展开高度是 0,动画等于没发生,
   afterExpand/revealCard 量到的也是空盒子。所有"要展开这张卡"的路径
   (head.onclick、coachCard 的自动演示)都得先调它。重复调无副作用。 */
function ensureDialog(d){
  const din = d.querySelector(".dialog-in");
  if(!din || din.__built) return;
  din.__built = true;
  buildDialog(d.__card, din);
}

function renderLearn(){
  const list = document.getElementById("learnList");
  list.innerHTML = "";
  let lastGroup = null;
  lesson.cards.forEach(c=>{
    if(c.phonics && c.phonics.group !== lastGroup){
      lastGroup = c.phonics.group;
      const group = document.createElement("div");
      group.className = "sound-group"; group.textContent = lastGroup;
      list.appendChild(group);
    }
    const d = document.createElement("div");
    d.className = "panel lcard";

    const head = document.createElement("div");
    head.className = "lhead";
    /* 卡片头是个挂了 onclick 的 <div> —— 鼠标和手指能用,键盘完全够不着,
       读屏也只念得出里面的字、说不出"这是能按的"。
       补 role/tabindex 让它进 Tab 序列并被念成按钮;真正的触发在下面的 keydown。
       ⚠️ 只改这一处。闯关/考一考的选项本来就是 <button>,不需要;
       给动态重建的内容乱加 tabindex 会让 Tab 顺序每换一题就变一次 */
    head.setAttribute("role", "button");
    head.setAttribute("tabindex", "0");
    head.innerHTML = `
      <span class="slot">${
        c.image ? `<img class="thumb" src="${imgSrc(c.image)}" alt="" loading="lazy">`
                : c.eq ? eqHTML(c.eq)
                : `<span class="emoji">${c.emoji||"⬜"}</span>`}</span>
      <div><div class="word">${c.word}</div><div class="cn">${c.cn||""}</div></div>
      ${tagHTML(c.tag)}
      ${revKeyOf(c) && askable(c).length
        ? `<button class="bookmark${inWrongBook(c) ? " on" : ""}"
                    aria-label="加入错题本" aria-pressed="${inWrongBook(c)}">
             <svg aria-hidden="true"><use href="#i-flag"/></svg></button>`
        : ``}
      <span class="chev" aria-hidden="true">›</span>`;
    // 小旗子:家长觉得不熟就标上,不用等答错。stopPropagation 两连 ——
    // 点它别顺手展开卡片,键盘上按它也别触发卡头的 Enter/空格展开
    const bk = head.querySelector(".bookmark");
    if(bk){
      bk.onclick = (e)=>{
        e.stopPropagation();
        const nowIn = toggleWrongBook(c);
        if(nowIn === null) return;
        bk.classList.toggle("on", nowIn);
        bk.setAttribute("aria-pressed", nowIn ? "true" : "false");
        SFX.tap();
        showToast(nowIn ? "已加入错题本 · 复习时会多练它" : "已移出错题本");
      };
      bk.addEventListener("keydown", e=>e.stopPropagation());
    }
    head.onclick = ()=>{
      const wasOpen = d.classList.contains("open");
      // 正在收起的那张(们):FLIP 的起态要用到它们的展开时 padding
      const prevOpen = [...document.querySelectorAll(".lcard.open")].filter(x=>x!==d);
      const anchor = head.getBoundingClientRect().top;
      // ⚠️ 必须在翻类之前建内容:空 dialog 的展开高度是 0,
      // 动画从 0fr 到 1fr 也还是 0,终态量到的同样是空盒子
      if(!wasOpen) ensureDialog(d);
      // 起态快照:收起卡当前(展开态)的 padding、要开的卡当前(收起态)的 padding
      const padOf = x => getComputedStyle(x.querySelector(".dialog-in")).padding;
      const openStartPad = wasOpen ? null : padOf(d);
      const closeStartPads = prevOpen.map(padOf);
      document.querySelectorAll(".lcard").forEach(x=>{
        x.classList.remove("open");
        // 收起别的卡时它们的 aria-expanded 也要跟着回 false,
        // 否则读屏里会同时有好几张"已展开"的卡
        const h = x.querySelector(".lhead");
        if(h) h.setAttribute("aria-expanded", "false");
      });
      stopAllSound();
      if(!wasOpen){
        d.classList.add("open");
        head.setAttribute("aria-expanded", "true");
        SFX.pop();                 // 只在"展开"这一下响,收起是安静的
      }
      const ms = durMs("--dur-slow");
      if(!wasOpen && ms > 0){
        /* FLIP:类已翻到终态。先关过渡瞬时跳到终态布局,量出滚动补位量
           (含上方卡收起抽走的高度 + 卡头顶到吸顶栏下的诉求),再退回起态、
           放开过渡 —— 展开/收起动画与 glideScrollBy 的滚动同时长、同步跑,
           整个过程是一个连续动作。以前是"展完再瞬移",实测看着就是
           先往下张嘴、又猛跳到顶,割裂(家长反馈)。 */
        const pairs = [d].concat(prevOpen).map(x=>({
          dd: x.querySelector(".dialog"), ii: x.querySelector(".dialog-in")
        }));
        pairs.forEach(p=>{ p.dd.style.transition = "none"; p.ii.style.transition = "none"; });
        void document.body.offsetHeight;                 // 终态布局
        const delta = revealDelta(d);
        // Invert:退回起态(px 值只用于 padding;行高必须用 0fr/1fr,fr 和 px 不互插)
        pairs[0].dd.style.gridTemplateRows = "0fr";
        pairs[0].ii.style.padding = openStartPad;
        prevOpen.forEach((x,i)=>{
          pairs[i+1].dd.style.gridTemplateRows = "1fr";
          pairs[i+1].ii.style.padding = closeStartPads[i];
        });
        void document.body.offsetHeight;                 // 起态布局落定
        // Play:放开过渡、清掉内联起态,类定义的终态接管 → 动画跑起来
        pairs.forEach(p=>{
          p.dd.style.transition = ""; p.ii.style.transition = "";
          p.dd.style.gridTemplateRows = ""; p.ii.style.padding = "";
        });
        glideScrollBy(delta, ms);
        afterExpand(dialog, ()=>revealCard(d));          // 终态兜底校正(懒图撑高等)
      }else{
        // 收起、或减弱动效(时长 0,一切瞬时):沿用老补位
        window.scrollBy(0, head.getBoundingClientRect().top - anchor);
        if(!wasOpen) afterExpand(dialog, ()=>revealCard(d));
      }
      // 第一次真的展开一张卡时,顺带把"长按能查词"演示给大人看一次
      if(!wasOpen) coachPress(d);
      // 学一学口径:展开的这张卡计入"今天听过几张"(见 noteLearnOpen)
      if(!wasOpen) noteLearnOpen(String(c.word || c.cn || ""));
    };
    head.setAttribute("aria-expanded", "false");
    /* 回车/空格 = 点一下。空格必须 preventDefault:它在可聚焦元素上的默认行为
       是往下滚一屏 —— 卡片刚展开页面就被翻走了,而展开的补位正是靠
       scrollBy 精确算出来的,两边一起动就全乱了 */
    head.addEventListener("keydown", e=>{
      // ⚠️ 只认按在卡片头**自己**身上的键。里面还嵌着一颗喇叭按钮,
      // 在它上面按回车会先触发它自己的 click(念单词)、再把 keydown 冒泡上来 ——
      // 不挡的话每念一次单词就顺手把卡片折起来(它的 stopPropagation 拦的是
      // click,拦不住 keydown)
      if(e.target !== head) return;
      if(e.key === "Enter" || e.key === " " || e.key === "Spacebar"){
        e.preventDefault();
        head.onclick();
      }
    });
    const wordPlay = document.createElement("button");
    wordPlay.className = "mini word-play";
    wordPlay.innerHTML = IC_SPEAKER;
    wordPlay.setAttribute("aria-label", "朗读这个词");
    wordPlay.onclick = e=>{
      e.stopPropagation();
      playWord(c.word.toLowerCase());
    };
    // 插在"右侧那一组"之前:大多数卡已经没有标签了,锚点退回角标
    // (querySelector 按文档顺序返回第一个命中,有标签时仍是标签)
    head.insertBefore(wordPlay, head.querySelector(".tag, .chev"));
    d.appendChild(head);

    // 空壳:只建 grid 容器和它唯一的子元素,内容留到首次展开(见 ensureDialog)
    const dialog = document.createElement("div");
    dialog.className = "dialog";
    const din = document.createElement("div");
    din.className = "dialog-in";
    dialog.appendChild(din);
    d.__card = c;                  // ensureDialog 要靠它知道该建哪张卡的内容
    d.appendChild(dialog);
    list.appendChild(d);
  });
  coachCard();          // 第一次进课程时把"卡片能点开"演一遍
}

/* ================================================================
   问答闯关:机器人读问题,孩子回答;答案气泡同样句句词词可点
   ================================================================ */
const pbox = document.getElementById("practiceBox");

/* 换题过渡:旧内容先滑出去,render() 换好新内容,再从另一侧滑回来。
   闯关和考一考都是"整个面板换一茬"—— innerHTML 直接替换看着就是画面闪一下,
   孩子分不清是翻到下一题了还是自己点错了什么。
   dir: 1 = 前进(向左滑出、从右滑入);其余 = 原地淡入。
   减弱动效(--dur-base 归 0)或 theme.css 没加载时直接 render(),退回原来的硬切。
   ⚠️ render 里带播音是有意的:音频本身就要加载,和这 240ms 是并行的,不耽误。
   ⚠️ 收尾一定要把内联样式清干净,残留的 transform 会给里面的 position:fixed
   元素造新的包含块,也会让后面量位置的逻辑量歪。*/
const SWAP_CSS = "transform var(--dur-base) var(--ease-out), " +
                 "opacity var(--dur-base) var(--ease-out)";
function swapIn(el, render, dir){
  var ms = durMs("--dur-base");
  if(!el || ms <= 0){ render(); return; }
  // 连点"下一题"会叠两次过渡:用代次号作废上一次挂起的 render,
  // 否则同一题会渲染两遍、音频重叠着播
  var gen = (el.__swapGen || 0) + 1;
  el.__swapGen = gen;
  var back = dir > 0 ? 40 : 0;                 // 从哪一侧回来
  el.style.transition = SWAP_CSS;
  el.style.transform = "translateX(" + (dir > 0 ? -40 : 0) + "px)";
  el.style.opacity = "0";
  setTimeout(function(){
    if(el.__swapGen !== gen) return;           // 期间又切了一次,这次作废
    render();
    el.style.transition = "none";              // 先无过渡就位
    el.style.transform = "translateX(" + back + "px)";
    el.style.opacity = "0";
    void el.offsetWidth;                       // 强制重排,否则两次赋值会被合并
    el.style.transition = SWAP_CSS;
    el.style.transform = "translateX(0)";
    el.style.opacity = "1";
    setTimeout(function(){
      if(el.__swapGen !== gen) return;
      el.style.transition = "";
      el.style.transform = "";
      el.style.opacity = "";
    }, ms + 60);
  }, ms);
}
/* 作废这个面板上挂着的换题过渡,并把内联样式清干净。
   换课时必须调:swapIn 的 render 是延时执行的,gotoLesson 已经把面板
   innerHTML 换成开始页了,旧的 render 才醒过来,把上一课的题写回去。
   而且中途换课时面板正停在 opacity:0 上,不清样式就是一整块空白。*/
function cancelSwap(el){
  if(!el) return;
  el.__swapGen = (el.__swapGen || 0) + 1;
  el.style.transition = "";
  el.style.transform = "";
  el.style.opacity = "";
}

/* 推进锁 —— 实测:对着「下一题 ➜」连点三下就跳三题。
   按钮在换题过渡的 240ms 里一直挂着 onclick,每一下都真的走一遍 nextQA,
   孩子想确认"我点到了没"多按两下,两问就这么没了(还看不见,因为
   swapIn 的代次号会把中间那次渲染丢掉 —— 题号却已经加过了)。
   考一考那边靠题内的 answered 哨兵挡住了(它同时管重复计分),
   闯关的「下一题」按钮没有对应的哨兵,所以在这里统一加一道。
   释放走定时器而不是 render 回调:结算页、开始页各有各的渲染路径,
   挂漏一条就永久卡死"下一题"。下限 260ms 是防连点本身要的 ——
   减弱动效时过渡时长是 0,不兜一个下限等于没锁。*/
let advancing = false;
function releaseAdvance(){ advancing = false; }
function lockAdvance(){
  if(advancing) return false;
  advancing = true;
  setTimeout(releaseAdvance, Math.max(durMs("--dur-base") + 80, 260));
  return true;
}

let pOrder = [], pc = 0, pq = 0;
/* 「这一栏正有一轮没做完」—— 横滑换课要据此收紧阈值,见文件底部的手势 */
let pActive = false, qActive = false;
/* 音标类答案的干扰项池:已教的 11 个字母音 + 已教的词族韵脚 */
const PHONEME_CHIPS = ["/s/","/t/","/m/","/a/","/n/","/o/","/f/","/i/","/r/","/b/","/d/"];
const RIME_CHIPS    = ["/an/","/at/","/ot/","/ad/","/id/","/it/"];
/* 同类干扰项池:问颜色就给颜色,问数字就给数字。
   只收 audio/words/ 里真有音频的词 —— 选项要能点读,没音频的词(blue/green/
   brown/purple、star/heart)宁可不用,也不能让孩子点了没声音。*/
const COLOR_CHIPS  = ["red","yellow","pink","black","white","orange","gray"];
const NUM_CHIPS    = ["zero","one","two","three","four","five","six","seven","eight","nine","ten"];
const LETTER_CHIPS = ["s","t","m","a","n","o","f","i","r","b","d"];
const SHAPE_CHIPS  = ["circle","square","triangle","rectangle"];

/* 这个 key 属于哪一类?返回同类词池;普通名词返回 null(改用同课的词做干扰项) */
function chipFamily(k){
  if(/^\/[a-z]+\/$/.test(k)) return k.length > 3 ? RIME_CHIPS : PHONEME_CHIPS;
  if(COLOR_CHIPS.includes(k))  return COLOR_CHIPS;
  if(NUM_CHIPS.includes(k))    return NUM_CHIPS;
  if(LETTER_CHIPS.includes(k)) return LETTER_CHIPS;
  if(SHAPE_CHIPS.includes(k))  return SHAPE_CHIPS;
  return null;
}

/* 选项的点读音频。普通词走 audio/words/(全局池,跨课复用);
   音标不在 words/ 里也不该在 —— 得走 audio/phonics/,且元音要按
   gen_audio.py 的 PHONEME_MAP 转(/a/→ae、/o/→aa、/i/→ih),
   直接按 words/ 拼路径会 404。*/
const PHONEME_MAP = {a:"ae", e:"eh", i:"ih", o:"aa", u:"ah", ks:"x", kw:"qu"};
function audioSlug(t){
  return t.toLowerCase().replace(/'/g,"-").replace(/[^a-z0-9-]+/g,"-")
          .replace(/^-+|-+$/g,"");
}
function chipAudio(k){
  const m = k.match(/^\/([a-z]+)\/$/);
  if(m) return "audio/phonics/" + (PHONEME_MAP[m[1]] || m[1]) + ".mp3";
  return (lesson.word_audio && lesson.word_audio[k]) || "audio/words/" + audioSlug(k) + ".mp3";
}
/* 依次朗读三个选项并高亮 —— 孩子还不认字,选项是纯文本等于让他认读,
   必须听得到才谈得上"选"。playSeq 自带 el 高亮和 404 回落 TTS。*/
function readChips(){
  const btns = [...document.querySelectorAll("#ansChips .ans-chip")];
  if(!btns.length) return;
  playSeq(btns.map(b=>({text: b.dataset.k, role: "w",
                        audio: chipAudio(b.dataset.k), el: b})));
}

/* 闯关只收「能出成三选一」的问。
   有些问天生做不成选择题:"What can chips show?" 的答案是「同样多」,而本课能抽到的
   干扰项只有数字 —— 出成 four / same / ten,而「chips can show four」本身就是对的,
   孩子选 four 会被判错。这类问在数据里标 "practice": false:
   学一学照常教、照常点读,只是不进闯关。
   (对照:卡级的 "quiz": false 挡的是考一考的「哪一个是 X」,两者管的不是一回事) */
function askable(c){ return (c.dialog || []).filter(t => t.practice !== false); }

function startPractice(){
  releaseAdvance();   // 结算页的「再来一轮」不该被上一题的推进锁挡住
  // 每轮最多 ROUND_MAX 问:整课 25 问对 K2 孩子太长,而打卡是天天来的 ——
  // 每次随机抽一轮,几天下来自然覆盖全课,还不重样。
  // 混合复习(ordered)例外:卡序出自调度器,同课已排开,别再洗回去
  const bag = lesson.ordered ? lesson.cards.slice()
                             : lesson.cards.slice().sort(()=>Math.random()-0.5);
  pOrder = []; let n = 0;
  for(const c of bag){
    const k = askable(c).length;
    if(!k) continue;                             // 整张卡的问都不进闯关
    if(pOrder.length && n + k > ROUND_MAX) continue;
    pOrder.push(c); n += k;
    if(n >= ROUND_MAX) break;
  }
  // 一张能出的卡都没有(错题本练空了,或临时课全是虚词卡)——
  // 别让 curCard() 摸空翻车,给一页像样的着陆
  if(!pOrder.length){ pbox.innerHTML = emptyRoundHTML(); return; }
  pc = 0; pq = 0; pBarPct = 0; pRetryN = 0;
  askQuestion();
}
/* 空着陆页。错题本的"空"不是缺失是成就,给庆祝不给灰色的"暂无数据"。
   课堂日的"空"则是真找不到(日期传歪了,或那批卡后来删了/挪了):
   说清楚 + 给回目录的出口,别让孩子对着灰页发呆 */
function emptyRoundHTML(){
  if(REVIEW_PICK === "wrong")
    return `<div class="done"><div class="big">🎉</div>错题本空啦！<br>错过的词都练熟了
         <div class="done-acts">
           <a class="big-btn" href="app.html?lesson=review">去混合复习</a>
           <a class="big-btn ghost" href="index.html">回目录</a>
         </div></div>`;
  if(REVIEW_PICK === "day")
    return `<div class="done"><div class="big">🤔</div>没找到这一天上课的卡片<br>内容可能后来调整过了
         <div class="done-acts">
           <a class="big-btn" href="index.html">回目录</a>
         </div></div>`;
  return `<div class="done"><div class="big">🤔</div>这一课没有可以出题的卡片</div>`;
}
function curCard(){ return pOrder[pc]; }
function curQA(){ return askable(curCard())[pq]; }
/* 本轮的问数 / 已完成问数 / 进度条百分比。
   恢复快照时也要用它把 pBarPct 预置成当前位置,否则 growBar 会从 0 涨过去,
   刷新回来第一眼是进度条"倒回起点再冲上来",看着像进度丢了 */
function pTotals(){
  var total = pOrder.reduce(function(s,x){ return s + askable(x).length; }, 0);
  var doneN = pOrder.slice(0, pc).reduce(function(s,x){ return s + askable(x).length; }, 0) + pq;
  return {total: total, doneN: doneN, pct: total ? doneN / total * 100 : 0};
}

let pRevealed = false;   // 当前题是否已展示过答案(防止重复追加气泡)
/* 这一题记过复习账没有。一题只记第一件事:首点即对记"对",点错或先看答案记"错"——
   错完再点对不算对,答对之后再看答案也不算错 */
let pScored = false;
let pBarPct = 0;         // 上一题进度条停在哪 —— 换题时要从这个值涨过去,见 growBar
let pRetryN = 0;         // 本轮回炉了几张,结算页要报,见 pRetryPush
/* 当轮回炉:复习里答错(或没答就看答案)的卡,当轮末尾补问一遍 ——
   一错就翻过去,孩子这一天等于没学会;当场闭环一次才有"最后我做对了"的收尾。
   只在混合复习里做:普通课一轮就那几张卡,重复太密反而像罚抄。
   浅克隆打上 _retry,它管住两件事:回炉卡不记账(见 revMark)、
   回炉卡自己再答错也不再回炉(否则一直答错就是无限队列)。
   调用点由 pScored 把关,所以一题最多回炉一张。
   ⚠️ 追加进 pOrder 会让 pTotals 的分母变大(10 → 11),这是诚实的:
   进度 k/T → (k+1)/(T+1) 在 k<T 时恒增,进度条不会倒缩,不用管 growBar。*/
function pRetryPush(c){
  if(CUR_ID !== "review" || !c || c._retry) return;
  pOrder.push(Object.assign({}, c, {_retry: true}));
  pRetryN++;
}
/* 出题分两层:askQuestion 只负责"带过渡地换过去",真正的渲染在 renderQuestion。
   startPractice 的第一题也走这里 —— 从开始页翻到第一题同样是一次换页 */
function askQuestion(){ swapIn(pbox, renderQuestion, 1); }
function renderQuestion(){
  pRevealed = false;
  pScored = false;
  pActive = true;
  const c = curCard(), qa = curQA();
  const tot = pTotals();
  const total = tot.total, doneN = tot.doneN;
  const pic = qa.image || c.image;
  // 词条出现在答案里就不显示,否则等于把答案写在题面上
  const leaks = qa.a.some(s => norm(s).includes(norm(c.word)));
  // 进度条走**已完成数**而不是当前题号:条子该在"翻到下一题"那一下往前长,
  // 用 doneN+1 的话第一题一进来就已经涨了一格,等于把没答的算成答了
  const barPct = tot.pct;
  pbox.innerHTML = `
    <div class="pbar"><i id="pBar" style="width:${barPct}%"></i></div>
    <div class="progress"><span class="bot" id="pBot" aria-hidden="true">${IC_ROBOT}</span>第 ${doneN+1} / ${total} 问</div>
    <div class="p-head">
      ${pic ? `<img class="pic mid" src="${imgSrc(pic)}" alt="" loading="lazy">`
            : c.eq ? `<div>${eqHTML(c.eq)}</div>`
            : `<div class="p-emoji">${c.emoji||"⬜"}</div>`}
      ${leaks ? "" : `<div class="p-word">${c.word}</div>`}
    </div>
    <div class="chat" id="pChat"></div>
    <div class="result-emoji" id="pResult"></div>
    <div class="p-hint">${IC_SPEAKER} 听完题目，大声说出答案，再点一点它</div>
    <div class="ans-chips" id="ansChips"></div>
    <div class="ctrl" id="pCtrl">
      <button class="btn" onclick="readChips()">${IC_SPEAKER} 听选项</button>
      <button class="btn" onclick="reveal(false)">${IC_EYE} 看答案</button>
    </div>`;
  growBar(document.getElementById("pBar"), pBarPct, barPct);
  pBarPct = barPct;
  const chat = document.getElementById("pChat");
  chat.appendChild(makeBubble("q", qa));
  // key 是关键词数组(如 ["bus","stop"]),拼起来才是完整答案
  const correct = qa.key.join(" ");
  // 干扰项和正确答案同类:问音给音、问颜色给颜色、问数字给数字。
  // 混类(red / astronaut / catch)等于送分 —— 孩子不用听懂,
  // 只要看出"另外两个明显不是一类"就能排除掉。
  // 普通名词从**整课**的词里抽:pOrder 只是本轮抽中的 ROUND_MAX 问,
  // 用它当选项来源会让某些轮次同类候选不足。
  // 不用 flatMap(ES2019,iOS 12 以下没有,会抛错让整个闯关白屏)
  const plain = [...new Set(
    lesson.cards.reduce((acc, c)=>acc.concat(askable(c).map(d=>d.key.join(" "))), [])
  )].filter(k=>!chipFamily(k));
  let cands = (chipFamily(correct) || plain).filter(k=>k!==correct);
  if(cands.length < 2)   // 同类词不够(整课就这么几个)才放宽,保证始终三个选项
    cands = [...new Set([...cands, ...plain, ...NUM_CHIPS])].filter(k=>k!==correct);
  const pool = shuffle(cands).slice(0, 2);
  const chipsBox = document.getElementById("ansChips");
  // 和考一考同款的 answered 哨兵:disabled 挡得住绝大多数,但触摸端在
  // disabled 生效之前就已经排进队列的那一下照样会进来 —— 没有哨兵就是
  // 两次 SFX.star + 两次 flyStar(星 +4)+ 两遍夸奖叠着播,出口按钮也画两回
  let answered = false;
  shuffle([correct, ...pool]).forEach(k=>{
    const b = document.createElement("button");
    b.className = "ans-chip";
    b.textContent = k;
    b.dataset.k = k;
    b.onclick = ()=>{
      if(answered) return;
      /* 一点即判。曾试过两段式(第一下听音、再点同一个才判分,防不识字盲选),
         家长反馈没这个必要 —— 孩子认识简单词、有大人陪,多一道确认反而烦。
         要听选项音仍有「听选项」按钮。 */
      stopAllSound();          // 打断正在念的选项,别和判分音重叠
      chipsBox.querySelectorAll(".speaking").forEach(x=>x.classList.remove("speaking"));
      if(k === correct){
        answered = true;
        if(!pScored){ pScored = true; revMark(c, true); }
        b.classList.add("right");
        chipsBox.querySelectorAll(".ans-chip").forEach(x=>x.disabled=true);
        document.getElementById("pResult").textContent = "🎉";
        SFX.star();
        if(navigator.vibrate) navigator.vibrate(15);   // 安卓有震感,iOS 直接忽略
        burst(b);                 // 彩带在选项原地炸开
        botHappy();               // 提问的那个机器人也跟着跳一下
        // 星星飞进罐子,数字落袋才加(不再直接 addStars)。
        // 回炉题只给 1 颗:答对了得有安慰,但同一张卡不该靠错一次多挣一份分
        flyStar(b, c._retry ? 1 : 2);
        // 答对就停在这儿:绿色选项留在屏幕上,出口(下一题 / 看答案)自己选。
        // 以前会在 2.6 秒后自动翻到答案页 —— 孩子正要点下一题,画面自己跳走了
        showNext(true);
        praise(randPraise());
      }else{
        if(!pScored){ pScored = true; revMark(c, false); pRetryPush(c); }
        b.classList.add("wrong");
        document.getElementById("pResult").textContent = "🤔";
        SFX.wrong();
        praise("Try again!");
        setTimeout(()=>b.classList.remove("wrong"), 600);
      }
    };
    chipsBox.appendChild(b);
  });
  // 题目自动播。孩子还不认字,题面对他就是一串图形 —— 不出声就没法答,
  // 每题都得先按一下按钮纯属多一道手续(考一考也是渲染完直接 ask())。
  // 选项仍然手动(「听选项」按钮):认得的词他会伸手就点,自动念选项会变成边选边播。
  // 要重听题目,点问题气泡或气泡里的喇叭钮即可,和以前那个按钮效果一样。
  playQuestion();
  savePracticeRound();
}

/* 把这一轮的位置写进快照。存卡在 lesson.cards 里的下标 —— 找不到下标
   (review 课临时拼的卡就是这样)整轮不存,免得存一份恢复不了的 */
function savePracticeRound(){
  if(!roundSnapshotOK()) return;
  var cards = [], i, at;
  for(i = 0; i < pOrder.length; i++){
    at = lesson.cards.indexOf(pOrder[i]);
    if(at < 0) return;
    cards.push(at);
  }
  saveRound("practice", {cards: cards, pc: pc, pq: pq});
}
/* 按下标把 pOrder 拼回来。任何一张卡对不上(课程数据改过了、
   换的是别的课)就返回 null,调用方丢弃整份快照 */
function restorePOrder(idxs){
  if(!(idxs instanceof Array) || !idxs.length) return null;
  var out = [], i, c;
  for(i = 0; i < idxs.length; i++){
    c = (lesson.cards || [])[idxs[i]];
    if(!c || !askable(c).length) return null;
    out.push(c);
  }
  return out;
}

/* 念题目:自动播和重听走同一条路,高亮的是问题气泡里的句子 */
function playQuestion(){
  const qa = curQA();
  playOne(qa.q, "q", qa.q_audio, null,
          document.querySelector("#pChat .bubble.q .stext"));
}

/* 答完这题的出口。「看答案」只在还没翻答案时给,翻过就只剩下一题 */
function showNext(gotStar){
  // visibility 而不是 display:hint 行(~34px)被抽走会让整页突然变短,
  // 选项和按钮往上一跳(实测点名);留着占位,只是看不见
  document.querySelectorAll(".p-hint").forEach(x=>x.style.visibility="hidden");
  document.getElementById("pCtrl").innerHTML = `
    ${gotStar ? '' : '<button class="btn" onclick="selfStar(this)">我会读了 ' + IC_STAR + '</button>'}
    ${pRevealed ? '' : `<button class="btn" onclick="reveal(${gotStar})">${IC_EYE} 看答案</button>`}
    <button class="btn go" onclick="nextQA()">下一题 ➜</button>`;
}
function reveal(gotStar){
  if(pRevealed) return;
  pRevealed = true;
  // 没答就直接看答案 = 不会,复习账记"错"(答对后再看答案时 pScored 已置,不会重记)
  if(!pScored){ pScored = true; revMark(curCard(), false); pRetryPush(curCard()); }
  const qa = curQA();
  const ch = document.getElementById("ansChips");
  if(ch) ch.style.display = "none";
  document.getElementById("pChat").appendChild(makeBubble("a", qa));
  showNext(gotStar);
  playSeq(qa.a.map((s,i)=>({text:s, role:"a", audio:(qa.a_audio||[])[i]})));
}
function selfStar(btn){
  SFX.star();
  flyStar(btn, 1);
  btn.disabled = true; btn.innerHTML = IC_STAR + " +1";
}

function nextQA(){
  if(!lockAdvance()) return;     // 连点三下只算一下,见 lockAdvance
  stopAllSound();
  pq++;
  if(pq >= askable(curCard()).length){ pq = 0; pc++; }
  if(pc >= pOrder.length){ return finishPractice(); }
  SFX.flip();                    // 翻页音只在真的还有下一题时响,收尾走 win
  askQuestion();
}
/* 结算页共用的两块:成绩(本课 / 总共 / 连续天数)+ 三个出口。
   连续天数 N=1 不显示 —— 天天来的孩子每天都是 1,那不叫成就 */
function doneStatHTML(){
  var h = `<div class="done-stat">本课 ${IC_STAR} × ${stars} · 总共 ${IC_STAR} × ${doneStat.total}</div>`;
  if(doneStat.streak >= 2) h += `<div class="done-streak">${IC_FLAME} 连续打卡 ${doneStat.streak} 天</div>`;
  return h;
}
/* 复习专属的一行:这一轮碰了几个词、其中几个回炉过。
   报的是**卡**数不是问数 —— 复习每张卡只有一问,对家长来说"复习了 10 个词"
   比"做了 11 问"直白。回炉 0 就不提,免得没错的那天也惦记着"回炉"俩字。*/
function reviewDoneStatHTML(){
  if(CUR_ID !== "review") return "";
  var n = pOrder.length - pRetryN;
  return `<div class="done-stat">复习 ${n} 词` +
         (pRetryN ? ` · 回炉 ${pRetryN} 词` : ``) + `</div>`;
}
/* 三个出口只该有**一个**主按钮:原来「再来一轮」和「下一课」都是绿色,
   一页两个同样重的绿胶囊,等于没给建议。做完一课的默认下一步是往前走,
   所以主按钮是「下一课」,「再来一轮」降成白底描边(min-height/min-width 由
   .done-acts .big-btn 管,降级不影响热区)。
   ⚠️ 没有下一课时(最后一课 / 混合复习 / index.json 没取到)「再来一轮」就是
   唯一的前进动作,得升回绿色 —— 否则整页一个绿点都没有,看不出该点哪 */
function doneActsHTML(again){
  const hasNext = LESSON_AT >= 0 && LESSON_AT + 1 < LESSON_ORDER.length;
  return `<div class="done-acts">` +
    `<button class="big-btn${hasNext ? " ghost" : ""}" onclick="${again}">再来一轮</button>` +
    (hasNext ? `<button class="big-btn" onclick="gotoLesson(1)">下一课 ➜</button>` : ``) +
    `<a class="big-btn ghost" href="index.html">回目录</a>` +
    `</div>`;
}

/* 复习的「再来一轮」= 重新调度一次,不是把刚才那 10 张再考一遍:
   上一轮的账已经记了 —— 答对的升盒退场、答错的降盒还在高频区 ——
   重抽自然以错题和新卡为主,多轮递进是调度器白送的性质。
   只换 lesson 和学一学的卡列表,不走 applyLesson:它会把星罐清回 0(review
   的星罐是"这次进来攒了多少",孩子看着清零会以为白玩了)。
   重抽失败(断网)就拿现有这批再来,别让按钮点了没反应。 */
async function reviewAgain(){
  try{
    lesson = await buildReviewLesson(REVIEW_PICK);
    renderLearn();
  }catch(e){}
  startPractice();   // 错题本这轮练空了也没关系:空卡池守卫会给庆祝页
}

function finishPractice(){
  flushStars();                  // 半空中的星星先落袋,否则结算页的「星 × N」少算刚挣的
  doneStat = recordFinish();     // 记打卡日/完成轮数,必须排在 flushStars 后面
  markTabDone("practice");
  clearRound("practice");        // 这一轮做完了,没什么可恢复的了
  swapIn(pbox, renderPracticeDone, 1);
}
function renderPracticeDone(){
  pActive = false;               // 结算页不算"进行中":横滑阈值恢复常态
  pbox.innerHTML = `
    <div class="done">
      <div class="big">${bigArt("ui-trophy.webp", "🏆")}</div>
      问答闯关完成！
      ${doneStatHTML()}
      ${reviewDoneStatHTML()}
      ${doneActsHTML(CUR_ID === "review" ? "reviewAgain()" : "startPractice()")}
    </div>`;
  celebrate(pbox, function(){
    playOne("You did it! Amazing!", "q",
            lesson.praise_audio ? lesson.praise_audio["You did it! Amazing!"] : null);
  });
}

/* ================================================================
   考一考:听音选图
   ================================================================ */
let quizOrder = [], qi = 0;
const qbox = document.getElementById("quizBox");
function shuffle(a){return a.slice().sort(()=>Math.random()-0.5);}
function startQuiz(){
  releaseAdvance();   // 同 startPractice:「再来一轮」不该被推进锁挡住
  // 一张图一轮只考一次:同一张图的 word 题和 sent 题不在同一轮里重复出现,
  // 每轮随机挑到哪一种,几天下来两种问法都会碰上
  const seen = new Set();
  quizOrder = shuffle(quizItems())
    .filter(it => !seen.has(it.pic) && seen.add(it.pic))
    .slice(0, ROUND_MAX);
  qi = 0; qBarPct = 0; nextQuestion();
}
let qBarPct = 0;   // 同 pBarPct:上一题进度条的宽度,换题时从它涨过去
/* 考一考也给复习账本记账(P3 并账):同一张卡从两种题型积累证据 ——
   闯关考"听问题说答案",这里考"听整句认画面",两个角度都对才算真掌握。
   规则和闯关一字不差:每题只记第一件事(qScored 把关),首点即对记对、
   点错记错;revMark 自带的门都还在 —— 只在混合复习/错题本里记
   (普通课的卡没有 _src),一天一笔,回炉卡不记。 */
let qScored = false;
function nextQuestion(){
  if(!lockAdvance()) return;     // 同 nextQA:重复调用只算一次
  // 收尾判断放在过渡外面:要么翻到下一题,要么翻到结算页,两条路各自带自己的过渡
  if(qi >= quizOrder.length){ return finishQuiz(); }
  SFX.flip();
  swapIn(qbox, renderQuizQuestion, 1);
}
function renderQuizQuestion(){
  qActive = true;
  qScored = false;
  const it = quizOrder[qi], c = it.c;
  // 干扰项不能和正解同词:-an 课里 man/fan/tan 各有两张卡两张图(词族卡一张、
  // 生活场景卡一张),另一张混进选项就成了"两个都对",孩子点中它反而算错
  const pool = quizPics().filter(x => x.pic !== it.pic && norm(x.c.word) !== norm(c.word));
  const nOpt = Math.min(3, pool.length + 1);
  const opts = shuffle([it, ...shuffle(pool).slice(0, nOpt-1)]);
  const sent = it.kind === "sent";
  // 已答对的题数就是 qi(答对才 qi++),正好是"已完成"的口径
  const barPct = quizOrder.length ? qi / quizOrder.length * 100 : 0;
  qbox.innerHTML = `
    <div class="pbar"><i id="qBar" style="width:${barPct}%"></i></div>
    <div class="progress">第 ${qi+1} / ${quizOrder.length} 题</div>
    <div class="q-prompt">${sent ? "听一听，说的是哪一张？" : "哪一个是……"}</div>
    ${sent ? `<div class="q-sent">${it.qa.a[it.ai]}</div>`
           : `<div class="q-word">${c.word}</div>`}
    <button class="speak-btn" id="qSpeak" aria-label="再听一遍">${IC_SPEAKER}</button>
    <div class="opts ${nOpt===2?'two':''}">
      ${opts.map(o=>o.image
        ? `<button class="opt haspic" data-p="${o.pic}" aria-label="${o.c.word}"><img src="${imgSrc(o.image)}" alt="${o.c.word}" loading="lazy"></button>`
        : `<button class="opt" data-p="${o.pic}" aria-label="${o.c.word}">${o.eq ? eqHTML(o.eq) : (o.emoji||"⬜")}</button>`
      ).join("")}
    </div>`;
  growBar(document.getElementById("qBar"), qBarPct, barPct);
  qBarPct = barPct;
  const ask = sent
    ? ()=>playOne(it.qa.a[it.ai], "a", it.qa.a_audio[it.ai])
    : ()=>playOne("Which one is " + c.word + "?", "q", c.quiz_audio);
  document.getElementById("qSpeak").onclick = ask;
  ask();
  // 答对后要定格 1.8 秒再翻页(换题多了 0.24s 滑出滑入,定格从 1.4 延到 1.8,
  // 让"变绿 → 停一下 → 滑走"三段各自看得清),这 1.8 秒里选项还挂着 onclick:
  // 对着已经变绿的那颗连点 3 下 → qi 跳 3 题、多得 2 星、挂 3 个 nextQuestion 定时器;
  // 点旁边的错图 → 照样标红 shake 加一句 "Try again!",孩子明明答对了却挨批。
  // 两道保险:disabled 挡住绝大多数;answered 哨兵兜住触摸端 disabled 生效前
  // 就已经排队的那一下(以及 disabled 前已进入队列的合成事件)。
  let answered = false;
  const optBtns = qbox.querySelectorAll(".opt");
  optBtns.forEach(b=>{
    b.onclick = ()=>{
      if(answered) return;
      if(b.dataset.p === it.pic){
        answered = true;
        if(!qScored){ qScored = true; revMark(c, true); }
        optBtns.forEach(x=>{ x.disabled = true; });
        b.classList.add("right");
        SFX.star();
        if(navigator.vibrate) navigator.vibrate(15);   // 安卓有震感,iOS 直接忽略
        burst(b);                 // 彩带在选中那张图上原地炸开
        flyStar(b, 1);            // 星星飞进罐子,落袋才 +1(不再直接 addStars)
        qi++;
        praise(randPraise());
        // 这 1.8 秒里可能被横滑换掉课:对不上课程代号的定时器直接作废,
        // 否则旧课的题会渲染进新课的面板
        var gen = lessonGen;
        setTimeout(function(){
          if(gen !== lessonGen) return;
          nextQuestion();
        }, 1800);
      }else{
        if(!qScored){ qScored = true; revMark(c, false); }
        b.classList.add("wrong");
        SFX.wrong();
        praise("Try again!");
        setTimeout(()=>b.classList.remove("wrong"), 600);
      }
    };
  });
  saveQuizRound();
}

/* 考一考的快照:每道题记「卡下标 + 题型 + 问在 dialog 里的下标 + 图」。
   ai(答句选第几条)不存 —— 它是 quizItems() 按固定规则算出来的,
   恢复时重算一遍就是同一个值,存了反而多一处会对不上的地方 */
function saveQuizRound(){
  if(!roundSnapshotOK()) return;
  var items = [], i, it, ci, di;
  for(i = 0; i < quizOrder.length; i++){
    it = quizOrder[i];
    ci = lesson.cards.indexOf(it.c);
    if(ci < 0) return;
    di = it.kind === "sent" ? (it.c.dialog || []).indexOf(it.qa) : -1;
    if(it.kind === "sent" && di < 0) return;
    items.push({ci: ci, kind: it.kind, qaIdx: di, pic: it.pic});
  }
  saveRound("quiz", {items: items, qi: qi});
}
/* 按下标把 quizOrder 拼回来。不自己拼题目对象,而是重跑 quizItems()
   再从里面挑 —— 题目对象怎么组装(pic 取 image 还是 emoji、单问卡的
   答句能不能借用卡片图)那套规则只该有一份,抄第二份迟早两边走偏。
   pic 顺带当校验:对不上说明课程数据变了,整份快照作废 */
function restoreQuizOrder(items){
  if(!(items instanceof Array) || !items.length) return null;
  var all = quizItems(), out = [], i, j, want, card, hit;
  for(i = 0; i < items.length; i++){
    want = items[i];
    card = (lesson.cards || [])[want.ci];
    if(!card) return null;
    hit = null;
    for(j = 0; j < all.length; j++){
      if(all[j].c !== card || all[j].kind !== want.kind) continue;
      if(want.kind === "sent" && all[j].qa !== (card.dialog || [])[want.qaIdx]) continue;
      hit = all[j];
      break;
    }
    if(!hit || hit.pic !== want.pic) return null;
    out.push(hit);
  }
  return out;
}

function finishQuiz(){
  flushStars();                  // 同 finishPractice:半空中的星星先落袋再结算
  doneStat = recordFinish();
  markTabDone("quiz");
  clearRound("quiz");
  swapIn(qbox, renderQuizDone, 1);
}
function renderQuizDone(){
  qActive = false;
  qbox.innerHTML = `
    <div class="done">
      <div class="big">${bigArt("ui-party.webp", "🎉")}</div>
      今日打卡完成！
      ${doneStatHTML()}
      ${doneActsHTML("startQuiz()")}
    </div>`;
  celebrate(qbox, function(){ praise("You did it! See you tomorrow!"); });
}

/* ================================================================
   页面切换 & 启动
   ================================================================ */
/* 三个页签在顶栏是并排的一条,切换时给新页面一个方向感:
   往右边的页签走 → 新页面从右边滑进来;往左走 → 从左边。
   首次载入不放动画 —— 「学一学」在 HTML 里就带着 .on,init 根本不调 showPage,
   所以 lastPageAt 直接从 0(学一学)起步,第一次点页签就有方向。
   noAnim 给换课/前进后退用:它们本身已经有整页滑动,再叠一层会打架 */
/* 页签按钮走这里,不直接绑 showPage。showPage 还被 gotoLesson / popstate /
   init 调用 —— 那些是被动切页,响一声"点击"就成了页面自己在响。
   音效只挂在真的按下页签的这条路上。*/
function tapPage(p){
  SFX.tap();
  // 孩子亲手切走 = 明说"这轮先不玩了":弃掉那个模式的快照,下次进课不再往回拽。
  // 只清快照不动内存 —— 本次访问里切回去,题还停在原处;接着答,下一题会重新存上。
  // 只在 tapPage 清:showPage 还被 gotoLesson/popstate/恢复调用,那些不是孩子的表态
  var cur = ["learn","practice","quiz"][lastPageAt];
  if(cur !== p){
    if(cur === "practice" && pActive) clearRound("practice");
    if(cur === "quiz" && qActive) clearRound("quiz");
  }
  showPage(p);
}
const PAGE_AT = {learn:0, practice:1, quiz:2};
let lastPageAt = 0, pageAnimTimer = 0;
function showPage(p, noAnim){
  ["learn","practice","quiz"].forEach(x=>{
    const cap = x[0].toUpperCase() + x.slice(1);
    document.getElementById("page"+cap).classList.toggle("on", p===x);
    const tb = document.getElementById("tab"+cap);
    tb.classList.toggle("on", p===x);
    // 「哪个页签是选中的」目前只靠黄底表示,读屏和高对比度模式下等于没有。
    // showPage 是所有切页路径的必经之地(点页签 / 换课 / 前进后退),
    // 同步写在这里就不会漏
    tb.setAttribute("aria-pressed", p===x ? "true" : "false");
  });
  const at = PAGE_AT[p];
  const ms = durMs("--dur-base");
  if(!noAnim && at !== undefined && at !== lastPageAt && ms > 0){
    const el = document.getElementById("page"+p[0].toUpperCase()+p.slice(1));
    if(pageAnimTimer) clearTimeout(pageAnimTimer);
    // 三个页面一起清:上一次的动画类可能还挂在别的页面上
    document.querySelectorAll(".page").forEach(x=>x.classList.remove("page-in-r","page-in-l"));
    void el.offsetWidth;                       // 强制重排,否则连点同一路径不会重放
    el.classList.add(at > lastPageAt ? "page-in-r" : "page-in-l");
    pageAnimTimer = setTimeout(()=>{
      el.classList.remove("page-in-r","page-in-l");
      pageAnimTimer = 0;
    }, ms + 80);
  }
  if(at !== undefined) lastPageAt = at;
  stopAllSound();
}

/* ================================================================
   上一课 / 下一课:顶栏按钮 + 整页左右滑
   ================================================================ */
let LESSON_ORDER = [], LESSON_AT = -1;
let swX = 0, swY = 0, swDx = 0, swOn = false;

const PRACTICE_HOME = `
  <div class="done">
    <div class="big">${bigArt("ui-mic.webp", "🎤")}</div>
    机器人提问，大声说出答案，<br>再从选项里点出它！<br>
    <span style="font-size:14px;color:#5E6E8C;font-weight:600">
      点对了得 ${IC_STAR}${IC_STAR}，看答案跟读得 ${IC_STAR}
    </span>
    <br><button class="big-btn" onclick="startPractice()">开 始</button>
  </div>`;
const QUIZ_HOME = `
  <div class="done"><div class="big">${bigArt("ui-target.webp", "🎯")}</div>听一听、选一选！
  <br><button class="big-btn" onclick="startQuiz()">开 始</button></div>`;

/* 页签完成态角标:本次会话里跑完一轮就在页签后面打个 ✓。
   只做会话内的勾,不读历史 done —— 历史勾会天天都亮着,反倒看不出"今天做了没" */
let tabDone = {practice:false, quiz:false};
/* 页签文案里带图标,所以只能走 innerHTML —— 里面全是本文件的字符串常量,无注入风险。
   ⚠️ 和 <body> 里那三个 <button class="tab"> 的初始内容是同一套,改一处要改两处 */
const TAB_TEXT = {practice: IC_MIC + " 问答闯关", quiz: IC_TARGET + " 考一考"};
function paintTabDone(){
  ["practice","quiz"].forEach(k => {
    const el = document.getElementById("tab" + k[0].toUpperCase() + k.slice(1));
    if(el) el.innerHTML = TAB_TEXT[k] + (tabDone[k] ? " ✓" : "");
  });
}
function markTabDone(k){ tabDone[k] = true; paintTabDone(); }

/* ================================================================
   音频预取 —— 进课后趁空闲把这一课的 mp3 拉进 HTTP 缓存。
   打卡是"进来就点、点了就要出声",第一次点每句都要等一次网络往返;
   平板挂在家里 Wi-Fi 边缘时这一等就是两三秒,孩子早戳第二下了。
   ⚠️ 不改播放路径:playSeq 照样每次 new Audio,靠的是浏览器 HTTP 缓存,
   预取只负责把缓存捂热。所以这些 Audio 对象用完即弃,不必存起来。
   ⚠️ 必须限流。一课几十条音频同时开请求会把带宽占满,孩子刚点的那一句
   反而排在队尾 —— 本来是想让它快的。每 300ms 放 4 个。
   ⚠️ 换课(lessonGen 变了)立刻停:上一课剩下的队列继续排,就是在跟新课抢带宽。
   ================================================================ */
function prefetchAudio(){
  var gen = lessonGen;
  var seen = {}, list = [];
  function add(p){
    if(typeof p === "string" && p && !seen[p]){ seen[p] = 1; list.push(p); }
  }
  function addAll(v){
    if(typeof v === "string") add(v);
    else if(v && typeof v.length === "number"){ for(var i = 0; i < v.length; i++) add(v[i]); }
  }
  (lesson.cards || []).forEach(function(c){
    (c.dialog || []).forEach(function(qa){ addAll(qa.q_audio); addAll(qa.a_audio); });
  });
  [lesson.word_audio, lesson.praise_audio].forEach(function(m){
    if(!m) return;
    Object.keys(m).forEach(function(k){ add(m[k]); });
  });
  if(!list.length) return;
  var at = 0;
  function batch(){
    if(gen !== lessonGen) return;               // 换课了,剩下的不排了
    for(var n = 0; n < 4 && at < list.length; n++){
      /* ⚠️ 用 fetch 不用 new Audio():媒体元素哪怕只是 preload 也会触碰
         系统音频栈,蓝牙音箱/耳机上每一批都"戳"一下解码通道 —— 进课后
         听得到一串跟着 300ms 节拍的轻微"嗯嗒"声(实测点名,节奏和这里的
         批处理完全对上)。fetch 只走网络层,同样把文件暖进 HTTP 缓存
         (开着 SW 时还会顺手落进 CacheStorage,离线直接受益),不碰声卡。 */
      try{
        fetch(LESSON_BASE + list[at++], {credentials:"same-origin"}).catch(function(){});
      }catch(e){}
    }
    if(at < list.length) setTimeout(batch, 300);
  }
  // 空闲时才开工:进课程那一下要先把界面画出来,预取抢在渲染前面就本末倒置了
  if(typeof requestIdleCallback === "function") requestIdleCallback(batch, {timeout:2000});
  else setTimeout(batch, 800);
}

/* 把课程内容装载到界面上 —— 首次进入和换课都走这里 */
function applyLesson(){
  lessonGen++;                   // 上一课挂着的延时回调从这一刻起全部作废
  cancelSwap(document.getElementById("practiceBox"));
  cancelSwap(document.getElementById("quizBox"));
  hideToast();                   // 上一次换课的「撤销」已经指不回来了
  pActive = qActive = false;
  releaseAdvance();
  loadLessonProgress();          // 星罐换成这一课的累计星数 + 记下"最近学的课"
  tabDone = {practice:false, quiz:false};   // 换课要清勾,不然新课一进来就是做完的
  paintTabDone();
  document.getElementById("lessonTitle").textContent = lesson.title;
  // 提示行以图标为主、尽量短:整行字对孩子是看不懂的,长了连家长也不读。
  // 图标要和句子行上的两个圆钮对得上(喇叭=听、眼睛=翻译),那边换了这边就得跟着换。
  // 走 innerHTML 是因为要塞图标;拼进去的全是本文件的常量,无注入风险
  // 前 2 次之后这一行已经被 init 从 DOM 里摘掉了(见那儿的注释),所以要判空
  const hint = document.getElementById("learnHint");
  if(hint) hint.innerHTML = lesson.audio_mode === "word"
    ? IC_SPEAKER + " 点词听词 · 按住看意思"
    : lesson.cards.some(c => c.phonics)
      ? IC_SPEAKER + " 点字母听纯音 · 跟读3个音 · 再读整词"
      : IC_SPEAKER + " 点句听句 · 点词听词 · 按住看意思 · " + IC_EYE + " 翻译";

  document.getElementById("practiceBox").innerHTML = PRACTICE_HOME;
  // 可选的图不足两张就没法出选择题,隐藏这一栏而不是出坏题
  const enough = quizPics().length >= 2;
  document.getElementById("tabQuiz").style.display = enough ? "" : "none";
  document.getElementById("quizBox").innerHTML = enough ? QUIZ_HOME :
    `<div class="done"><div class="big">${bigArt("ui-target.webp", "🎯")}</div>` +
    `这一课的卡片是整版拼图，没法做听音选卡。<br>去「学一学」和「问答闯关」吧！</div>`;

  wireLessonNav();
  renderLearn();
  restoreRound();                // 刚才那一轮要是还没做完,接着做,别从头来
  prefetchAudio();               // 界面都摆好了,再趁空闲把这一课的音频捂热
}

/* 快照恢复。放在两个面板被重置成开始页之后 —— 先还原成干净的开始页,
   有快照再盖回去,没快照/对不上就是原来的样子。
   ⚠️ 只恢复 mode 那一栏并翻到对应页签,另一栏留在开始页:两栏都渲染
   意味着两段题目音频同时开播。mode 每渲染一题就更新一次,
   所以它就是"孩子最后在做的那一栏"。
   ⚠️ 走 showPage 不走 tapPage:这是页面自己在恢复,不是孩子按了页签,
   响一声"咔哒"等于页面在无中生有地报点击。而且 showPage 收尾会
   stopAllSound(),必须排在渲染(带自动播题)前面,否则题目音刚起就被掐掉。*/
function restoreRound(){
  if(!roundSnapshotOK()) return;
  var s = roundLoad();
  if(!s) return;
  // 30 分钟没回来就不算"手滑",过期整份清掉(哪节课的都一样),
  // 别让陈年半轮一直劫持进课落地页。没有 at 的是旧版快照,一并按过期算
  if(!(typeof s.at === "number" && Date.now() - s.at < 30 * 60 * 1000))
    return roundWrite(null);
  if(s.lesson !== CUR_ID) return;
  if(s.mode === "practice" && s.practice) return resumePractice(s.practice);
  if(s.mode === "quiz" && s.quiz && document.getElementById("tabQuiz").style.display !== "none")
    return resumeQuiz(s.quiz);
}
function resumePractice(d){
  var order = restorePOrder(d.cards);
  if(!order) return clearRound("practice");
  var at = d.pc, sub = d.pq;
  if(!(at >= 0 && at < order.length)) return clearRound("practice");
  if(!(sub >= 0 && sub < askable(order[at]).length)) return clearRound("practice");
  pOrder = order; pc = at; pq = sub;
  pBarPct = pTotals().pct;       // 预置成当前位置,进度条才不会从 0 闪着涨上来
  showPage("practice", true);
  renderQuestion();
}
function resumeQuiz(d){
  var order = restoreQuizOrder(d.items);
  if(!order) return clearRound("quiz");
  var at = d.qi;
  if(!(at >= 0 && at < order.length)) return clearRound("quiz");
  quizOrder = order; qi = at;
  qBarPct = order.length ? at / order.length * 100 : 0;
  showPage("quiz", true);
  renderQuizQuestion();
}

function wireLessonNav(){
  [[-1, "prevLesson", "上一课"], [1, "nextLesson", "下一课"]].forEach(([d, elId, label]) => {
    const btn = document.getElementById(elId);
    const target = LESSON_AT >= 0 ? LESSON_ORDER[LESSON_AT + d] : null;
    btn.disabled = !target;
    btn.title = target ? `${label}：${target.title}` : "";
    btn.onclick = target ? () => gotoLesson(d) : null;
  });
}

/* ================================================================
   提示条 —— 全局唯一一条,新的顶掉旧的(两条叠着出现只会互相盖住,
   而且撤销按钮会指向哪一次换课根本说不清)。
   2.5 秒自动淡出;时长/缓动全在 CSS 里走 token,减弱动效自动变瞬时。
   ================================================================ */
let toastTimer = 0;
function toastEl(){
  var el = document.getElementById("toast");
  if(!el){
    el = document.createElement("div");
    el.id = "toast";
    el.className = "toast";
    el.setAttribute("role", "status");
    document.body.appendChild(el);
  }
  return el;
}
function hideToast(){
  if(toastTimer){ clearTimeout(toastTimer); toastTimer = 0; }
  var el = document.getElementById("toast");
  if(el) el.classList.remove("in");
}
function showToast(msg, actLabel, act){
  var el = toastEl();
  hideToast();
  el.innerHTML = "";
  var s = document.createElement("span");
  s.className = "toast-msg";
  s.textContent = msg;                         // textContent:课程标题不进 HTML 解析
  el.appendChild(s);
  if(act){
    var b = document.createElement("button");
    b.className = "toast-act";
    b.textContent = actLabel;
    b.onclick = function(){ hideToast(); act(); };
    el.appendChild(b);
  }
  void el.offsetWidth;                         // 强制重排,连着两次出条才会重放淡入
  el.classList.add("in");
  toastTimer = setTimeout(hideToast, 2500);
}

/* 换课:不刷新页面,原地换内容 + 左右滑出滑入。
   整页跳转会重新加载所有资源,既慢又没法做过渡动画。 */
let switching = false;
function showPages(){                          // 无论如何都要把页面还原成可见
  const wrap = document.getElementById("pages");
  wrap.style.transition = "none";
  wrap.style.transform = "translateX(0)";
  wrap.style.opacity = "1";
}
/* byGesture:只有横滑换课才出提示条。按钮和「下一课 ➜」是孩子明确按下去的,
   继续卡/前进后退同理 —— 那些不需要一句"你换到哪了"外加一条后悔路 */
async function gotoLesson(dir, byGesture){
  const n = LESSON_AT + dir;
  if(switching || LESSON_AT < 0 || n < 0 || n >= LESSON_ORDER.length) return;
  switching = true;
  const wrap = document.getElementById("pages");
  const out = dir > 0 ? -60 : 60;             // 往哪边滑出去
  try{
    stopAllSound();
    // 时长/缓动一律读 theme.css 的 token,别在这里硬写秒数 —— 减弱动效时
    // token 归 0,过渡自然消失(setTimeout 也跟着变 0,不会白等)
    const ms = durMs("--dur-base");
    wrap.style.transition = "transform var(--dur-base) var(--ease-out), " +
                            "opacity var(--dur-base) var(--ease-out)";
    wrap.style.transform = `translateX(${out}px)`;
    wrap.style.opacity = "0";
    await new Promise(r => setTimeout(r, ms));

    const id = LESSON_ORDER[n].id;
    const r = await fetch(LESSON_BASE + id + ".json");
    if(!r.ok) throw new Error("lesson " + id);
    lesson = await r.json();
    LESSON_AT = n;
    CUR_ID = id;                              // 在 applyLesson 之前设,星罐才换得对
    history.pushState({lesson:id}, "", "app.html?lesson=" + id);
    showPage("learn", true);                  // 整页已经在滑了,页签动画不用再叠一层
    applyLesson();
    window.scrollTo(0, 0);
    // 手势换课曾经弹「已切到 XX · 撤销」的提示条 —— 家长反馈多余(顶栏课程名
    // 本来就换了,滑动动画也有方向感,再盖一条黑条是重复告知),已去掉。
    // byGesture 参数保留:将来若有手势专属逻辑还从这里进

    wrap.style.transition = "none";           // 从另一侧就位,再滑进来
    wrap.style.transform = `translateX(${-out}px)`;
    void wrap.offsetWidth;                    // 强制重排,否则两次赋值会被合并
    wrap.style.transition = "transform var(--dur-base) var(--ease-out), " +
                            "opacity var(--dur-base) var(--ease-out)";
    wrap.style.transform = "translateX(0)";
    wrap.style.opacity = "1";
    await new Promise(r => setTimeout(r, ms + 40));
  }catch(e){
    showPages();                              // 换课失败也不能把页面留在隐形状态
  }finally{
    switching = false;                        // 否则一次失败就再也换不了课
  }
}

// 浏览器前进/后退:同样原地换,不整页刷新
addEventListener("popstate", async e => {
  const id = new URLSearchParams(location.search).get("lesson");
  const n = LESSON_ORDER.findIndex(x => x.id === id);
  if(n < 0 || n === LESSON_AT) return;
  try{
    const r = await fetch(LESSON_BASE + id + ".json");
    if(r.ok) lesson = await r.json();
  }catch(err){}
  LESSON_AT = n;
  CUR_ID = id;
  stopAllSound(); showPage("learn", true); applyLesson(); showPages(); window.scrollTo(0, 0);
});
/* 用捕获阶段:单词、气泡等子元素会 stopPropagation,冒泡阶段收不到 */
addEventListener("pointerdown", e => {
  swX = e.clientX; swY = e.clientY; swDx = 0; swOn = true;
}, true);
addEventListener("pointermove", e => { if(swOn) swDx = e.clientX - swX; }, true);
addEventListener("pointercancel", () => { swOn = false; swDx = 0; }, true);
/* 答题中?—— 当前这一栏正有一轮没做完(不在开始页也不在结算页)。
   只看**当前页**:闯关做到一半但人在学一学翻卡片,那横滑就该照常好使 */
function activePage(){
  var ks = ["learn", "practice", "quiz"], i, el;
  for(i = 0; i < ks.length; i++){
    el = document.getElementById("page" + ks[i][0].toUpperCase() + ks[i].slice(1));
    if(el && el.classList.contains("on")) return ks[i];
  }
  return "learn";
}
function roundBusy(){
  var p = activePage();
  return (p === "practice" && pActive) || (p === "quiz" && qActive);
}
addEventListener("pointerup", e => {
  if(!swOn) return;
  swOn = false;
  const dy = e.clientY - swY;
  // 要够长、且明显是横向,才算换课(否则会误伤点单词、滚页面)
  if(Math.abs(swDx) <= Math.abs(dy) * 1.5) return;
  // 答题中收紧:80px 是"翻页"的手感,可选项排成一行、孩子的手掌又整个压在
  // 屏幕上,答着题很容易划出这么一下 —— 一轮进度就没了。
  // 加到 140px 还不够(划得长只是更用力,不代表更有意),再要求**从屏幕边缘起手**:
  // 边缘那 24% 没有选项也没有卡片,手指落在那儿基本只可能是奔着翻页去的。
  const busy = roundBusy();
  if(!busy){
    if(Math.abs(swDx) <= 80) return;
  }else{
    if(Math.abs(swDx) <= 140) return;
    const w = window.innerWidth || document.documentElement.clientWidth || 0;
    const edge = w * 0.24;
    if(!(w > 0 && (swX <= edge || swX >= w - edge))) return;
  }
  const dir = swDx < 0 ? 1 : -1;
  gotoLesson(dir, true);
}, true);

/* 混合复习:把各课的卡片凑成一节临时的课。
   打卡最需要的是螺旋复现 —— 学完一课就再也不碰,等于没学。
   凑法不再是"每课均匀抽两张"(卡池只会越加课越稀,单卡一个多月才轮到一次,
   错过的卡也不会更常出现),改成按复习账本调度(轻量 Leitner,见 revStore):
   一轮 REVIEW_ROUND 张卡,配额 6 到期 + 2 新卡 + 2 巩固,不足向后借位;
   到期卡按"逾期天数 + 错次"加权随机 —— 拖得越久、错得越多,越优先。
   每卡只留一问:复习是抽查,覆盖面优先;课内闯关才是一卡连问的教学。
   同课最多 2 张、排列尽量不同课相邻:干扰项跨课已是交错练习,题序也交错。
   卡里的图和音频路径本来就相对 lessons/,混着用不用改写。 */
const REVIEW_ROUND = 10;      // 复习一轮的卡数(每卡一问)。比课内 12 短:这是叠在新课上的第二任务
const REV_PER_LESSON = 2;     // 一轮里同一课最多几张

async function buildReviewLesson(pick){
  const idx = await (await fetch(LESSON_BASE + "index.json", {cache:"no-store"})).json();
  const metas = idx.lessons || [];
  const all = await Promise.all(metas.map(l =>
    fetch(LESSON_BASE + l.id + ".json").then(r => r.ok ? r.json() : null).catch(()=>null)));
  const pool = [], word_audio = {}, praise_audio = {};
  all.forEach((d, i) => {
    if(!d) return;
    Object.assign(word_audio, d.word_audio || {});
    Object.assign(praise_audio, d.praise_audio || {});
    (d.cards || []).forEach(c => {
      // 按课堂复习(pick=day)只收那天上课的卡(added 由 gen_audio.py 盖戳);
      // 没有戳的老卡不属于任何课堂日,天然进不了这个切片
      if(pick === "day" && c.added !== REVIEW_DAY) return;
      const qs = askable(c);
      // 闯不了关的卡进不了调度池;但课堂日的卡列表要如实还原那天的课 ——
      // 虚词卡照样进学一学,闯关那边 startPractice 自己会跳过没题可出的卡
      if(!qs.length && pick !== "day") return;
      // 每卡只留一问:选中的保持原引用,其余克隆成 practice:false ——
      // 学一学照常显示全部对话(practice 只管闯关),原课程数据一个字不动
      const keep = qs.length ? qs[Math.floor(Math.random() * qs.length)] : null;
      const dialog = (c.dialog || []).map(t =>
        (t === keep || t.practice === false) ? t : Object.assign({}, t, {practice: false}));
      pool.push(Object.assign({}, c, {dialog: dialog, _src: metas[i].id}));
    });
  });
  if(pick === "day")
    // 不设 ordered:池子按 index 的课程序排(学一学同课的卡挨着翻),
    // 闯关每轮自己洗牌 —— 那天的卡超过一轮上限时,「再来一轮」能碰到不同的一批
    return {title: dayReviewTitle(REVIEW_DAY), cards: pool,
            word_audio, praise_audio};
  if(pick === "wrong")
    return {title: "错题本 · 把它们练熟", cards: pickWrongBook(pool),
            word_audio, praise_audio, ordered: true};
  return {title: "混合复习 · 各课随机抽题", cards: pickReviewRound(pool),
          word_audio, praise_audio, ordered: true};
}

/* 课堂日复习的标题:"8月30日的课"(当天就叫"今天的课"),孩子和家长
   都不用换算 YYYY-MM-DD。日期没传/格式歪了就叫"那天的课" —— 池子必然
   是空的,init 会摆着陆页,标题只是陪衬 */
function dayReviewTitle(d){
  var p = String(d || "").split("-");
  var md = p.length === 3 ? (+p[1]) + "月" + (+p[2]) + "日" : "那天";
  return (d === today() ? "今天" : md) + "的课 · 整套再过一遍";
}

/* 错题本:账本的一个切片,不是第二套数据 —— w>0(错过)且 b≤3(还没爬到 7 天盒)。
   专练答对照常升盒,爬到盒 4 自动毕业出本,本子自己变薄;毕业的卡不消失,
   仍按 7/14 天间隔出现在混合复习里。排序按"最需要练":盒号升序 → 错次降序 →
   最久没见优先。不限量:学一学翻的是整本,闯关一轮天然被 ROUND_MAX 截住,
   按这个顺序取最前面的 —— 屡错的卡永远先上。 */
function pickWrongBook(pool){
  var o = revStore.load();
  var book = pool.filter(function(c){
    if(!o[revKey(c)]) return false;            // 没进过账的新卡谈不上"错"
    var r = revRec(o, revKey(c));
    return r.w > 0 && r.b <= 3;
  });
  return book.sort(function(a, b){
    var ra = revRec(o, revKey(a)), rb = revRec(o, revKey(b));
    return (ra.b - rb.b) || (rb.w - ra.w) ||
           (ra.t < rb.t ? -1 : ra.t > rb.t ? 1 : 0);
  });
}

function pickReviewRound(pool){
  var o = revStore.load(), t = today();
  var due = [], fresh = [], rest = [];
  pool.forEach(function(c){
    if(!o[revKey(c)]){ fresh.push(c); return; } // 没进过账 = 新卡
    var r = revRec(o, revKey(c));
    (dayDiff(r.t, t) >= REV_GAP[r.b] ? due : rest).push(c);
  });
  // 巩固桶:没到期但盒号低的优先(昨天刚错过的,多见一面有益);同盒之间随机
  rest = shuffle(rest).sort(function(a, b){
    return revRec(o, revKey(a)).b - revRec(o, revKey(b)).b;
  });
  fresh = shuffle(fresh);
  var dueW = function(c){
    var r = revRec(o, revKey(c));
    return 1 + Math.min(dayDiff(r.t, t) - REV_GAP[r.b], 7) + 2 * r.w;
  };
  var perLesson = {}, out = [];
  takeWeighted(out, due, dueW, 6, perLesson);
  takePlain(out, fresh, 2, perLesson);
  takePlain(out, rest, 2, perLesson);
  // 借位补齐:到期 → 新卡 → 巩固,谁还有就再从谁那儿拿。
  // 刚开始用时全池都是新卡,自然整轮新卡 —— 不需要冷启动特判
  takeWeighted(out, due, dueW, REVIEW_ROUND - out.length, perLesson);
  takePlain(out, fresh, REVIEW_ROUND - out.length, perLesson);
  takePlain(out, rest, REVIEW_ROUND - out.length, perLesson);
  return arrangeReview(out);
}
/* 从 cands 头部按序取 n 张(cands 已按优先级排好),同课超上限的跳过。
   取走的从 cands 里删掉 —— 借位那几轮接着从剩下的里拿 */
function takePlain(out, cands, n, perLesson){
  while(n > 0 && cands.length){
    var c = cands.splice(0, 1)[0];
    if((perLesson[c._src] || 0) >= REV_PER_LESSON) continue;
    perLesson[c._src] = (perLesson[c._src] || 0) + 1;
    out.push(c); n--;
  }
}
/* 加权随机取 n 张(不放回)。加权而不是硬排序:该多考的多考,但保留一点惊喜感 */
function takeWeighted(out, cands, wOf, n, perLesson){
  while(n > 0 && cands.length){
    var tot = 0, ws = cands.map(function(c){
      var w = wOf(c);
      w = (typeof w === "number" && isFinite(w) && w > 0) ? w : .01;
      tot += w; return w;
    });
    var r = Math.random() * tot, at = cands.length - 1;
    for(var i = 0; i < ws.length; i++){ r -= ws[i]; if(r <= 0){ at = i; break; } }
    var c = cands.splice(at, 1)[0];
    if((perLesson[c._src] || 0) >= REV_PER_LESSON) continue;
    perLesson[c._src] = (perLesson[c._src] || 0) + 1;
    out.push(c); n--;
  }
}
/* 排题序:洗一遍再贪心 —— 每次挑第一张和上一张不同课的,挑不到才容忍相邻 */
function arrangeReview(cards){
  var rem = shuffle(cards), out = [];
  while(rem.length){
    var at = -1;
    for(var i = 0; i < rem.length; i++){
      if(!out.length || rem[i]._src !== out[out.length - 1]._src){ at = i; break; }
    }
    if(at < 0) at = 0;
    out.push(rem.splice(at, 1)[0]);
  }
  return out;
}

/* 样例课的内嵌图:只在真的要用 FALLBACK_LESSON 时才去下 preview-img.js(436KB)。
   ⚠️ onerror 也要 resolve —— 没有服务器、文件被删、离线,都不该把 init 卡死在这里,
   拿不到就让卡片留着 emoji 兜底。永远不 reject。 */
function loadPreviewImages(){
  return new Promise(function(resolve){
    var s = document.createElement("script");
    s.src = "preview-img.js";
    s.onload = s.onerror = function(){ resolve(); };
    document.head.appendChild(s);
  });
}
function fillPreviewImages(){
  FALLBACK_LESSON.cards.forEach(function(c){
    var src = c.pkey ? PREVIEW_IMG[c.pkey] : null;
    if(src) c.image = src;
    else delete c.image;         // 取不到就别留 undefined:imgSrc() 会对它调 startsWith
  });
}

(async function init(){
  /* 学一学那条说明行("点句听句 · 点词听词 · 按住看意思")是给家长看的一次性说明:
     看懂了就该让位,常驻等于每天在内容上方永久占一行。前 2 次进课程页显示,
     之后整行从 DOM 里摘掉(不是藏起来 —— 藏起来仍占位)。
     按**页面加载**计数,所以放在 init 的第一句(await 之前,同步跑完,不会先闪一下):
     换课走的是 applyLesson,那条路不该算成新的一次。 */
  if(coachCount("learnHint") < 2) bumpCoach("learnHint");
  else{
    const h = document.getElementById("learnHint");
    if(h) h.remove();
  }
  const id = new URLSearchParams(location.search).get("lesson");
  CUR_ID = id;                   // 没带 ?lesson= 时是 null:预览课不记账
  lesson = FALLBACK_LESSON;
  if(id === "review"){
    const params = new URLSearchParams(location.search);
    REVIEW_PICK = params.get("pick");
    if(REVIEW_PICK === "day") REVIEW_DAY = params.get("d");
    try{ lesson = await buildReviewLesson(REVIEW_PICK); }catch(e){}
  }else if(id){
    try{
      const r = await fetch(LESSON_BASE + id + ".json");
      if(r.ok) lesson = await r.json();
    }catch(e){}
  }
  // 到这儿还是样例课(没带参数,或带了参数但没取到),才需要那份内嵌图
  if(lesson === FALLBACK_LESSON){
    try{ await loadPreviewImages(); fillPreviewImages(); }catch(e){}
  }
  try{
    const r = await fetch(LESSON_BASE + "dictionary.json");
    if(r.ok) DICT = Object.assign(DICT, await r.json());
  }catch(e){}
  try{
    const r = await fetch(LESSON_BASE + "phonics.json");
    if(r.ok) PHONICS = (await r.json()).sounds || {};
  }catch(e){}
  try{
    const r = await fetch(LESSON_BASE + "index.json", {cache:"no-store"});
    if(r.ok){
      LESSON_ORDER = (await r.json()).lessons || [];
      LESSON_AT = LESSON_ORDER.findIndex(x => x.id === id);
    }
  }catch(e){}
  history.replaceState({lesson:id}, "", location.href);
  applyLesson();
  // 复习和普通课一样落在「学一学」(HTML 里 learn 自带 .on,什么都不用做)。
  // 曾经让复习直接落在闯关(理由是"先考不先翻卡"的测试效应),家长明确要求
  // 改回:孩子的习惯是先看一遍再答,直接进闯关像"还没复习就被考"。
  // 错题本同样落学一学 —— 翻本子正是"先看一遍"。
  // 空着进来是唯一的例外:没有可翻可考的内容,两个页签都摆着陆页
  // (错题本的空是庆祝;课堂日的空是"没找到",文案在 emptyRoundHTML 里分岔)
  if(id === "review" && (REVIEW_PICK === "wrong" || REVIEW_PICK === "day") &&
     !(lesson.cards || []).length){
    document.getElementById("learnList").innerHTML = emptyRoundHTML();
    pbox.innerHTML = emptyRoundHTML();
  }
})();
</script>
