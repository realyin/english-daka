<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>我的英语打卡</title>
<style>
  :root{
    --bg:#F0F7FF; --ink:#2B3A55;
    --pink:#FF6FA5; --yellow:#FFC53D; --green:#4CC26E;
    --blue:#3E8BFF; --purple:#9B6DFF; --orange:#FF9A3D;
  }
  /* 全局禁选:长按单词是本应用的查词手势,不能被系统的"复制/翻译"选择菜单抢走
     (安卓长按会选中文字并弹出原生菜单,挡住我们的词义弹窗) */
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;
    -webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;
    -webkit-touch-callout:none;}
  body{
    font-family:"PingFang SC","Arial Rounded MT Bold",-apple-system,sans-serif;
    background:var(--bg); color:var(--ink);
    min-height:100vh; padding-bottom:40px;
    /* 关掉滚动锚定:展开卡片时浏览器(安卓 Chrome)会挑一个可见节点当锚,
       内容一长就自己改 scrollTop 去"稳住"那个锚——正好把我们展开后补回来的
       滚动位置又冲掉,卡片重新往上窜。这页没有异步插内容的地方,不需要锚定 */
    overflow-anchor:none;
  }
  /* 课程页顶部只留一条吸顶工具条:返回 + 课程名 + 星星 + 模式切换。
     内容限宽到和卡片同一列 —— 否则宽屏上 flex 会把返回键甩到屏幕最左角,
     和内容完全脱节。课程页不再重复显示应用名,省下一整行高度。 */
  .topbar{
    position:sticky;top:0;z-index:20;background:var(--bg);
    box-shadow:0 8px 14px -10px rgba(43,58,85,.45);
  }
  .topbar-in{
    max-width:520px;margin:0 auto;padding:8px 14px 11px;
    display:flex;flex-direction:column;gap:8px;
  }
  .bar-row{display:flex;align-items:center;gap:10px;}
  .lesson-title{
    flex:1;min-width:0;font-size:15px;font-weight:800;color:var(--ink);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .star-jar{
    flex:none;display:inline-flex;align-items:center;gap:5px;
    background:#FFF3D6;border:2px solid var(--yellow);border-radius:999px;
    padding:6px 14px;font-size:16px;font-weight:800;
  }
  .back,.tab{
    border:2px solid var(--line);border-radius:14px;background:#fff;
    font-size:15px;font-weight:800;color:var(--ink);min-height:48px;
    box-shadow:var(--shadow);cursor:pointer;transition:transform .1s;
    display:flex;align-items:center;justify-content:center;
  }
  .back{flex:none;width:48px;height:48px;font-size:22px;text-decoration:none;}
  /* 上一课/下一课:整页左右滑也能切,但按钮要在,否则孩子发现不了这个手势 */
  .navbtn{
    flex:none;width:38px;height:48px;font-size:26px;line-height:1;padding:0;
    border:2px solid var(--line);border-radius:14px;background:#fff;
    font-weight:900;color:var(--blue);box-shadow:var(--shadow);cursor:pointer;
    display:flex;align-items:center;justify-content:center;transition:transform .1s;
  }
  .navbtn:disabled{opacity:.3;box-shadow:none;cursor:default;}
  .navbtn:not(:disabled):active{transform:translateY(3px);box-shadow:var(--shadow-sm);}
  .back:active,.tab:active{transform:translateY(3px);box-shadow:var(--shadow-sm);}
  .tabs{display:flex;gap:8px;}
  /* 字号跟屏宽收,别让"问答闯关"在窄屏折成两行 */
  .tab{flex:1;padding:0 2px;white-space:nowrap;font-size:clamp(13px, 3.6vw, 15px);}
  .tab.on{background:var(--yellow);}
  /* pan-y:纵向滚动交给浏览器,横向留给"上一课/下一课"手势 */
  .page{display:none;padding:0 14px;max-width:520px;margin:0 auto;touch-action:pan-y;}
  .page.on{display:block;}
  .hint{text-align:center;font-size:12px;color:#7A879E;margin-bottom:10px;line-height:1.7;}

  .panel{
    background:#fff;border:2px solid var(--line);border-radius:22px;
    box-shadow:var(--shadow);padding:16px;margin-bottom:14px;
  }

  /* 配图是问答的陪衬,不是主角:再按 26vh 兜一道底,
     矮屏(横屏平板/小窗口)上自动收窄,保证问答和选项不被挤出屏幕 */
  .pic{
    width:100%;max-width:min(200px, 26vh);margin:0 auto;
    aspect-ratio:3/4;object-fit:cover;display:block;
    border:2px solid var(--line);border-radius:16px;background:#EAF0F8;
  }
  .pic.mid{max-width:min(190px, 24vh);}   /* 闯关还要给下方选项留位置 */

  /* ===== 学一学 ===== */
  /* 卡片头部模板:左侧固定尺寸徽章槽(图片/算式/emoji 通吃)+ 词条 + 标签 */
  .lhead{display:flex;align-items:center;gap:12px;cursor:pointer;}
  .lhead .slot{
    flex:none;width:76px;height:70px;
    display:flex;align-items:center;justify-content:center;
  }
  .lhead .emoji{font-size:40px;}
  .lhead .thumb{width:52px;height:70px;object-fit:cover;border-radius:10px;border:2px solid var(--line);}
  .lhead .eq{font-size:14px;}
  .lhead .word{font-size:19px;font-weight:800;line-height:1.25;}
  .lhead .cn{font-size:12px;color:#7A879E;margin-top:2px;}
  .lhead .tag{
    margin-left:auto;font-size:10px;font-weight:700;color:#fff;
    border-radius:999px;padding:3px 9px;white-space:nowrap;
  }
  .tag{background:var(--purple);}
  .tag.sight{background:var(--pink);}
  .tag.sign{background:var(--blue);}
  /* 原课件字母课里夹的复习页(颜色/数数),内容留着,但标出来别和本课主线混 */
  .tag.review{background:var(--green,#4CAF7D);}
  .dialog{margin-top:10px;display:none;}
  .lcard.open .dialog{display:block;}
  .word-play{display:none;}
  .lcard.open .word-play{display:inline-block;}

  /* ===== CVC 拼读 ===== */
  .sound-group{
    margin:22px 2px 10px;font-size:16px;font-weight:900;color:var(--ink);
    display:flex;align-items:center;gap:8px;
  }
  .sound-group::after{content:"";height:3px;background:#DCE7F5;flex:1;border-radius:9px;}
  .phonics{
    margin-top:12px;padding:13px;background:#F7FAFF;
    border:2.5px dashed #A9BCE0;border-radius:17px;text-align:center;
  }
  .phonics-step{font-size:11px;font-weight:800;color:#7A879E;margin:2px 0 8px;}
  .sound-tiles{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;}
  .sound-tile{
    min-width:62px;border:2px solid var(--line);border-radius:14px;
    background:#E7F0FF;color:var(--ink);padding:8px 9px;
    box-shadow:var(--shadow);cursor:pointer;
  }
  .sound-tile.vowel{background:#FFE5EF;}
  .sound-tile.silent{background:#EEF1F5;color:#7A879E;border-style:dashed;box-shadow:none;}
  .sound-tile:active,.sound-tile.speaking{transform:translateY(3px);box-shadow:none;background:var(--yellow);}
  .sound-tile .letter{display:block;font-size:25px;font-weight:900;line-height:1;}
  .sound-tile .ipa{display:block;font-size:12px;font-weight:700;margin-top:5px;}
  .sound-cue{font-size:12px;color:#66748B;font-weight:650;line-height:1.6;margin:10px auto 0;max-width:390px;}
  .blend-row{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:12px;flex-wrap:wrap;}
  .blend-chip{
    border:2px solid var(--line);border-radius:13px;background:#FFF3D6;
    padding:7px 13px;font-size:21px;font-weight:900;cursor:pointer;
  }
  .blend-arrow{font-size:18px;font-weight:900;color:#7A879E;}
  .blend-chip.speaking{background:var(--yellow);transform:scale(1.06);}
  .blend-word{font-size:28px;color:var(--purple);}
  .blend-play{margin-top:12px;background:var(--green);color:#fff;}
  .dialog .pic{margin-top:10px;}

  /* ===== 气泡:句级 + 词级点读 ===== */
  .bubble{
    max-width:88%;padding:9px 12px;border-radius:16px;
    font-size:16px;font-weight:600;line-height:1.55;margin-top:9px;
    border:2px solid var(--line);
  }
  .bubble.q{background:#FFF1E0;border-color:var(--orange);border-bottom-left-radius:4px;margin-right:auto;}
  .bubble.a{background:#E7F0FF;border-color:var(--blue);border-bottom-right-radius:4px;margin-left:auto;}
  .bubble .who{font-size:10px;color:#7A879E;font-weight:700;display:block;margin-bottom:4px;}
  .bubble{cursor:pointer;}
  .sline{margin-top:6px;}
  .sline:first-of-type{margin-top:0;}
  .line{display:flex;align-items:flex-start;gap:7px;}
  .mini{
    flex:none;width:27px;height:27px;border-radius:50%;
    border:2px solid var(--line);background:#fff;
    font-size:12px;font-weight:800;color:var(--ink);
    box-shadow:var(--shadow);cursor:pointer;padding:0;margin-top:1px;
  }
  .mini:active{transform:translateY(2px);box-shadow:none;}
  .mini.on{background:var(--yellow);}
  .stext{flex:1;user-select:none;-webkit-user-select:none;}
  .stext.speaking{text-shadow:0 0 0;background:linear-gradient(transparent 65%, #FFE9A8 65%);border-radius:4px;}
  .w{padding:1px 2px;border-radius:6px;cursor:pointer;}
  .w.hl{background:var(--yellow);}
  .trans{
    display:none;font-size:12.5px;color:#7A879E;font-weight:600;
    margin-top:4px;padding-left:36px;
  }
  .sline.showzh .trans{display:block;}

  /* 词典弹窗 */
  #wpopWrap{
    display:none;position:fixed;inset:0;z-index:50;
    background:rgba(43,58,85,.35);
  }
  #wpop{
    position:absolute;left:50%;bottom:12vh;transform:translateX(-50%);
    width:min(320px, 86vw);
    background:#fff;border:2px solid var(--line);border-radius:22px;
    box-shadow:var(--shadow);padding:20px;text-align:center;
  }
  #wpop .pw{font-size:30px;font-weight:900;color:var(--purple);}
  #wpop .pc{font-size:16px;font-weight:700;margin-top:8px;line-height:1.5;}
  #wpop .pc.none{color:#A9B4C6;font-size:13px;}
  #wpop .mini{width:40px;height:40px;font-size:17px;margin-top:14px;}

  /* ===== 问答闯关 ===== */
  .p-head{text-align:center;}
  .p-emoji{font-size:64px;}
  /* 算式渲染(替代 keycap emoji,各平台样式一致) */
  .eq{display:inline-flex;align-items:center;gap:.28em;font-weight:900;}
  .eq b{
    background:var(--blue);color:#fff;border:none;
    border-radius:.32em;padding:.1em .36em;line-height:1.25;
    box-shadow:0 .08em .25em rgba(43,58,85,.25);
  }
  .eq b:nth-of-type(2){background:var(--pink);}
  .eq i{font-style:normal;color:var(--ink);font-size:.85em;}
  .p-head .eq{font-size:40px;margin-top:6px;}
  .eq-box{text-align:center;margin:16px 0 6px;}
  .eq-box .eq{font-size:54px;}
  /* 拼读串联没有配图时放大字母:整词一个底色连起来 ——
     三块不同颜色会让孩子把字母看成三个独立的东西,而这一问要练的正是"连成一个词" */
  .eq.letters b{background:var(--blue);letter-spacing:.1em;padding:.1em .3em .1em .4em;}
  .opt .eq{font-size:26px;}
  .p-word{font-size:28px;font-weight:900;color:var(--purple);}
  .p-head .pic{margin:10px auto 4px;}
  .chat{min-height:56px;margin-top:6px;display:flex;flex-direction:column;}
  .ctrl{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px;}
  .btn{
    border:2px solid var(--line);border-radius:16px;background:#fff;
    font-size:15px;font-weight:800;color:var(--ink);padding:12px 16px;
    box-shadow:var(--shadow);cursor:pointer;transition:transform .1s;
  }
  .btn:active{transform:translateY(3px);box-shadow:var(--shadow-sm);}
  .btn.go{background:var(--green);color:#fff;}
  .btn.blue{background:var(--blue);color:#fff;}
  .heard{
    margin-top:12px;font-size:14px;color:#7A879E;text-align:center;
    background:#F4F6FA;border-radius:12px;padding:8px;display:none;
  }
  .heard b{color:var(--ink);}
  .p-hint{margin-top:14px;font-size:13px;color:#7A879E;font-weight:700;text-align:center;}
  .ans-chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:10px;}
  .ans-chip{
    border:2px solid var(--line);border-radius:16px;background:#FFF3D6;
    padding:12px 18px;font-size:20px;font-weight:900;color:var(--ink);
    box-shadow:var(--shadow);cursor:pointer;transition:transform .1s;
  }
  .ans-chip:active{transform:translateY(3px);box-shadow:var(--shadow-sm);}
  /* 正在念到的那个选项高亮 —— 孩子靠"哪个在响"把声音和字对上 */
  .ans-chip.speaking{background:var(--yellow,#FFD34D);transform:scale(1.08);}
  .ans-chip.right{background:var(--green);color:#fff;}
  .ans-chip.wrong{background:#FFD9D9;animation:shake .3s;}
  @keyframes shake{25%{transform:translateX(-5px);}75%{transform:translateX(5px);}}
  .progress{text-align:center;font-size:13px;color:#7A879E;margin-bottom:8px;}
  .result-emoji{text-align:center;font-size:38px;margin-top:6px;min-height:44px;}

  .done{text-align:center;font-size:19px;font-weight:800;line-height:1.8;}
  .done .big{font-size:54px;}
  .big-btn{
    margin-top:16px;border:2px solid var(--line);border-radius:18px;
    background:var(--green);color:#fff;font-size:18px;font-weight:800;
    padding:13px 34px;box-shadow:var(--shadow);cursor:pointer;
  }
  .big-btn:active{transform:translateY(4px);box-shadow:var(--shadow-sm);}

  /* ===== 考一考 ===== */
  .q-word{font-size:36px;font-weight:900;color:var(--purple);margin:6px 0 2px;text-align:center;}
  /* 听句选图的题面是整句,比单词长得多,压小并留边 */
  .q-sent{font-size:22px;font-weight:900;color:var(--purple);margin:6px auto 2px;
          text-align:center;line-height:1.35;max-width:19em;padding:0 8px;}
  .q-prompt{font-size:14px;color:#7A879E;text-align:center;}
  .speak-btn{
    margin:12px auto;width:58px;height:58px;border-radius:50%;
    border:2px solid var(--line);background:var(--blue);color:#fff;font-size:26px;
    box-shadow:var(--shadow);cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  .speak-btn:active{transform:translateY(3px);box-shadow:var(--shadow-sm);}
  .opts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px;}
  .opts.two{grid-template-columns:repeat(2,1fr);}
  .opt{
    border:2px solid var(--line);border-radius:18px;background:#fff;
    font-size:42px;padding:14px 0;box-shadow:var(--shadow);
    cursor:pointer;transition:transform .1s;overflow:hidden;
  }
  .opt.haspic{padding:0;font-size:0;}
  .opt.haspic img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block;}
  .opt:active{transform:translateY(3px);box-shadow:var(--shadow-sm);}
  .opt.right{background:#DFF7E6;border-color:var(--green);animation:pop .4s;}
  .opt.wrong{background:#FFE3E3;border-color:var(--pink);animation:shake .4s;}
  @keyframes pop{50%{transform:scale(1.1);}}
  @keyframes shake{25%{transform:translateX(-6px);}75%{transform:translateX(6px);}}
  @media (prefers-reduced-motion: reduce){
    .opt.right,.opt.wrong{animation:none;}
  }
</style>
<link rel="stylesheet" href="theme.css">
</head>
<body>
<div class="topbar">
  <div class="topbar-in">
    <div class="bar-row">
      <a class="back" href="index.html" aria-label="返回课程列表" title="返回课程列表">🏠</a>
      <button class="navbtn" id="prevLesson" aria-label="上一课" disabled>‹</button>
      <div class="lesson-title" id="lessonTitle"></div>
      <button class="navbtn" id="nextLesson" aria-label="下一课" disabled>›</button>
      <div class="star-jar">⭐ <span id="stars">0</span></div>
    </div>
    <div class="tabs">
      <button class="tab on" id="tabLearn" onclick="showPage('learn')">📖 学一学</button>
      <button class="tab" id="tabPractice" onclick="showPage('practice')">🎤 问答闯关</button>
      <button class="tab" id="tabQuiz" onclick="showPage('quiz')">🎯 考一考</button>
    </div>
  </div>
</div>

<div id="pages">
<div class="page on" id="pageLearn">
  <p class="hint" id="learnHint">🔊 听整句 · 点单词听单词 · 按住单词看意思 · 中 看翻译</p>
  <div id="learnList"></div>
</div>

<div class="page" id="pagePractice">
  <div class="panel" id="practiceBox"></div>
</div>

<div class="page" id="pageQuiz">
  <div class="panel" id="quizBox"></div>
</div>
</div><!-- /#pages -->

<!-- 词典弹窗 -->
<div id="wpopWrap">
  <div id="wpop">
    <div class="pw" id="popWord"></div>
    <div class="pc" id="popCn"></div>
    <button class="mini" onclick="popSpeak()">🔊</button>
  </div>
</div>

<!-- 白屏兜底:页面内容全是 JS 渲染的,JS 一旦解析失败(老浏览器不认新语法)
     或初始化抛错,就会留下一片空白,看不出任何线索。这段单独成块、且只用 ES5 写,
     老浏览器也能跑,负责把错误显示在页面上。加新语法前先想想这里的兜底还在不在。 -->
<script>
window.onerror = function (msg, src, line) {
  var d = document.getElementById("fatalErr");
  if (!d) {
    d = document.createElement("div");
    d.id = "fatalErr";
    d.style.cssText = "margin:16px;padding:14px;border:2px solid #FF6FA5;border-radius:12px;"
      + "background:#FFF3F6;color:#333;font:14px/1.6 -apple-system,system-ui,sans-serif;"
      + "white-space:pre-wrap;word-break:break-word;";
    (document.body || document.documentElement).appendChild(d);
  }
  d.textContent = "\u9875\u9762\u6ca1\u80fd\u52a0\u8f7d \u2014\u2014 \u6d4f\u89c8\u5668\u7248\u672c\u53ef\u80fd\u592a\u65e7\u3002\n\u628a\u4e0b\u9762\u8fd9\u6bb5\u622a\u56fe\u53d1\u7ed9\u5f00\u53d1\u8005\uff1a\n\n"
    + msg + "\n" + (src || "") + "  \u7b2c " + line + " \u884c\n\n" + navigator.userAgent;
  return false;
};

/* ================================================================
   声音:有预生成音频文件就播文件,没有降级到设备 TTS
   role: q=提问(童声/高音调) a=回答 w=单词(更慢)
   ================================================================ */
/* 设备 TTS 不是每个浏览器都有(国产壳浏览器、部分 WebView 就没有)。
   注意不能写 `speechSynthesis && ...` —— 全局不存在时,光是引用这个裸标识符
   就抛 ReferenceError,&& 根本轮不到执行;顶层抛错会让整个 <script> 停在那里,
   页面变成一片空白。必须用 typeof 或 window. 来探测。
   没有 TTS 不影响使用:所有句子/单词都有预生成的 mp3,TTS 只是加载失败时的兜底。 */
const TTS = (typeof speechSynthesis !== "undefined") ? speechSynthesis : null;
const HAS_TTS = !!(TTS && typeof SpeechSynthesisUtterance !== "undefined");

function ttsUtter(text, role){
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "en-US";
  u.rate = role === "w" ? 0.65 : 0.82;
  u.pitch = role === "q" ? 1.25 : 1.0;
  const v = TTS.getVoices().find(v=>v.lang.startsWith("en"));
  if(v) u.voice = v;
  return u;
}
let currentAudio = null;
/* 播放代号:打断只 pause 当前这条,队列里"下一条"的 250ms 定时器还在飞,
   不作废就会和新播的声音叠在一起(念选项时点了别的按钮最容易撞上) */
let playGen = 0;
function stopAllSound(){
  playGen++;
  if(TTS) TTS.cancel();
  if(currentAudio){ currentAudio.pause(); currentAudio = null; }
}
function playSeq(items, onDone){
  stopAllSound();
  const gen = playGen;
  let i = 0;
  function next(){
    if(gen !== playGen) return;                 // 已被新的播放接管
    if(i >= items.length){ onDone && onDone(); return; }
    const it = items[i++];
    it.el && it.el.classList.add("speaking");
    const finish = ()=>{ it.el && it.el.classList.remove("speaking"); setTimeout(next, 250); };
    if(it.audio){
      const a = new Audio(LESSON_BASE + it.audio);
      currentAudio = a;
      a.onended = finish;
      const fallback = ()=>it.noTts ? finish() : ttsPlay(it, finish);
      a.onerror = fallback;
      a.play().catch(fallback);
    }else if(it.noTts){
      finish();
    }else{
      ttsPlay(it, finish);
    }
  }
  function ttsPlay(it, cb){
    if(!HAS_TTS){ cb(); return; }   // 没有 TTS 就跳过这句,别卡住整个队列
    const u = ttsUtter(it.text, it.role);
    u.onend = cb; u.onerror = cb;
    TTS.speak(u);
  }
  next();
}
function playOne(text, role, audio, cb, el){ playSeq([{text, role, audio, el}], cb); }
function playWord(word){
  const audio = lesson.word_audio ? lesson.word_audio[word] : null;

}

   sline = [🔊][中] 单词们 + 隐藏的整句翻译

function normWord(w){ return w.toLowerCase().replace(/[^a-z']/g, ""); }
/* 整词/短语匹配用:前后补空格,避免 man 命中 woman */
function norm(s){
  return " " + s.toLowerCase().replace(/[^a-z' ]/g, " ").replace(/\s+/g, " ").trim() + " ";
}
function lookup(w){
  if(DICT[w]) return DICT[w];
  if(w.endsWith("'s") && DICT[w.slice(0,-2)]) return DICT[w.slice(0,-2)] + " 的";
  if(w.endsWith("s") && DICT[w.slice(0,-1)]) return DICT[w.slice(0,-1)];
  if(w.endsWith("es") && DICT[w.slice(0,-2)]) return DICT[w.slice(0,-2)];      // boxes→box
  if(w.endsWith("ies") && DICT[w.slice(0,-3)+"y"]) return DICT[w.slice(0,-3)+"y"];
  if(w.endsWith("ing") && DICT[w.slice(0,-3)]) return DICT[w.slice(0,-3)];     // running→run
  if(w.endsWith("ed") && DICT[w.slice(0,-2)]) return DICT[w.slice(0,-2)];
  return null;
}

function makeWordSpan(raw){
  const word = normWord(raw);
  const sp = document.createElement("span");
  sp.className = "w";
  sp.textContent = raw;
  if(!word) return sp;
  /* 句中的 /s/ /ks/ 这类音标要点出纯音 —— 走 words/ 会读成字母名
     ("ess"、"kay ess"),那是这个词条里最不该听到的声音 */
  const ph = raw.match(/^\/([a-z]+)\/[.,!?]*$/);
  if(ph){
    sp.onclick = e=>{
      e.stopPropagation();
      sp.classList.add("hl");
      setTimeout(()=>sp.classList.remove("hl"), 500);
      // noTts:纯音没有对应的 TTS 说法,音频缺了就安静,别去念 "slash k s slash"
      playSeq([{text: raw, role: "w", audio: chipAudio("/" + ph[1] + "/"),
                noTts: true}]);
    };
    return sp;
  }
  let timer = null, longed = false;
  const start = e=>{
    longed = false;
    timer = setTimeout(()=>{ longed = true; openPop(word); }, 450);
  };
  const end = e=>{
    clearTimeout(timer);
    // 手指是横着划过去的(在换课),不是点这个词
    if(!longed && Math.abs(swDx) < 12){
      sp.classList.add("hl");
      setTimeout(()=>sp.classList.remove("hl"), 500);
      playWord(word);
    }
    e.preventDefault(); e.stopPropagation();
  };
  sp.addEventListener("pointerdown", start);
  sp.addEventListener("pointerup", end);
  sp.addEventListener("pointercancel", ()=>clearTimeout(timer));
  sp.addEventListener("pointerleave", ()=>clearTimeout(timer));
  sp.addEventListener("contextmenu", e=>e.preventDefault());
  return sp;
}

function makeSline(text, cn, role, audio){
  const sline = document.createElement("div");
  sline.className = "sline";
  const line = document.createElement("div");
  line.className = "line";

  const spk = document.createElement("button");
  spk.className = "mini"; spk.textContent = "🔊";
  const stext = document.createElement("span");
  stext.className = "stext";
  spk.onclick = e=>{ e.stopPropagation(); playOne(text, role, audio, null, stext); };

  const zh = document.createElement("button");
  zh.className = "mini"; zh.textContent = "中";
  zh.onclick = e=>{
    e.stopPropagation();
    sline.classList.toggle("showzh");
    zh.classList.toggle("on");
  };

  text.split(" ").forEach((raw,i)=>{
    if(i) stext.appendChild(document.createTextNode(" "));
    stext.appendChild(makeWordSpan(raw));
  });

  line.appendChild(spk);
  if(cn) line.appendChild(zh);
  line.appendChild(stext);
  sline.appendChild(line);
  // 点句子行的空白处(非单词、非按钮)也播放整句
  sline._say = { text, role, audio, el: stext };
  sline.addEventListener("click", e=>{
    if(e.target.closest(".w") || e.target.closest(".mini")) return;
    e.stopPropagation();
    playOne(text, role, audio, null, stext);
  });
  if(cn){
    const tr = document.createElement("div");
    tr.className = "trans"; tr.textContent = cn;
    sline.appendChild(tr);
  }
  return sline;
}

/* 一整个气泡(问 或 答) */
function makeBubble(role, qa){
  const b = document.createElement("div");
  b.className = "bubble " + role;
  const who = document.createElement("span");
  who.className = "who";
  who.textContent = role === "q" ? "🤖 提问" : "🗣️ 回答";
  b.appendChild(who);
  if(role === "q"){
    b.appendChild(makeSline(qa.q, qa.q_cn, "q", qa.q_audio));
  }else{
    qa.a.forEach((s,i)=>{
      b.appendChild(makeSline(s, (qa.a_cn||[])[i], "a", (qa.a_audio||[])[i]));
    });
  }
  // 点气泡自身的空白处(边缘、角色标签)顺序播放整个气泡
  b.addEventListener("click", e=>{
    if(e.target !== b && !e.target.classList.contains("who")) return;
    const items = [...b.querySelectorAll(".sline")].map(s=>s._say).filter(Boolean);
    if(items.length) playSeq(items);
  });
  return b;
}

/* ================================================================
   学一学:点开卡片看对话,不自动播,句句可点、词词可点

const TAG_CLASS = {"sight word":"tag sight", sign:"tag sign", review:"tag review"};

/* 卡片算式("9-1" / "0")→ 彩色数字块,替代渲染不可控的 keycap emoji */
function eqHTML(eq){

    String(eq).split("-").map(x=>`<b>${x}</b>`).join("<i>−</i>") + `</span>`;

function imgSrc(p){ return p.startsWith("data:") ? p : LESSON_BASE + p; }

/* 拼读串联的问答没有配图时,把要拼的几个字母放大成色块顶上去。
   sot / mot 这类假词本来就没有对应的东西可画,硬配一张图等于告诉孩子这是真词;
   放字母反而正对着这一问要练的事 —— 看字母、出声、拼成词。 */
function letterTiles(word){
  return `<span class="eq letters"><b>${String(word).toUpperCase()}</b></span>`;
}

/* 考一考只收「一张图 = 一个词」的卡片。
   聚合卡(word 是 "more T words"/"sound it out" 这类页面标题,不是单词)会问出
   “Which one is more T words?”——无法作答;没图没算式的卡片则只能渲染成空白方块。
   两种都用 quiz:false 或缺少可视内容排除掉,课程可用题不足 2 张就整个隐藏考一考。 */
/* 一轮打卡的题量上限(闯关和考一考各自计) */
const ROUND_MAX = 12;

function quizCards(){
  return (lesson.cards || []).filter(
    c => c.quiz !== false && (c.image || c.eq || c.emoji));
}

/* 考一考有两种问法,同一批图共用:
   - word 题「哪一个是 X?」—— 只在卡的 word 就是画里那个东西时成立
   - sent 题「听一听,说的是哪一张?」—— 播这条问答的答句音频,选图
   虚词卡(here / is / to / my / like)的 word 根本画不出来,word 题无解;
   但它们底下的问答各自有单格图和答句音频,改成听句选图就成立了,
   而且练的是"听懂整句"而不是"认单词",对虚词才是对的考法。*/
/* 套话句式:说的是"这个词"不是画面,不能拿来听句选图
   ("It's sight word my." 对着任何图都成立) */
const QUIZ_FORMULA = /^(it's|this is|it is)\s+(sight word|key word|letter|number)\b|\bbegins with\b|\bends with\b|\bmakes the sound\b|belong to|family\.?$/i;

/* quiz:false 只挡 word 题,不该连带挡掉好的 sent 题 ——
   虚词卡(is / to)的 word 问不出来,但它每一问都有自己的单格图和答句,
   听句选图完全成立。所以 sent 题只认「这一问自己的图」:
   - t.image 是拆图时回填的单格图,一问一图,可靠
   - 整张卡只有一问、且这张卡本身可考时,卡片图就是这一问的图
   反过来,残余聚合卡(sort it out / need)只有一张拼图、没有单格图,
   两种题都出不来,正是我们要的。*/
/* 这张卡的图是不是「画着好几样东西的整版拼图」。拼图配一句话必然对不上
   (recycling-sort 四格里根本没有 glass),两种考题都出不来。
   ⚠️ 这是**卡片上显式声明**的,不要再退回按文件名推断。
   曾经的写法是「同一课里有别的图以它的名字加连字符开头,它就是拼图」——
   因为拆图的单格图叫 <拼图名>-<词>.webp。但这是把语义塞进文件名,
   一撞前缀就误伤:o-box.webp(纸箱里的狐狸)被 o-box-fox-in.webp 顶掉、
   f-fox 被 f-fox-forest 顶掉…… 实测 10 张正经的一图一词卡被挡在考一考外面,
   而它们跟拼图毫无关系,只是名字撞了。命名从此可以自由取。*/
function isCollage(card){
  return !!(card && card.collage);
}

function quizItems(){
  const items = [];
  for(const c of (lesson.cards || [])){
    // 整版拼图当选项永远是坏题(画着四样东西,问哪一个是 X 无从答起),
    // 两种题都挡掉,不必等数据侧补 quiz:false
    const wordOK = c.quiz !== false && !!(c.image || c.eq || c.emoji)
                   && !isCollage(c);
    if(wordOK)
      items.push({kind:"word", c, image:c.image, eq:c.eq, emoji:c.emoji,
                  pic: c.image || c.eq || c.emoji});
    for(const t of c.dialog){
      const img = t.image || (c.dialog.length === 1 && !isCollage(c) ? c.image : null);
      if(!img || !t.a_audio) continue;
      // 一问的答句可能不止一条:["It's sight word my.", "This is my toy."]
      // 第一条常是套话(说的是词不是画面),往后找第一条真正描述画面、且配了音的
      const ai = t.a.findIndex((s, i) => t.a_audio[i] && !QUIZ_FORMULA.test(s));
      if(ai >= 0) items.push({kind:"sent", c, qa:t, ai, image:img, pic:img});
    }
  }
  return items;
}
/* 选项池:按图去重(同一张图既有 word 题又有 sent 题,做选项时只算一个) */
function quizPics(){
  const seen = new Set();
  return quizItems().filter(it => !seen.has(it.pic) && seen.add(it.pic));
}

  const play = document.createElement("button");
  play.className = "btn blend-play";
  play.textContent = wordOnly ? "🔊 听单词发音" : "🔊 听3个纯音 → 整词";
  play.onclick = e=>{
    e.stopPropagation();
    if(wordOnly){
      playWord(c.word.toLowerCase());
      return;
    }
    if(p.blend_audio){
      playSeq([{text:c.word, role:"w", audio:p.blend_audio, el:play, noTts:true}]);
      return;
    }
    const items = p.parts.filter(x=>x.sound).map((part,i)=>({
      text:part.text, role:"w", audio:phonicsAudio(part.sound),
      el:tiles.querySelector(`[data-part="${i}"]`), noTts:true
    }));
    items.push({text:p.rime.text, role:"w", audio:phonicsAudio(p.rime.sound), el:rime, noTts:true});
    items.push({text:c.word, role:"w", audio:(lesson.word_audio||{})[c.word.toLowerCase()], el:word});
    playSeq(items);
  };
  if(!wordOnly) box.appendChild(play);
  return box;
}

// 展开后再补一下:卡片头别缩在吸顶条底下,卡片尾别掉出屏幕。
// 两个诉求冲突时(长卡装不下)以"头露出来"为准——孩子要先看见点的是哪个词
function revealCard(d){
  const bar = document.querySelector(".topbar").getBoundingClientRect().bottom;
  const r = d.getBoundingClientRect();
  const topRoom = r.top - (bar + 8);            // >0 说明头下方还有余量可以往上滚
  const overflow = r.bottom - (innerHeight - 8); // >0 说明卡尾露在屏幕外
  let delta = 0;
  if(topRoom < 0) delta = topRoom;
  else if(overflow > 0) delta = Math.min(overflow, topRoom);
  // 用瞬时滚动:平滑滚动在部分内核里被静默忽略(预览浏览器就是),
  // 补位补不上等于没修;这里位移都不大,跳一下也比露不出来强
  if(delta) window.scrollBy(0, delta);
}

function renderLearn(){
  const list = document.getElementById("learnList");
  list.innerHTML = "";
  let lastGroup = null;
  lesson.cards.forEach(c=>{
    if(c.phonics && c.phonics.group !== lastGroup){
      lastGroup = c.phonics.group;
      const group = document.createElement("div");
      group.className = "sound-group"; group.textContent = lastGroup;
      list.appendChild(group);
    }
    const d = document.createElement("div");
    d.className = "panel lcard";

    const head = document.createElement("div");
    head.className = "lhead";
    head.innerHTML = `
      <span class="slot">${
        c.image ? `<img class="thumb" src="${imgSrc(c.image)}" alt="">`
                : c.eq ? eqHTML(c.eq)
                : `<span class="emoji">${c.emoji||"⬜"}</span>`}</span>
      <div><div class="word">${c.word}</div><div class="cn">${c.cn||""}</div></div>
      <span class="${tagClass(c.tag)}">${c.tag||"word"}</span>`;
    head.onclick = ()=>{
      const wasOpen = d.classList.contains("open");
      // 展开前先记下这张卡在屏幕上的位置:收起上面那张卡会把内容整体抽走,
      // 页面滚动位置却不变,卡片就往上窜——看着像"底边钉住、朝上展开",
      // 头部连同刚点的词一起被顶出屏幕。展开后按位移把滚动补回去
      const anchor = head.getBoundingClientRect().top;
      document.querySelectorAll(".lcard").forEach(x=>x.classList.remove("open"));
      stopAllSound();
      if(!wasOpen){
        d.classList.add("open");
      }
      window.scrollBy(0, head.getBoundingClientRect().top - anchor);
      if(!wasOpen) revealCard(d);
    };
    const wordPlay = document.createElement("button");
    wordPlay.className = "mini word-play";
    wordPlay.textContent = "🔊";
    wordPlay.onclick = e=>{
      e.stopPropagation();
      playWord(c.word.toLowerCase());
    };
    head.insertBefore(wordPlay, head.querySelector(".tag"));
    d.appendChild(head);

    const dialog = document.createElement("div");
    dialog.className = "dialog";
    // 只要有问答带了自己的单格图,就整张卡改成"一问一图"(和闯关的 qa.image||c.image 一致):
    // 图不再顶在最上面滚出屏幕,没有单格图的那几问回落到卡片图,就近显示
    const perQA = c.dialog.some(qa=>qa.image);
    if(c.image && !perQA){
      const img = document.createElement("img");
      img.className = "pic"; img.src = imgSrc(c.image); img.alt = c.word;
      dialog.appendChild(img);
    }else if(c.eq){
      // 没有配图的算式卡:把算式放大顶上,一眼看清在问什么
      const box = document.createElement("div");
      box.className = "eq-box";
      box.innerHTML = eqHTML(c.eq);
      dialog.appendChild(box);
    }
    if(c.phonics) dialog.appendChild(makePhonicsPanel(c));
    c.dialog.forEach(qa=>{
      const pic = perQA ? (qa.image || c.image) : null;
      if(pic){
        const img = document.createElement("img");
        img.className = "pic"; img.src = imgSrc(pic);
        dialog.appendChild(img);
      }else if(perQA && /^[a-z]{2,6}$/i.test(qa.key[0] || "")){
        // 这一问没图、卡片也没图 —— 放字母,不要留空
        const box = document.createElement("div");
        box.className = "eq-box";
        box.innerHTML = letterTiles(qa.key[0]);
        dialog.appendChild(box);
      }
      dialog.appendChild(makeBubble("q", qa));
      dialog.appendChild(makeBubble("a", qa));
    });
    d.appendChild(dialog);
    list.appendChild(d);
  });
}

/* ================================================================
   问答闯关:机器人读问题,孩子回答;答案气泡同样句句词词可点
   ================================================================ */
const pbox = document.getElementById("practiceBox");
let pOrder = [], pc = 0, pq = 0;
/* 音标类答案的干扰项池:已教的 11 个字母音 + 已教的词族韵脚 */
const PHONEME_CHIPS = ["/s/","/t/","/m/","/a/","/n/","/o/","/f/","/i/","/r/","/b/","/d/"];
const RIME_CHIPS    = ["/an/","/at/","/ot/","/ad/","/id/","/it/"];
/* 同类干扰项池:问颜色就给颜色,问数字就给数字。
   只收 audio/words/ 里真有音频的词 —— 选项要能点读,没音频的词(blue/green/
   brown/purple、star/heart)宁可不用,也不能让孩子点了没声音。*/
const COLOR_CHIPS  = ["red","yellow","pink","black","white","orange","gray"];
const NUM_CHIPS    = ["zero","one","two","three","four","five","six","seven","eight","nine","ten"];
const LETTER_CHIPS = ["s","t","m","a","n","o","f","i","r","b","d"];
const SHAPE_CHIPS  = ["circle","square","triangle","rectangle"];

/* 这个 key 属于哪一类?返回同类词池;普通名词返回 null(改用同课的词做干扰项) */
function chipFamily(k){
  if(/^\/[a-z]+\/$/.test(k)) return k.length > 3 ? RIME_CHIPS : PHONEME_CHIPS;
  if(COLOR_CHIPS.includes(k))  return COLOR_CHIPS;
  if(NUM_CHIPS.includes(k))    return NUM_CHIPS;
  if(LETTER_CHIPS.includes(k)) return LETTER_CHIPS;
  if(SHAPE_CHIPS.includes(k))  return SHAPE_CHIPS;
  return null;
}

/* 选项的点读音频。普通词走 audio/words/(全局池,跨课复用);
   音标不在 words/ 里也不该在 —— 得走 audio/phonics/,且元音要按
   gen_audio.py 的 PHONEME_MAP 转(/a/→ae、/o/→aa、/i/→ih),
   直接按 words/ 拼路径会 404。*/
const PHONEME_MAP = {a:"ae", e:"eh", i:"ih", o:"aa", u:"ah", ks:"x", kw:"qu"};
function audioSlug(t){
  return t.toLowerCase().replace(/'/g,"-").replace(/[^a-z0-9-]+/g,"-")
          .replace(/^-+|-+$/g,"");
}
function chipAudio(k){
  const m = k.match(/^\/([a-z]+)\/$/);
  if(m) return "audio/phonics/" + (PHONEME_MAP[m[1]] || m[1]) + ".mp3";
  return (lesson.word_audio && lesson.word_audio[k]) || "audio/words/" + audioSlug(k) + ".mp3";
}
/* 依次朗读三个选项并高亮 —— 孩子还不认字,选项是纯文本等于让他认读,
   必须听得到才谈得上"选"。playSeq 自带 el 高亮和 404 回落 TTS。*/
function readChips(){
  const btns = [...document.querySelectorAll("#ansChips .ans-chip")];
  if(!btns.length) return;
  playSeq(btns.map(b=>({text: b.dataset.k, role: "w",
                        audio: chipAudio(b.dataset.k), el: b})));
}

/* 闯关只收「能出成三选一」的问。
   有些问天生做不成选择题:"What can chips show?" 的答案是「同样多」,而本课能抽到的
   干扰项只有数字 —— 出成 four / same / ten,而「chips can show four」本身就是对的,
   孩子选 four 会被判错。这类问在数据里标 "practice": false:
   学一学照常教、照常点读,只是不进闯关。
   (对照:卡级的 "quiz": false 挡的是考一考的「哪一个是 X」,两者管的不是一回事) */
function askable(c){ return (c.dialog || []).filter(t => t.practice !== false); }

function startPractice(){
  // 每轮最多 ROUND_MAX 问:整课 25 问对 K2 孩子太长,而打卡是天天来的 ——
  // 每次随机抽一轮,几天下来自然覆盖全课,还不重样
  const bag = lesson.cards.slice().sort(()=>Math.random()-0.5);
  pOrder = []; let n = 0;
  for(const c of bag){
    const k = askable(c).length;
    if(!k) continue;                             // 整张卡的问都不进闯关
    if(pOrder.length && n + k > ROUND_MAX) continue;
    pOrder.push(c); n += k;
    if(n >= ROUND_MAX) break;
  }
  pc = 0; pq = 0;
  askQuestion();
}
function curCard(){ return pOrder[pc]; }
function curQA(){ return askable(curCard())[pq]; }

let pRevealed = false;   // 当前题是否已展示过答案(防止重复追加气泡)
function askQuestion(){
  pRevealed = false;
  const c = curCard(), qa = curQA();
  const total = pOrder.reduce((s,x)=>s+askable(x).length,0);
  const doneN = pOrder.slice(0,pc).reduce((s,x)=>s+askable(x).length,0) + pq;
  const pic = qa.image || c.image;
  // 词条出现在答案里就不显示,否则等于把答案写在题面上
  const leaks = qa.a.some(s => norm(s).includes(norm(c.word)));
  pbox.innerHTML = `
    <div class="progress">第 ${doneN+1} / ${total} 问</div>
    <div class="p-head">
      ${pic ? `<img class="pic mid" src="${imgSrc(pic)}" alt="">`
            : c.eq ? `<div>${eqHTML(c.eq)}</div>`
            : `<div class="p-emoji">${c.emoji||"⬜"}</div>`}
      ${leaks ? "" : `<div class="p-word">${c.word}</div>`}
    </div>
    <div class="chat" id="pChat"></div>
    <div class="result-emoji" id="pResult"></div>
    <div class="p-hint">🔊 听完题目，大声说出答案，再点一点它</div>
    <div class="ans-chips" id="ansChips"></div>
    <div class="ctrl" id="pCtrl">
      <button class="btn" onclick="readChips()">🔊 听选项</button>
      <button class="btn" onclick="reveal(false)">👀 看答案</button>
    </div>`;
  const chat = document.getElementById("pChat");
  chat.appendChild(makeBubble("q", qa));
  // key 是关键词数组(如 ["bus","stop"]),拼起来才是完整答案
  const correct = qa.key.join(" ");
  // 干扰项和正确答案同类:问音给音、问颜色给颜色、问数字给数字。
  // 混类(red / astronaut / catch)等于送分 —— 孩子不用听懂,
  // 只要看出"另外两个明显不是一类"就能排除掉。
  // 普通名词从**整课**的词里抽:pOrder 只是本轮抽中的 ROUND_MAX 问,
  // 用它当选项来源会让某些轮次同类候选不足。
  // 不用 flatMap(ES2019,iOS 12 以下没有,会抛错让整个闯关白屏)
  const plain = [...new Set(
    lesson.cards.reduce((acc, c)=>acc.concat(askable(c).map(d=>d.key.join(" "))), [])
  )].filter(k=>!chipFamily(k));
  let cands = (chipFamily(correct) || plain).filter(k=>k!==correct);
  if(cands.length < 2)   // 同类词不够(整课就这么几个)才放宽,保证始终三个选项
    cands = [...new Set([...cands, ...plain, ...NUM_CHIPS])].filter(k=>k!==correct);
  const pool = shuffle(cands).slice(0, 2);
  const chipsBox = document.getElementById("ansChips");
  shuffle([correct, ...pool]).forEach(k=>{
    const b = document.createElement("button");
    b.className = "ans-chip";
    b.textContent = k;
    b.dataset.k = k;
    b.onclick = ()=>{
      stopAllSound();          // 打断正在念的选项,别和判分音重叠
      chipsBox.querySelectorAll(".speaking").forEach(x=>x.classList.remove("speaking"));
      if(k === correct){
        b.classList.add("right");
        chipsBox.querySelectorAll(".ans-chip").forEach(x=>x.disabled=true);
        document.getElementById("pResult").textContent = "🎉";
        addStars(2);
        // 答对就停在这儿:绿色选项留在屏幕上,出口(下一题 / 看答案)自己选。
        // 以前会在 2.6 秒后自动翻到答案页 —— 孩子正要点下一题,画面自己跳走了
        showNext(true);
        praise(randPraise());
      }else{
        b.classList.add("wrong");
        document.getElementById("pResult").textContent = "🤔";
        praise("Try again!");
        setTimeout(()=>b.classList.remove("wrong"), 600);
      }
    };
    chipsBox.appendChild(b);
  });
  // 题目自动播。孩子还不认字,题面对他就是一串图形 —— 不出声就没法答,
  // 每题都得先按一下按钮纯属多一道手续(考一考也是渲染完直接 ask())。
  // 选项仍然手动(🔊 听选项):认得的词他会伸手就点,自动念选项会变成边选边播。
  // 要重听题目,点问题气泡或气泡里的 🔊 即可,和以前那个按钮效果一样。
  playQuestion();
}

/* 念题目:自动播和重听走同一条路,高亮的是问题气泡里的句子 */
function playQuestion(){
  const qa = curQA();
  playOne(qa.q, "q", qa.q_audio, null,
          document.querySelector("#pChat .bubble.q .stext"));
}

/* 答完这题的出口。「看答案」只在还没翻答案时给,翻过就只剩下一题 */
function showNext(gotStar){
  document.querySelectorAll(".p-hint").forEach(x=>x.style.display="none");
  document.getElementById("pCtrl").innerHTML = `
    ${gotStar ? '' : '<button class="btn" onclick="selfStar(this)">我会读了 ⭐</button>'}
    ${pRevealed ? '' : `<button class="btn" onclick="reveal(${gotStar})">👀 看答案</button>`}
    <button class="btn go" onclick="nextQA()">下一题 ➜</button>`;
}
function reveal(gotStar){
  if(pRevealed) return;
  pRevealed = true;
  const qa = curQA();
  const ch = document.getElementById("ansChips");
  if(ch) ch.style.display = "none";
  document.getElementById("pChat").appendChild(makeBubble("a", qa));
  showNext(gotStar);
  playSeq(qa.a.map((s,i)=>({text:s, role:"a", audio:(qa.a_audio||[])[i]})));
}
function selfStar(btn){ addStars(1); btn.disabled = true; btn.textContent = "⭐ +1"; }

function nextQA(){
  stopAllSound();
  pq++;
  if(pq >= askable(curCard()).length){ pq = 0; pc++; }
  if(pc >= pOrder.length){ return finishPractice(); }
  askQuestion();
}
function finishPractice(){
  pbox.innerHTML = `
    <div class="done">
      <div class="big">🏆</div>
      问答闯关完成！<br>现在有 ⭐ × ${stars}
      <br><button class="big-btn" onclick="startPractice()">再来一轮</button>
    </div>`;
  playOne("You did it! Amazing!", "q",
          lesson.praise_audio ? lesson.praise_audio["You did it! Amazing!"] : null);
}

/* ================================================================
   考一考:听音选图
   ================================================================ */
let quizOrder = [], qi = 0;
const qbox = document.getElementById("quizBox");
function shuffle(a){return a.slice().sort(()=>Math.random()-0.5);}
function startQuiz(){
  // 一张图一轮只考一次:同一张图的 word 题和 sent 题不在同一轮里重复出现,
  // 每轮随机挑到哪一种,几天下来两种问法都会碰上
  const seen = new Set();
  quizOrder = shuffle(quizItems())
    .filter(it => !seen.has(it.pic) && seen.add(it.pic))
    .slice(0, ROUND_MAX);
  qi = 0; nextQuestion();
}
function nextQuestion(){
  if(qi >= quizOrder.length){ return finishQuiz(); }
  const it = quizOrder[qi], c = it.c;
  // 干扰项不能和正解同词:-an 课里 man/fan/tan 各有两张卡两张图(词族卡一张、
  // 生活场景卡一张),另一张混进选项就成了"两个都对",孩子点中它反而算错
  const pool = quizPics().filter(x => x.pic !== it.pic && norm(x.c.word) !== norm(c.word));
  const nOpt = Math.min(3, pool.length + 1);
  const opts = shuffle([it, ...shuffle(pool).slice(0, nOpt-1)]);
  const sent = it.kind === "sent";
  qbox.innerHTML = `
    <div class="progress">第 ${qi+1} / ${quizOrder.length} 题</div>
    <div class="q-prompt">${sent ? "听一听，说的是哪一张？" : "哪一个是……"}</div>
    ${sent ? `<div class="q-sent">${it.qa.a[it.ai]}</div>`
           : `<div class="q-word">${c.word}</div>`}
    <button class="speak-btn" id="qSpeak">🔊</button>
    <div class="opts ${nOpt===2?'two':''}">
      ${opts.map(o=>o.image
        ? `<button class="opt haspic" data-p="${o.pic}"><img src="${imgSrc(o.image)}" alt=""></button>`
        : `<button class="opt" data-p="${o.pic}">${o.eq ? eqHTML(o.eq) : (o.emoji||"⬜")}</button>`
      ).join("")}
    </div>`;
  const ask = sent
    ? ()=>playOne(it.qa.a[it.ai], "a", it.qa.a_audio[it.ai])
    : ()=>playOne("Which one is " + c.word + "?", "q", c.quiz_audio);
  document.getElementById("qSpeak").onclick = ask;
  ask();
  qbox.querySelectorAll(".opt").forEach(b=>{
    b.onclick = ()=>{
      if(b.dataset.p === it.pic){
        b.classList.add("right"); addStars(1); qi++;
        praise(randPraise());
        setTimeout(nextQuestion, 1400);
      }else{
        b.classList.add("wrong");
        praise("Try again!");
        setTimeout(()=>b.classList.remove("wrong"), 600);
      }
    };
  });
}
function finishQuiz(){
  qbox.innerHTML = `
    <div class="done">
      <div class="big">🎉</div>
      今日打卡完成！<br>现在有 ⭐ × ${stars}
      <br><button class="big-btn" onclick="startQuiz()">再来一轮</button>
    </div>`;
  praise("You did it! See you tomorrow!");
}

  renderLearn();
}

function wireLessonNav(){
  [[-1, "prevLesson", "上一课"], [1, "nextLesson", "下一课"]].forEach(([d, elId, label]) => {
    const btn = document.getElementById(elId);
    const target = LESSON_AT >= 0 ? LESSON_ORDER[LESSON_AT + d] : null;
    btn.disabled = !target;
    btn.title = target ? `${label}：${target.title}` : "";
    btn.onclick = target ? () => gotoLesson(d) : null;
  });
}

/* 换课:不刷新页面,原地换内容 + 左右滑出滑入。
   整页跳转会重新加载所有资源,既慢又没法做过渡动画。 */
let switching = false;
function showPages(){                          // 无论如何都要把页面还原成可见
  const wrap = document.getElementById("pages");
  wrap.style.transition = "none";
  wrap.style.transform = "translateX(0)";
  wrap.style.opacity = "1";
}
async function gotoLesson(dir){
  const n = LESSON_AT + dir;
  if(switching || LESSON_AT < 0 || n < 0 || n >= LESSON_ORDER.length) return;
  switching = true;
  const wrap = document.getElementById("pages");
  const out = dir > 0 ? -60 : 60;             // 往哪边滑出去
  try{
    stopAllSound();
    wrap.style.transition = "transform .2s ease-in, opacity .2s ease-in";
    wrap.style.transform = `translateX(${out}px)`;
    wrap.style.opacity = "0";
    await new Promise(r => setTimeout(r, 200));

    const id = LESSON_ORDER[n].id;
    const r = await fetch(LESSON_BASE + id + ".json");
    if(!r.ok) throw new Error("lesson " + id);
    lesson = await r.json();
    LESSON_AT = n;
    history.pushState({lesson:id}, "", "app.html?lesson=" + id);
    showPage("learn");
    applyLesson();
    window.scrollTo(0, 0);

    wrap.style.transition = "none";           // 从另一侧就位,再滑进来
    wrap.style.transform = `translateX(${-out}px)`;
    void wrap.offsetWidth;                    // 强制重排,否则两次赋值会被合并
    wrap.style.transition = "transform .26s cubic-bezier(.22,.61,.36,1), opacity .26s ease-out";
    wrap.style.transform = "translateX(0)";
    wrap.style.opacity = "1";
    await new Promise(r => setTimeout(r, 260));
  }catch(e){
    showPages();                              // 换课失败也不能把页面留在隐形状态
  }finally{
    switching = false;                        // 否则一次失败就再也换不了课
  }
}

// 浏览器前进/后退:同样原地换,不整页刷新
addEventListener("popstate", async e => {
  const id = new URLSearchParams(location.search).get("lesson");
  const n = LESSON_ORDER.findIndex(x => x.id === id);
  if(n < 0 || n === LESSON_AT) return;
  try{
    const r = await fetch(LESSON_BASE + id + ".json");
    if(r.ok) lesson = await r.json();
  }catch(err){}
  LESSON_AT = n;
  stopAllSound(); showPage("learn"); applyLesson(); showPages(); window.scrollTo(0, 0);
});
/* 用捕获阶段:单词、气泡等子元素会 stopPropagation,冒泡阶段收不到 */
addEventListener("pointerdown", e => {
  swX = e.clientX; swY = e.clientY; swDx = 0; swOn = true;
}, true);
addEventListener("pointermove", e => { if(swOn) swDx = e.clientX - swX; }, true);
addEventListener("pointercancel", () => { swOn = false; swDx = 0; }, true);
addEventListener("pointerup", e => {
  if(!swOn) return;
  swOn = false;
  const dy = e.clientY - swY;
  // 要够长、且明显是横向,才算换课(否则会误伤点单词、滚页面)
  if(Math.abs(swDx) > 80 && Math.abs(swDx) > Math.abs(dy) * 1.5){
    gotoLesson(swDx < 0 ? 1 : -1);
  }
}, true);

/* 混合复习:把各课的卡片凑成一节临时的课。
   打卡最需要的是螺旋复现 —— 学完一课就再也不碰,等于没学。每节课抽 1-2 张卡,
   ROUND_MAX 再从中抽一轮,所以每次进来题目都不一样,而且干扰项来自别的课,
   比课内复习难一档。卡里的图和音频路径本来就相对 lessons/,混着用不用改写。 */
async function buildReviewLesson(perLesson = 2){
  const idx = await (await fetch(LESSON_BASE + "index.json", {cache:"no-store"})).json();
  const all = await Promise.all((idx.lessons || []).map(l =>
    fetch(LESSON_BASE + l.id + ".json").then(r => r.ok ? r.json() : null).catch(()=>null)));
  const cards = [], word_audio = {}, praise_audio = {};
  all.filter(Boolean).forEach(d => {
    Object.assign(word_audio, d.word_audio || {});
    Object.assign(praise_audio, d.praise_audio || {});
    // 优先挑出得了题的卡;一张都没有的课(整课都是虚词)退而取全部,至少能学一学
    const pool = d.cards.filter(c => c.quiz !== false && (c.image || c.eq || c.emoji));
    const pick = (pool.length ? pool : d.cards).slice().sort(()=>Math.random()-0.5);
    cards.push(...pick.slice(0, perLesson));
  });
  return {title: "混合复习 · 各课随机抽题", cards: cards.sort(()=>Math.random()-0.5),
          word_audio, praise_audio};
}

(async function init(){
  const id = new URLSearchParams(location.search).get("lesson");
  lesson = FALLBACK_LESSON;
  if(id === "review"){
    try{ lesson = await buildReviewLesson(); }catch(e){}
  }else if(id){
    try{
      const r = await fetch(LESSON_BASE + id + ".json");
      if(r.ok) lesson = await r.json();
    }catch(e){}
  }
  try{
    const r = await fetch(LESSON_BASE + "dictionary.json");
    if(r.ok) DICT = Object.assign(DICT, await r.json());
  }catch(e){}
  try{
    const r = await fetch(LESSON_BASE + "phonics.json");
    if(r.ok) PHONICS = (await r.json()).sounds || {};
  }catch(e){}
  try{
    const r = await fetch(LESSON_BASE + "index.json", {cache:"no-store"});
    if(r.ok){
      LESSON_ORDER = (await r.json()).lessons || [];
      LESSON_AT = LESSON_ORDER.findIndex(x => x.id === id);
    }
  }catch(e){}
  history.replaceState({lesson:id}, "", location.href);
  applyLesson();
})();
</script>
